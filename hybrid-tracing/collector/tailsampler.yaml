# OpenTelemetry Collector (contrib) tail-sampling tier, on-prem. Run several pods behind a headless Service.
# Env: SKEW_CORRECTOR_ENDPOINT (base URL of the skew-corrector, e.g. http://skew-corrector:4318).
# Keeps every trace with an error, a slow request, a TTFT over one second, or any span from the neocloud
# (cross-site traces are the ones clock skew distorts), plus 10% of the rest. Kept traces go to the
# skew-corrector as OTLP/JSON, which corrects clock skew and forwards them to the trace store.
extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20
  tail_sampling:
    decision_wait: 10s
    num_traces: 200000
    expected_new_traces_per_sec: 2000
    policies:
      - name: errors
        type: status_code
        status_code:
          status_codes: [ERROR]
      - name: slow-requests
        type: latency
        latency:
          threshold_ms: 5000
      - name: ttft-over-1s
        type: ottl_condition
        ottl_condition:
          error_mode: ignore
          span:
            - 'attributes["gen_ai.latency.time_to_first_token"] > 1.0'
      - name: cross-site
        type: ottl_condition
        ottl_condition:
          error_mode: ignore
          span:
            - 'resource.attributes["site"] == "neocloud"'
      - name: baseline
        type: probabilistic
        probabilistic:
          sampling_percentage: 10
  batch: {}

exporters:
  otlphttp/skew-corrector:
    endpoint: ${env:SKEW_CORRECTOR_ENDPOINT}
    encoding: json
    compression: gzip
    retry_on_failure:
      enabled: true
    sending_queue:
      enabled: true
      queue_size: 10000

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, tail_sampling, batch]
      exporters: [otlphttp/skew-corrector]
