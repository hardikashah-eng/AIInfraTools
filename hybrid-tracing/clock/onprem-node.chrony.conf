# chrony on on-prem GPU and service nodes.
# Best: the node runs ptp4l itself (PTP-capable NIC) and chrony reads its hardware clock.
# Otherwise: NTP to the on-prem time servers with hardware timestamping, typically within tens of microseconds.
#
# Replace: /dev/ptp0 and the time server names.

# With ptp4l running on this node (comment out if the NIC has no PTP support):
refclock PHC /dev/ptp0 poll 0 dpoll -2 offset 0 precision 1e-7 prefer refid PTP

# The on-prem time servers (fallback when PTP is running, primary when it is not).
server timeserver-1.onprem.internal iburst xleave minpoll 4 maxpoll 6
server timeserver-2.onprem.internal iburst xleave minpoll 4 maxpoll 6

hwtimestamp *
minsources 1
# Step only at boot; afterwards slew, so span durations stay monotonic.
makestep 0.1 3
rtcsync
driftfile /var/lib/chrony/drift
logdir /var/log/chrony
log tracking
