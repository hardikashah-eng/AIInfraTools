# chrony on neocloud nodes.
# They follow the ON-PREM time servers over the private link, not the provider's clock, so both sites share
# one reference: typically 50 µs to 1 ms, limited by asymmetry on the WAN path. The provider's time
# source stays configured as a fallback only.
#
# Replace: the on-prem time server addresses (as reached over the private link) and the provider time source.

# The on-prem time servers, preferred. xleave asks for interleaved mode (more accurate server transmit times).
server timeserver-1.onprem.internal iburst xleave minpoll 4 maxpoll 6 prefer
server timeserver-2.onprem.internal iburst xleave minpoll 4 maxpoll 6 prefer
# With NTS enabled on the time servers, add `nts` to both lines above.

# The provider's local time source, used only if the private link is down (replace with your provider's).
server time.neocloud-provider.example iburst

# Refuse a source whose error bound is over 5 ms rather than follow it.
maxdistance 0.005
hwtimestamp *
minsources 1
makestep 0.1 3
rtcsync
driftfile /var/lib/chrony/drift
logdir /var/log/chrony
log tracking
