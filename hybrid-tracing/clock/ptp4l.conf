# linuxptp ptp4l on on-prem nodes and time servers: follow the site's PTP grandmaster with hardware timestamps.
#   ptp4l -f /etc/ptp4l.conf -i <interface>
# chrony then reads the NIC hardware clock (/dev/ptpN) as its reference (see the *.chrony.conf files), so no
# phc2sys is needed. Match domainNumber and transport to your grandmaster and switches (boundary/transparent clocks).
[global]
clientOnly              1
domainNumber            0
time_stamping           hardware
network_transport       UDPv4
delay_mechanism         E2E
tx_timestamp_timeout    50
logging_level           6
summary_interval        6
