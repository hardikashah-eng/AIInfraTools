# chrony on the on-prem time servers (run two or more).
# They follow the PTP grandmaster through the NIC's hardware clock and serve NTP to every on-prem node and,
# over the private link, to every neocloud node, so both sites share ONE time reference.
#
# Replace: /dev/ptp0 (the PHC of the NIC that runs ptp4l), the allow lists, and the fallback servers.

# Primary reference: the NIC hardware clock, disciplined by ptp4l (see ptp4l.conf). Sub-microsecond on a PTP LAN.
refclock PHC /dev/ptp0 poll 0 dpoll -2 offset 0 precision 1e-7 prefer refid PTP

# Fallback if PTP is lost: the other time servers and an upstream NTP source. Never preferred over PTP.
server timeserver-2.onprem.internal iburst minpoll 4 maxpoll 6
pool pool.ntp.org iburst maxsources 2

# Serve time to the on-prem fabric and to the neocloud over the private link (replace the CIDRs).
allow 10.0.0.0/8
allow 172.16.0.0/12
# Hardware timestamps on NTP packets (needs NIC support) and interleaved mode for clients that ask for it.
hwtimestamp *

# If every source is lost, keep serving the held-over clock at a stratum that clients rank below real sources,
# and agree on it between the time servers (orphan mode), so the two sites never split onto different times.
local stratum 8 orphan

# Authenticated time for clients across the private link (NTS). Uncomment once certificates are in place,
# and add `nts` to the server lines in neocloud-node.chrony.conf.
# ntsserverkey /etc/chrony/nts.key
# ntsservercert /etc/chrony/nts.crt

makestep 0.1 3
rtcsync
driftfile /var/lib/chrony/drift
logdir /var/log/chrony
log tracking statistics
