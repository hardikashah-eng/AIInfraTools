<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 530" width="900" height="530" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>Hybrid tracing: one time reference, one trace pipeline</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#444"/></marker>
    <marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#b5532a"/></marker>
  </defs>
  <rect width="900" height="530" fill="#ffffff"/>
  <!-- sites -->
  <rect x="20" y="40" width="420" height="440" rx="14" fill="#eef6f1" stroke="#5a9c78"/>
  <text x="40" y="66" font-size="15" font-weight="bold" fill="#24553b">On-prem DC (time + trace reference)</text>
  <rect x="470" y="40" width="410" height="300" rx="14" fill="#f2effa" stroke="#7d6bc2"/>
  <text x="490" y="66" font-size="15" font-weight="bold" fill="#3f327a">Neocloud</text>
  <!-- time path -->
  <rect x="40" y="86" width="170" height="46" rx="8" fill="#fff" stroke="#b5532a"/>
  <text x="125" y="105" text-anchor="middle" font-weight="bold">PTP grandmaster</text>
  <text x="125" y="122" text-anchor="middle" fill="#555">GNSS / atomic</text>
  <rect x="250" y="86" width="170" height="46" rx="8" fill="#fff" stroke="#b5532a"/>
  <text x="335" y="105" text-anchor="middle" font-weight="bold">Time servers ×2</text>
  <text x="335" y="122" text-anchor="middle" fill="#555">chrony, PHC + NTP</text>
  <line x1="210" y1="109" x2="248" y2="109" stroke="#b5532a" stroke-width="1.6" marker-end="url(#t)"/>
  <rect x="490" y="86" width="370" height="46" rx="8" fill="#fff" stroke="#b5532a"/>
  <text x="675" y="105" text-anchor="middle" font-weight="bold">Neocloud nodes: chrony follows on-prem</text>
  <text x="675" y="122" text-anchor="middle" fill="#555">xleave, provider clock as fallback only</text>
  <line x1="420" y1="109" x2="488" y2="109" stroke="#b5532a" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#t)"/>
  <text x="454" y="150" text-anchor="middle" font-size="11" fill="#b5532a">NTP over private link</text>
  <!-- trace path -->
  <rect x="40" y="180" width="380" height="46" rx="8" fill="#fff" stroke="#444"/>
  <text x="230" y="199" text-anchor="middle" font-weight="bold">Gateway, router, prefill + collector agents</text>
  <text x="230" y="216" text-anchor="middle" fill="#555">site=onprem, ntp.offset, check-clock.sh</text>
  <rect x="490" y="180" width="370" height="46" rx="8" fill="#fff" stroke="#444"/>
  <text x="675" y="199" text-anchor="middle" font-weight="bold">Decode / burst pools + collector agents</text>
  <text x="675" y="216" text-anchor="middle" fill="#555">site=neocloud, same trace ID</text>
  <line x1="420" y1="203" x2="488" y2="203" stroke="#444" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="490" y="270" width="370" height="46" rx="8" fill="#fff" stroke="#444"/>
  <text x="675" y="289" text-anchor="middle" font-weight="bold">Neocloud gateway</text>
  <text x="675" y="306" text-anchor="middle" fill="#555">redact, disk queue, outbound mTLS</text>
  <line x1="675" y1="226" x2="675" y2="268" stroke="#444" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="40" y="270" width="380" height="46" rx="8" fill="#fff" stroke="#444"/>
  <text x="230" y="289" text-anchor="middle" font-weight="bold">On-prem gateway → tail sampler</text>
  <text x="230" y="306" text-anchor="middle" fill="#555">route by trace ID, keep every cross-site trace</text>
  <line x1="230" y1="226" x2="230" y2="268" stroke="#444" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="490" y1="293" x2="422" y2="293" stroke="#444" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="40" y="340" width="380" height="46" rx="8" fill="#fff8e6" stroke="#b5532a"/>
  <text x="230" y="359" text-anchor="middle" font-weight="bold">skew-corrector</text>
  <text x="230" y="376" text-anchor="middle" fill="#555">learns offsets from client/server pairs, shifts spans</text>
  <line x1="230" y1="316" x2="230" y2="338" stroke="#444" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="40" y="410" width="380" height="46" rx="8" fill="#e8f0fb" stroke="#3d6fb3"/>
  <text x="230" y="429" text-anchor="middle" font-weight="bold">Trace store + Grafana: one view</text>
  <text x="230" y="446" text-anchor="middle" fill="#555">Tempo / Jaeger</text>
  <line x1="230" y1="386" x2="230" y2="408" stroke="#444" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="20" y="510" font-size="12" fill="#555">Orange: time. Black: telemetry. Layer 1 synchronises, layer 2 measures (agents), layer 3 corrects (skew-corrector).</text>
</svg>
