# Builds the Agent Skills in skills/ from the tools, checks every SKILL.md and that the skills work from an isolated
# copy, validates the Claude Code plugin, and publishes the skill zips as an artifact. Pull requests don't need to
# commit the generated copies: skills-sync.yml regenerates them on main.
name: Skills
on:
  pull_request:
    paths:
      - 'skills/**'
      - 'scripts/**'
      - '.claude-plugin/**'
      - 'inference-sizer/**'
      - 'fleetscope/**'
      - 'hybrid-tracing/**'
      - 'gpu-health/**'
      - 'fleetops/**'
      - 'gpu-ledger/**'
      - '.github/workflows/skills.yml'
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - 'scripts/**'
      - '.claude-plugin/**'
permissions:
  contents: read
jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the skills from this commit's tools; every SKILL.md is valid
        run: node scripts/build-skills.mjs
      - name: Skills work from an isolated copy
        run: node --test scripts/test-skills.mjs
      - name: Claude Code plugin manifest validates
        run: npx -y @anthropic-ai/claude-code plugin validate .
      - name: Package
        run: node scripts/build-skills.mjs --zip dist/skills
      - uses: actions/upload-artifact@v4
        with:
          name: skills
          path: dist/skills/*.zip
