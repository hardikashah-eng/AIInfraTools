# Lint gate: undefined names, unused code, unreachable blocks (ESLint recommended; eslint.config.mjs).
name: lint
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
jobs:
  eslint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock --no-audit --no-fund eslint@9.39.5 @eslint/js@9.39.5 globals@15.15.0
      - run: npx eslint .
