# Weekly: are the formats the tools read and write still current upstream (vLLM metrics, Argo Rollouts / Flagger /
# Prometheus Operator / KServe / LWS schemas, NVSentinel events, OpenCost, OpenTelemetry GenAI, OpenInference, TraceLab)?
# Fails on a breaking change; opens (or updates) one "format drift" issue whenever anything isn't current.
name: formats
on:
  schedule: [{ cron: '17 14 * * 1' }]   # Mondays
  workflow_dispatch:
permissions: { contents: read, issues: write }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock --no-audit --no-fund yaml@2
      - name: Check formats against upstream
        id: check
        run: |
          node scripts/check-formats.mjs --json > formats.json || true
          node -e '
            const r = require("./formats.json"), bad = r.filter(x => x.status !== "ok");
            const md = ["| Format | Status | Detail |", "| --- | --- | --- |", ...r.map(x => `| ${x.name} | ${x.status} | ${String(x.detail).replace(/\|/g, "\\|")} |`)].join("\n");
            require("fs").writeFileSync("formats.md", md + "\n");
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, `drift=${bad.length ? "yes" : "no"}\nbreaking=${r.some(x => x.status === "breaking") ? "yes" : "no"}\n`);'
          cat formats.md >> "$GITHUB_STEP_SUMMARY"
      - name: Open or update the format drift issue
        if: steps.check.outputs.drift == 'yes'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh label create format-drift --color D93F0B --description "An upstream format changed" --force
          body="$(printf 'From the weekly format check (%s). Breaking means something the tools read is gone or a shipped manifest fails the new schema; newer means upstream moved on and nothing used changed.\n\n' "$(date -u +%F)"; cat formats.md)"
          n=$(gh issue list --label format-drift --state open --json number --jq '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" --body "$body"; else gh issue create --title "Format drift: upstream formats changed" --label format-drift --body "$body"; fi
      - name: Fail on a breaking change
        if: steps.check.outputs.breaking == 'yes'
        run: exit 1
