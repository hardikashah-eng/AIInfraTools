# Runs Inference Sizer's tests (including the cross-tool FleetScope export check) and checks dist/ is rebuilt.
name: Inference Sizer
on:
  pull_request:
    paths:
      - 'inference-sizer/**'
      - 'fleetscope/src/**'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Tests
        working-directory: inference-sizer
        run: npm run test:coverage   # the tests, with a floor on line and branch coverage (package.json)
      - name: dist/index.html is up to date
        working-directory: inference-sizer
        run: |
          node build.mjs
          git diff --exit-code -- dist/index.html || (echo "Run 'npm run build' in inference-sizer and commit dist/index.html." && exit 1)
