# Runs gpu-health's tests and its demo end to end.
name: GPU Health
on:
  pull_request:
    paths:
      - 'gpu-health/**'
      - '.github/workflows/gpu-health.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        working-directory: gpu-health
        run: npm test
      - name: Demo runs and writes a report
        working-directory: gpu-health
        run: |
          node tools/gpu-health.mjs demo --out /tmp/gh-demo
          test -s /tmp/gh-demo/report.html
          node tools/gpu-health.mjs actions list --state /tmp/gh-demo/state | grep -q 'scale-in:embed-svc'
          test -s /tmp/gh-demo/flakiness.html
          node tools/gpu-health.mjs flakiness --state /tmp/gh-demo/state | grep -q 'Node n2'
      - name: Mixed-vendor demo runs and reports coverage
        working-directory: gpu-health
        run: |
          node tools/gpu-health.mjs demo --mixed --out /tmp/gh-mixed
          grep -q 'Telemetry coverage' /tmp/gh-mixed/report.md
