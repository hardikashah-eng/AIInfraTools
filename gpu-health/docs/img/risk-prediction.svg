<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1616 1090" width="1616" height="1090" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><title>GPU failure prediction and risk-aware scheduling</title><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b2b2b"/></marker></defs><rect width="1616" height="1090" fill="#ffffff"/><text x="40" y="90" font-size="44" font-weight="700" text-anchor="start" fill="#2b2b2b">GPU failure prediction → risk-aware scheduling</text><text x="40" y="158" font-size="26" font-weight="400" text-anchor="start" fill="#555555">Score every GPU; keep critical jobs on green ones</text><rect x="40" y="250" width="256" height="408" rx="14" fill="#f5f5f2" stroke="#d6d6d0" stroke-width="1.5"/><text x="44" y="240" font-size="17" font-weight="700" text-anchor="start" fill="#2b2b2b">1 · Signals</text><rect x="64" y="274" width="208" height="72" rx="10" fill="#ffffff" stroke="#c9c9c2" stroke-width="1.2"/><text x="168.0" y="315.0" font-size="15" font-weight="400" text-anchor="middle" fill="#2b2b2b">DCGM / AMD exporter</text><rect x="64" y="370" width="208" height="72" rx="10" fill="#ffffff" stroke="#c9c9c2" stroke-width="1.2"/><text x="168.0" y="411.0" font-size="15" font-weight="400" text-anchor="middle" fill="#2b2b2b">Xid / dmesg parser</text><rect x="64" y="466" width="208" height="72" rx="10" fill="#ffffff" stroke="#c9c9c2" stroke-width="1.2"/><text x="168.0" y="507.0" font-size="15" font-weight="400" text-anchor="middle" fill="#2b2b2b">Test-suite results</text><rect x="64" y="562" width="208" height="72" rx="10" fill="#ffffff" stroke="#c9c9c2" stroke-width="1.2"/><text x="168.0" y="592.5" font-size="15" font-weight="400" text-anchor="middle" fill="#2b2b2b">Job outcomes · RMAs</text><text x="168.0" y="613.5" font-size="15" font-weight="400" text-anchor="middle" fill="#2b2b2b">(training labels)</text><path d="M296,454 L360,454" fill="none" stroke="#2b2b2b" stroke-width="2" marker-end="url(#head)"/><rect x="360" y="250" width="256" height="408" rx="14" fill="#f5f5f2" stroke="#d6d6d0" stroke-width="1.5"/><text x="364" y="240" font-size="17" font-weight="700" text-anchor="start" fill="#2b2b2b">2 · Features per GPU serial</text><rect x="384" y="274" width="208" height="104" rx="10" fill="#ffffff" stroke="#c9c9c2" stroke-width="1.2"/><text x="488.0" y="310.0" font-size="15" font-weight="700" text-anchor="middle" fill="#2b2b2b">Rates and trend</text><text x="488.0" y="331.0" font-size="15" font-weight="400" text-anchor="middle" fill="#2b2b2b">ECC · PCIe replay ·</text><text x="488.0" y="352.0" font-size="15" font-weight="400" text-anchor="middle" fill="#2b2b2b">NVLink CRC · Xids</text><rect x="384" y="402" width="208" height="104" rx="10" fill="#ffffff" stroke="#c9c9c2" stroke-width="1.2"/><text x="488.0" y="438.0" font-size="15" font-weight="700" text-anchor="middle" fill="#2b2b2b">Wear</text><text x="488.0" y="459.0" font-size="15" font-weight="400" text-anchor="middle" fill="#2b2b2b">spare rows left ·</text><text x="488.0" y="480.0" font-size="15" font-weight="400" text-anchor="middle" fill="#2b2b2b">reset / RMA history</text><rect x="384" y="530" width="208" height="104" rx="10" fill="#ffffff" stroke="#c9c9c2" stroke-width="1.2"/><text x="488.0" y="566.0" font-size="15" font-weight="700" text-anchor="middle" fill="#2b2b2b">Peer z-scores</text><text x="488.0" y="587.0" font-size="15" font-weight="400" text-anchor="middle" fill="#2b2b2b">temp · throttle ·</text><text x="488.0" y="608.0" font-size="15" font-weight="400" text-anchor="middle" fill="#2b2b2b">perf vs same SKU</text><path d="M616,454 L680,454" fill="none" stroke="#2b2b2b" stroke-width="2" marker-end="url(#head)"/><rect x="680" y="250" width="256" height="408" rx="14" fill="#f5f5f2" stroke="#d6d6d0" stroke-width="1.5"/><text x="684" y="240" font-size="17" font-weight="700" text-anchor="start" fill="#2b2b2b">3 · Risk model</text><rect x="704" y="274" width="208" height="72" rx="10" fill="#ffffff" stroke="#c9c9c2" stroke-width="1.2"/><text x="808.0" y="304.5" font-size="15" font-weight="400" text-anchor="middle" fill="#2b2b2b">Day 1: rule-based</text><text x="808.0" y="325.5" font-size="15" font-weight="400" text-anchor="middle" fill="#2b2b2b">hazard score</text><rect x="704" y="370" width="208" height="72" rx="10" fill="#ffffff" stroke="#c9c9c2" stroke-width="1.2"/><text x="808.0" y="400.5" font-size="15" font-weight="400" text-anchor="middle" fill="#2b2b2b">Later: survival model</text><text x="808.0" y="421.5" font-size="15" font-weight="400" text-anchor="middle" fill="#2b2b2b">(LightGBM / Cox)</text><rect x="704" y="466" width="208" height="72" rx="10" fill="#ffffff" stroke="#c9c9c2" stroke-width="1.2"/><text x="808.0" y="496.5" font-size="15" font-weight="400" text-anchor="middle" fill="#2b2b2b">Calibrated</text><text x="808.0" y="517.5" font-size="15" font-weight="400" text-anchor="middle" fill="#2b2b2b">P(fail within H hrs)</text><rect x="704" y="562" width="208" height="72" rx="10" fill="#ffffff" stroke="#c9c9c2" stroke-width="1.2"/><text x="808.0" y="592.5" font-size="15" font-weight="400" text-anchor="middle" fill="#2b2b2b">SHAP reasons</text><text x="808.0" y="613.5" font-size="15" font-weight="400" text-anchor="middle" fill="#2b2b2b">per GPU</text><path d="M936,454 L1000,454" fill="none" stroke="#2b2b2b" stroke-width="2" marker-end="url(#head)"/><rect x="1000" y="250" width="256" height="408" rx="14" fill="#f5f5f2" stroke="#d6d6d0" stroke-width="1.5"/><text x="1004" y="240" font-size="17" font-weight="700" text-anchor="start" fill="#2b2b2b">4 · Risk tiers</text><rect x="1024" y="274" width="208" height="96" rx="10" fill="#d4ecce" stroke="#9cc893" stroke-width="1.2"/><text x="1128.0" y="306.0" font-size="15" font-weight="700" text-anchor="middle" fill="#2b2b2b">Green · p &lt; 5%</text><text x="1128.0" y="327.0" font-size="15" font-weight="400" text-anchor="middle" fill="#2b2b2b">any job, incl.</text><text x="1128.0" y="348.0" font-size="15" font-weight="400" text-anchor="middle" fill="#2b2b2b">critical</text><rect x="1024" y="386" width="208" height="96" rx="10" fill="#fbdcc4" stroke="#e8b48c" stroke-width="1.2"/><text x="1128.0" y="418.0" font-size="15" font-weight="700" text-anchor="middle" fill="#2b2b2b">Amber · 5–20%</text><text x="1128.0" y="439.0" font-size="15" font-weight="400" text-anchor="middle" fill="#2b2b2b">preemptible /</text><text x="1128.0" y="460.0" font-size="15" font-weight="400" text-anchor="middle" fill="#2b2b2b">checkpointed only</text><rect x="1024" y="498" width="208" height="96" rx="10" fill="#f7d0db" stroke="#e09cb0" stroke-width="1.2"/><text x="1128.0" y="530.0" font-size="15" font-weight="700" text-anchor="middle" fill="#2b2b2b">Red · &gt; 20% or</text><text x="1128.0" y="551.0" font-size="15" font-weight="400" text-anchor="middle" fill="#2b2b2b">hard signal →</text><text x="1128.0" y="572.0" font-size="15" font-weight="400" text-anchor="middle" fill="#2b2b2b">cordon + diag</text><text x="1024" y="622" font-size="13" font-weight="400" text-anchor="start" fill="#555555">Hysteresis: enter at 15%,</text><text x="1024" y="640" font-size="13" font-weight="400" text-anchor="start" fill="#555555">exit below 8% for 24h</text><path d="M1256,454 L1320,454" fill="none" stroke="#2b2b2b" stroke-width="2" marker-end="url(#head)"/><rect x="1320" y="250" width="256" height="408" rx="14" fill="#f5f5f2" stroke="#d6d6d0" stroke-width="1.5"/><text x="1324" y="240" font-size="17" font-weight="700" text-anchor="start" fill="#2b2b2b">5 · Scheduler gate</text><rect x="1344" y="274" width="208" height="72" rx="10" fill="#ffffff" stroke="#c9c9c2" stroke-width="1.2"/><text x="1448.0" y="304.5" font-size="15" font-weight="400" text-anchor="middle" fill="#2b2b2b">Job risk =</text><text x="1448.0" y="325.5" font-size="15" font-weight="400" text-anchor="middle" fill="#2b2b2b">1 − ∏(1 − pᵢ)</text><rect x="1344" y="370" width="208" height="72" rx="10" fill="#ffffff" stroke="#c9c9c2" stroke-width="1.2"/><text x="1448.0" y="400.5" font-size="15" font-weight="400" text-anchor="middle" fill="#2b2b2b">Critical budget</text><text x="1448.0" y="421.5" font-size="15" font-weight="400" text-anchor="middle" fill="#2b2b2b">&lt; 2% over the run</text><rect x="1344" y="466" width="208" height="72" rx="10" fill="#ffffff" stroke="#c9c9c2" stroke-width="1.2"/><text x="1448.0" y="496.5" font-size="15" font-weight="400" text-anchor="middle" fill="#2b2b2b">Checkpoint every</text><text x="1448.0" y="517.5" font-size="15" font-weight="400" text-anchor="middle" fill="#2b2b2b">√(2 · C · MTBF)</text><rect x="1344" y="562" width="208" height="72" rx="10" fill="#ffffff" stroke="#c9c9c2" stroke-width="1.2"/><text x="1448.0" y="592.5" font-size="15" font-weight="400" text-anchor="middle" fill="#2b2b2b">K8s DRA attribute /</text><text x="1448.0" y="613.5" font-size="15" font-weight="400" text-anchor="middle" fill="#2b2b2b">Slurm features</text><rect x="40" y="818" width="776" height="232" rx="14" fill="#f5f5f2" stroke="#d6d6d0" stroke-width="1.5"/><text x="44" y="808" font-size="17" font-weight="700" text-anchor="start" fill="#2b2b2b">6 · Test workloads (in spec, worst case)</text><rect x="64" y="842" width="224" height="80" rx="10" fill="#ffffff" stroke="#c9c9c2" stroke-width="1.2"/><text x="176.0" y="866.0" font-size="15" font-weight="700" text-anchor="middle" fill="#2b2b2b">Deterministic GEMM</text><text x="176.0" y="887.0" font-size="15" font-weight="400" text-anchor="middle" fill="#2b2b2b">hash compare →</text><text x="176.0" y="908.0" font-size="15" font-weight="400" text-anchor="middle" fill="#2b2b2b">silent corruption</text><rect x="312" y="842" width="224" height="80" rx="10" fill="#ffffff" stroke="#c9c9c2" stroke-width="1.2"/><text x="424.0" y="876.5" font-size="15" font-weight="700" text-anchor="middle" fill="#2b2b2b">Full-node heat soak</text><text x="424.0" y="897.5" font-size="15" font-weight="400" text-anchor="middle" fill="#2b2b2b">→ temp drift vs peers</text><rect x="560" y="842" width="224" height="80" rx="10" fill="#ffffff" stroke="#c9c9c2" stroke-width="1.2"/><text x="672.0" y="876.5" font-size="15" font-weight="700" text-anchor="middle" fill="#2b2b2b">Power-pulse bursts</text><text x="672.0" y="897.5" font-size="15" font-weight="400" text-anchor="middle" fill="#2b2b2b">→ Xids, power brake</text><rect x="64" y="946" width="224" height="80" rx="10" fill="#ffffff" stroke="#c9c9c2" stroke-width="1.2"/><text x="176.0" y="980.5" font-size="15" font-weight="700" text-anchor="middle" fill="#2b2b2b">HBM patterns, hot</text><text x="176.0" y="1001.5" font-size="15" font-weight="400" text-anchor="middle" fill="#2b2b2b">→ ECC delta, rows used</text><rect x="312" y="946" width="224" height="80" rx="10" fill="#ffffff" stroke="#c9c9c2" stroke-width="1.2"/><text x="424.0" y="980.5" font-size="15" font-weight="700" text-anchor="middle" fill="#2b2b2b">NCCL + nvbandwidth</text><text x="424.0" y="1001.5" font-size="15" font-weight="400" text-anchor="middle" fill="#2b2b2b">→ BW, CRC deltas</text><rect x="560" y="946" width="224" height="80" rx="10" fill="#ffffff" stroke="#c9c9c2" stroke-width="1.2"/><text x="672.0" y="970.0" font-size="15" font-weight="700" text-anchor="middle" fill="#2b2b2b">Cadence</text><text x="672.0" y="991.0" font-size="15" font-weight="400" text-anchor="middle" fill="#2b2b2b">canary per job · nightly</text><text x="672.0" y="1012.0" font-size="15" font-weight="400" text-anchor="middle" fill="#2b2b2b">5% · deep at intake</text><rect x="880" y="818" width="696" height="232" rx="14" fill="#f5f5f2" stroke="#d6d6d0" stroke-width="1.5"/><text x="884" y="808" font-size="17" font-weight="700" text-anchor="start" fill="#2b2b2b">7 · Agent layer (gpu-health skill)</text><rect x="904" y="842" width="312" height="80" rx="10" fill="#ffffff" stroke="#c9c9c2" stroke-width="1.2"/><text x="1060.0" y="876.5" font-size="15" font-weight="400" text-anchor="middle" fill="#2b2b2b">Explain top-risk GPUs</text><text x="1060.0" y="897.5" font-size="15" font-weight="400" text-anchor="middle" fill="#2b2b2b">with SHAP reasons</text><rect x="1240" y="842" width="312" height="80" rx="10" fill="#ffffff" stroke="#c9c9c2" stroke-width="1.2"/><text x="1396.0" y="876.5" font-size="15" font-weight="400" text-anchor="middle" fill="#2b2b2b">Propose: re-tier · deep suite</text><text x="1396.0" y="897.5" font-size="15" font-weight="400" text-anchor="middle" fill="#2b2b2b">· reset · RMA</text><rect x="904" y="946" width="312" height="80" rx="10" fill="#ffffff" stroke="#c9c9c2" stroke-width="1.2"/><text x="1060.0" y="980.5" font-size="15" font-weight="400" text-anchor="middle" fill="#2b2b2b">Execute only after</text><text x="1060.0" y="1001.5" font-size="15" font-weight="400" text-anchor="middle" fill="#2b2b2b">approval</text><rect x="1240" y="946" width="312" height="80" rx="10" fill="#ffffff" stroke="#c9c9c2" stroke-width="1.2"/><text x="1396.0" y="980.5" font-size="15" font-weight="400" text-anchor="middle" fill="#2b2b2b">nvidia-bug-report →</text><text x="1396.0" y="1001.5" font-size="15" font-weight="400" text-anchor="middle" fill="#2b2b2b">RMA ticket</text><path d="M428,818 L428,738 L168,738 L168,662" fill="none" stroke="#2b2b2b" stroke-width="2" marker-end="url(#head)"/><text x="298" y="728" font-size="14" font-weight="400" text-anchor="middle" fill="#555555">results become features</text><path d="M1128,658 L1128,738 L1228,738 L1228,814" fill="none" stroke="#2b2b2b" stroke-width="2" marker-end="url(#head)"/><text x="1240" y="780" font-size="14" font-weight="400" text-anchor="start" fill="#555555">amber / red GPUs</text></svg>
