<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FleetScope</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: editor shell. Toolbar on top; node palette left; graph canvas centre with timeline and charts dock under it; details panel right. */
:root {
  --bg: #e9edf1; --panel: #ffffff; --panel-2: #f4f6f8; --canvas: #e3e8ee; --grid: rgba(40, 60, 80, .09);
  --ink: #16212b; --muted: #5a6876; --line: #d3dae1;
  --accent: #1f5fd1; --onprem: #1f5fd1; --neo: #b45f12; --train: #148a8a;
  --n-src: #2d8a57; --n-route: #56677a; --n-link: #8a5cd6; --n-set: #6b7785;
  --good: #1f8a4c; --warn: #b98000; --crit: #c8372d;
  --c-queue: #d9653b; --c-prefill: #1f5fd1; --c-xfer: #8a5cd6; --c-dwait: #8d99a6;
  --font-ui: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-display: 'IBM Plex Sans Condensed', 'IBM Plex Sans', system-ui, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1015; --panel: #131a21; --panel-2: #18212a; --canvas: #0e141a; --grid: rgba(160, 190, 220, .07);
    --ink: #e2e8ed; --muted: #94a3b0; --line: #2a3640;
    --accent: #6f9dff; --onprem: #6f9dff; --neo: #e59a4f; --train: #3cc2bd;
    --n-src: #4cc38a; --n-route: #8fa1b3; --n-link: #b08cf2; --n-set: #8c98a4;
    --good: #45c181; --warn: #e2b440; --crit: #f0685c;
    --c-queue: #f0875e; --c-prefill: #6f9dff; --c-xfer: #b08cf2; --c-dwait: #7d8a96;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1015; --panel: #131a21; --panel-2: #18212a; --canvas: #0e141a; --grid: rgba(160, 190, 220, .07);
  --ink: #e2e8ed; --muted: #94a3b0; --line: #2a3640;
  --accent: #6f9dff; --onprem: #6f9dff; --neo: #e59a4f; --train: #3cc2bd;
  --n-src: #4cc38a; --n-route: #8fa1b3; --n-link: #b08cf2; --n-set: #8c98a4;
  --good: #45c181; --warn: #e2b440; --crit: #f0685c;
  --c-queue: #f0875e; --c-prefill: #6f9dff; --c-xfer: #b08cf2; --c-dwait: #7d8a96;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 13px/1.45 var(--font-ui); }
button, select, input { font: inherit; color: inherit; }
.shell { display: grid; grid-template-columns: 210px minmax(0, 1fr) 340px; grid-template-rows: auto minmax(0, 1fr); height: calc(100% - 34px); }
.shell[hidden] { display: none; }
.viewbar { height: 34px; box-sizing: border-box; display: flex; align-items: center; gap: 2px; padding: 0 10px; background: var(--ink); color: var(--panel); }
.viewbar b { font: 600 13px var(--font-display); margin-right: 12px; letter-spacing: .3px; }
.viewbar button { border: 0; background: transparent; color: inherit; opacity: .7; padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 12.5px; }
.viewbar button[aria-selected="true"] { opacity: 1; background: color-mix(in srgb, var(--panel) 18%, transparent); font-weight: 600; }
.viewbar .hint { margin-left: auto; font-size: 11.5px; opacity: .65; }
/* cluster view */
.cfg .card { border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; margin-bottom: 6px; background: var(--panel-2); }
.cfg .card summary { cursor: pointer; font-size: 12px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.cfg .card summary span { color: var(--muted); font-size: 11px; }
.cfg .frow { display: flex; justify-content: space-between; align-items: center; gap: 6px; font-size: 11.5px; margin: 4px 0; }
.cfg .frow input, .cfg .frow select, .cfg .ctl input { width: 74px; border: 1px solid var(--line); border-radius: 5px; padding: 2px 4px; background: var(--panel); }
.cfg .chk { display: block; font-size: 12px; margin: 5px 0; cursor: pointer; }
.cfg .lbl { font-size: 11.5px; color: var(--muted); }
.cfg .ctl { margin: 6px 0; }
.sw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: 0; }
.chead { margin: 8px 10px 0; font-size: 13px; background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 8px; padding: 7px 10px; }
.chead b { font-weight: 600; }
.chead .sub { color: var(--muted); }
.gridWrap { position: relative; margin: 8px 10px 0; padding: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
.gridWrap canvas { display: block; cursor: crosshair; }
.gtip { position: absolute; pointer-events: none; background: var(--ink); color: var(--panel); font-size: 11.5px; padding: 4px 8px; border-radius: 6px; max-width: 260px; z-index: 3; }
.glegend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 11px; color: var(--muted); margin: 6px 12px 0; }
.glegend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
.glegend i.empty { border: 1px solid var(--line); background: none; }
.glegend i.hatch { background: repeating-linear-gradient(135deg, var(--muted) 0 2px, transparent 2px 4px); }
.glegend i.dash { border-top: 1.5px dashed var(--ink); height: 0; width: 14px; border-radius: 0; vertical-align: 3px; }
.glegend .sep { font-weight: 600; }
#clusterApp .timeline, #trainingApp .timeline { margin: 6px 10px 0; padding: 6px 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
#trainingApp .timeline input, #clusterApp .timeline input { width: 100%; }
#cGantt { display: block; margin: 0 18px 20px; }
.cpad { margin: 12px 18px 4px !important; font: 600 12px var(--font-display); text-transform: uppercase; letter-spacing: .7px; color: var(--muted); }
.cpad .sub { text-transform: none; letter-spacing: 0; }
#cKpis .v, #tKpis .v { font-size: 15px; white-space: nowrap; }
.tname { font-size: 13px; }
.tname b { font-weight: 600; }
.sec2 { font: 600 12px var(--font-display); text-transform: uppercase; letter-spacing: .7px; color: var(--muted); margin: 0 0 6px; }
.sec2 .sub { text-transform: none; letter-spacing: 0; font-weight: 400; }
.wbar { display: flex; height: 18px; border-radius: 5px; overflow: hidden; }
.wbar i { display: block; height: 100%; }
.hbar { display: grid; grid-template-columns: 170px 1fr 60px; gap: 8px; align-items: center; font-size: 12px; margin: 3px 0; }
.hbar i { display: block; height: 9px; border-radius: 3px; }
.hbar b { font: 500 12px var(--font-mono); text-align: right; }
.two { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); }
.cgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 6px; }
.ccard { border: 1px solid var(--line); border-left: 4px solid var(--good); border-radius: 8px; padding: 6px 8px; font-size: 12px; background: var(--panel-2); }
.ccard.bad { border-left-color: var(--crit); }
.ccard b { display: block; font-weight: 600; margin-bottom: 2px; }
.ccard span { color: var(--muted); }
#trainingApp .lead { font-size: 13px; margin: 2px 0 8px; }
.btnlike { border: 1px solid var(--line); background: var(--panel-2); border-radius: 7px; padding: 4px 9px; cursor: pointer; font-size: 13px; }
.btnlike:hover { border-color: var(--accent); }
/* toolbar */
.toolbar { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: baseline; gap: 6px; margin-right: 4px; }
.brand b { font: 600 19px/1 var(--font-display); }
.brand span { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: 0 7px; }
.tb { display: flex; align-items: center; gap: 6px; }
.tb select, .tb button { border: 1px solid var(--line); background: var(--panel-2); border-radius: 7px; padding: 4px 9px; cursor: pointer; }
.tb button:hover, .tb select:hover { border-color: var(--accent); }
.tb .play { background: var(--accent); border-color: var(--accent); color: #fff; min-width: 84px; font-weight: 600; }
.clock { font: 500 13px var(--font-mono); font-variant-numeric: tabular-nums; min-width: 104px; text-align: center; }
.status { font-size: 12px; color: var(--muted); margin-left: auto; }
.status b { color: var(--ink); font-weight: 500; }
.status .bad { color: var(--crit); }
/* palette */
.palette { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; padding: 10px; }
.palette h3, .details h3.sec { font: 600 12px var(--font-display); text-transform: uppercase; letter-spacing: .7px; color: var(--muted); margin: 12px 0 6px; }
.palette h3:first-child { margin-top: 0; }
.pitem { display: flex; gap: 8px; align-items: flex-start; border: 1px solid var(--line); background: var(--panel-2); border-radius: 8px; padding: 6px 8px; margin-bottom: 6px; cursor: grab; user-select: none; }
.pitem:hover { border-color: var(--accent); }
.pitem:active { cursor: grabbing; }
.pitem i { flex: 0 0 4px; align-self: stretch; border-radius: 2px; }
.pitem b { display: block; font-size: 12.5px; font-weight: 600; }
.pitem span { display: block; font-size: 11px; color: var(--muted); line-height: 1.3; }
.pitem.off { opacity: .45; cursor: not-allowed; }
.probs { list-style: none; margin: 0; padding: 0; font-size: 11.5px; }
.probs li { padding: 5px 6px; border-radius: 6px; margin-bottom: 4px; cursor: pointer; border-left: 3px solid var(--warn); background: var(--panel-2); }
.probs li.err { border-left-color: var(--crit); }
.probs li:hover { outline: 1px solid var(--accent); }
.help { font-size: 11px; color: var(--muted); line-height: 1.5; }
.help kbd { font: 10.5px var(--font-mono); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; background: var(--panel-2); }
/* centre */
.center { display: block; overflow-y: auto; min-height: 0; min-width: 0; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 6px; padding: 8px 10px 0; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 5px 9px; position: relative; overflow: hidden; }
.kpi::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--line); }
.kpi.good::before { background: var(--good); } .kpi.warn::before { background: var(--warn); } .kpi.crit::before { background: var(--crit); }
.kpi.train::before { background: var(--train); }
.kpi .k { font-size: 10.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi .v { font: 500 16px/1.2 var(--font-mono); font-variant-numeric: tabular-nums; }
.kpi .d { font: 10.5px var(--font-mono); color: var(--muted); min-height: 14px; white-space: nowrap; }
.kpi .d.better { color: var(--good); } .kpi .d.worse { color: var(--crit); }
.canvasWrap { position: relative; margin: 8px 10px 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--canvas); height: clamp(420px, 64vh, 900px); }
#graph { width: 100%; height: 100%; display: block; touch-action: none; user-select: none; }
#graph text { font-family: var(--font-ui); }
#graph .mono { font-family: var(--font-mono); }
#graph .node { cursor: move; }
#graph .node .frame { fill: var(--panel); stroke: var(--line); stroke-width: 1.2; }
#graph .node.sel .frame { stroke: var(--accent); stroke-width: 2.4; }
#graph .node.err .frame { stroke: var(--crit); stroke-width: 2; }
#graph .node.h1 .frame { stroke: var(--warn); stroke-width: 2.6; }
#graph .node.h2 .frame { stroke: var(--crit); stroke-width: 3.2; }
#graph .node.h2 .frame { filter: drop-shadow(0 0 6px color-mix(in srgb, var(--crit) 55%, transparent)); }
#graph .hbadge { cursor: help; }
#graph .lint { cursor: help; }
.probs li.lint { border-left-color: var(--warn); }
.probs li.lint.info { border-left-color: var(--accent); }
.probs li .fix { display: block; color: var(--muted); margin-top: 2px; }
.health { margin: 4px 0 6px; }
.health .row b { font-weight: 600; }
.hdot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 0; }
#graph .pin { cursor: crosshair; }
#graph .pin:hover { stroke-width: 3; }
#graph .ehit { cursor: pointer; }
#graph .edge.sel .wire { stroke: var(--accent) !important; }
.hud { position: absolute; right: 8px; top: 8px; display: flex; gap: 4px; }
.hud button { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 2px 8px; cursor: pointer; font-family: var(--font-mono); }
.toast { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); background: var(--ink); color: var(--panel); padding: 6px 12px; border-radius: 8px; font-size: 12px; opacity: 0; pointer-events: none; transition: opacity .2s; }
.toast.on { opacity: .92; }
.stressBanner { position: absolute; left: 8px; top: 8px; max-width: calc(100% - 140px); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; background: var(--panel); border: 1px solid var(--warn); border-left: 4px solid var(--warn); border-radius: 8px; padding: 5px 10px; font-size: 12px; }
.stressBanner b { font-weight: 600; }
.stressBanner[hidden], .analysis[hidden] { display: none; }
.analysis { margin: 8px 10px 0; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.analysis h3 { font: 600 14px var(--font-display); margin: 0 0 4px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.analysis .lead { font-size: 13px; margin: 2px 0 8px; max-width: 90ch; }
.analysis .lead b { font-weight: 600; }
.atable { width: 100%; border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
.atable th { text-align: left; font-weight: 600; color: var(--muted); font-size: 11px; border-bottom: 1px solid var(--line); padding: 4px 6px; white-space: nowrap; }
.atable td { border-bottom: 1px solid var(--line); padding: 4px 6px; }
.atable td.num { font-family: var(--font-mono); text-align: right; white-space: nowrap; }
.atable tr.click { cursor: pointer; }
.atable tr.click:hover td { background: var(--panel-2); }
.atable tr.pick td { background: color-mix(in srgb, var(--good) 10%, transparent); }
.atable tr.dim td { color: var(--muted); }
.ascroll { overflow-x: auto; }
.progress { height: 6px; background: var(--panel-2); border-radius: 3px; overflow: hidden; margin: 6px 0; }
.progress i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .15s; }
.sgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 6px; }
.sgrid button { text-align: left; border: 1px solid var(--line); background: var(--panel-2); border-radius: 8px; padding: 5px 8px; cursor: pointer; font-size: 12px; line-height: 1.25; }
.sgrid button:hover { border-color: var(--accent); }
.sgrid button:disabled { opacity: .45; cursor: not-allowed; }
.sgrid button span { display: block; color: var(--muted); font-size: 10.5px; }
.orow { border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; margin-top: 6px; background: var(--panel-2); }
.lensbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 8px 10px 0; }
.ltabs { display: flex; gap: 2px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 9px; padding: 2px; }
.ltabs button { border: 0; background: transparent; border-radius: 7px; padding: 4px 11px; font-size: 12.5px; cursor: pointer; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.ltabs button i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.ltabs button[aria-selected="true"] { background: var(--panel); color: var(--ink); font-weight: 600; box-shadow: 0 0 0 1px var(--line); }
.lscope { display: flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.lscope button { border: 0; background: var(--panel-2); padding: 3px 9px; font-size: 11.5px; cursor: pointer; }
.lscope button.on { background: var(--ink); color: var(--panel); }
.lscope[hidden] { display: none; }
.linfo { flex: 1; min-width: 260px; font-size: 12px; color: var(--muted); }
.linfo b { color: var(--ink); font-weight: 600; }
.lgrad { display: inline-block; width: 60px; height: 8px; border-radius: 4px; vertical-align: -1px; margin: 0 4px; }
.lrows .row { cursor: pointer; }
.lrows .row:hover span:first-child { text-decoration: underline; }
.lbar { display: block; height: 4px; border-radius: 2px; margin-top: 2px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.mtx { width: 100%; border-collapse: collapse; font-size: 11.5px; margin-top: 4px; }
.mtx th, .mtx td { padding: 3px 2px; border-bottom: 1px solid var(--line); text-align: center; }
.mtx th:first-child, .mtx td:first-child { text-align: left; }
.mtx input[type=number] { width: 52px; padding: 2px 4px; border: 1px solid var(--line); border-radius: 5px; background: var(--panel); }
.kpi.wide { grid-column: span 2; cursor: pointer; }
.kpi.wide .v { font-size: 13.5px; font-family: var(--font-ui); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.legendHud { position: absolute; left: 10px; bottom: 8px; display: flex; gap: 10px; font-size: 11px; color: var(--muted); background: color-mix(in srgb, var(--panel) 80%, transparent); padding: 3px 8px; border-radius: 6px; }
.legendHud i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: 0; }
.timeline { margin: 6px 10px 0; display: grid; gap: 3px; }
#vstrip { width: 100%; height: 12px; display: block; cursor: pointer; border-radius: 3px; }
#scrub { width: 100%; accent-color: var(--accent); margin: 0; }
.dock { margin: 8px 10px 10px; }
.dock > summary { cursor: pointer; font: 600 12px var(--font-display); text-transform: uppercase; letter-spacing: .7px; color: var(--muted); }
.charts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 6px; }
.chart { background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 6px 8px; min-width: 0; }
.chart h4 { font: 600 12px var(--font-display); margin: 0; color: var(--ink); }
.chart h4 small { font: 400 10.5px var(--font-ui); color: var(--muted); margin-left: 4px; }
.legend { display: flex; flex-wrap: wrap; gap: 2px 9px; font-size: 10.5px; color: var(--muted); margin: 2px 0; }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
.legend i.dash { height: 0; border-top: 2px dashed; border-radius: 0; width: 12px; vertical-align: 3px; }
.chart svg { width: 100%; height: auto; display: block; cursor: crosshair; }
.chart svg text { font: 10px var(--font-mono); fill: var(--muted); }
.chart.wide { grid-column: 1 / -1; }
/* details */
.details { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; padding: 10px 12px 30px; font-size: 12.5px; }
.details h2 { font: 600 16px var(--font-display); margin: 0; }
.details .sub { color: var(--muted); font-size: 11.5px; margin: 2px 0 6px; }
.typetag { display: inline-block; font-size: 10.5px; color: #fff; border-radius: 4px; padding: 0 6px; margin-bottom: 4px; }
.ctl { margin: 8px 0 0; }
.ctl label { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; }
.ctl label output { font: 11.5px var(--font-mono); color: var(--muted); white-space: nowrap; }
.ctl input[type=range] { width: 100%; accent-color: var(--accent); margin: 3px 0 0; }
.ctl select, .ctl input[type=number], .ctl input[type=text] { width: 100%; margin-top: 3px; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel-2); }
.ctl.check label { justify-content: flex-start; align-items: center; gap: 8px; cursor: pointer; }
.ctl .hint { font-size: 11px; color: var(--muted); margin-top: 2px; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; margin-top: 4px; }
.seg button { flex: 1; border: 0; background: var(--panel-2); padding: 4px; font-size: 11.5px; cursor: pointer; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--accent); color: #fff; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
.readout { margin-top: 10px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; font-size: 11.5px; }
.readout table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.readout td:last-child { text-align: right; font-family: var(--font-mono); }
.warnline { color: var(--crit); margin-top: 4px; font-size: 11.5px; }
.row { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; border-bottom: 1px solid var(--line); }
.row span:last-child { font-family: var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; }
.spark { width: 100%; height: 40px; display: block; margin: 2px 0 6px; }

<script>
(function () {
'use strict';
const E = window.FleetEngine, TP = window.FleetTemplates, NT = TP.NODE_TYPES, IN = window.FleetIngest;
const $ = s => document.querySelector(s);
const NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs, parent, text) {
  const n = document.createElementNS(NS, tag);

  if (parent) parent.appendChild(n);
  return n;
}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const mmss = s => { s = Math.max(0, Math.floor(s)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
const fS = s => !isFinite(s) ? '–' : s < 1 ? Math.round(s * 1000) + ' ms' : s < 100 ? s.toFixed(s < 10 ? 2 : 1) + ' s' : Math.round(s) + ' s';
const fMs = s => !isFinite(s) ? '–' : (s < 0.01 ? (s * 1000).toFixed(1) : Math.round(s * 1000)) + ' ms';
const fPct = v => !isFinite(v) ? '–' : (v * 100).toFixed(v >= 0.995 && v < 1 ? 1 : 0) + '%';
const fK = v => !isFinite(v) ? '–' : v >= 1e6 ? (v / 1e6).toFixed(1) + 'M' : v >= 1e4 ? Math.round(v / 1e3) + 'k' : v >= 1e3 ? (v / 1e3).toFixed(1) + 'k' : String(Math.round(v));
const fUsd = v => !isFinite(v) ? '–' : v >= 1000 ? '$' + Math.round(v).toLocaleString('en-US') : '$' + v.toFixed(v < 10 ? 2 : 0);
const fInt = v => Math.round(v).toLocaleString('en-US');
const roleName = { agg: 'Aggregated', prefill: 'Prefill', decode: 'Decode' };

// ---------- state ----------
const S = { lens: 'perf', scope: 'now', runId: 0, blast: null, graph: null, sel: null, view: { x: 40, y: 20, k: 0.8 }, run: null, baseline: null, T: 0, playing: false, speed: 15, probs: { errors: [], warn: [] }, lint: [], nid: 1, tpl: 'burst' };
const traces = {};
function traceLookup(key, scale) {
  let tr;
  if (key === 'uploaded') tr = traces.uploaded ? traces.uploaded.trace : [];
  else tr = traces[key] || (traces[key] = E.genTrace(key, 7));
  return E.scaleTrace(tr, scale || 1, 7);
}
const nodeById = id => S.graph.nodes.find(n => n.id === id);
const typeColor = n => n.type === 'pool' ? (n.cfg.siteKind === 'neo' ? 'var(--neo)' : 'var(--onprem)') : n.type === 'train' ? 'var(--train)' : n.type === 'link' ? 'var(--n-link)' : n.type === 'router' ? 'var(--n-route)' : (n.type === 'model' || n.type === 'slo') ? 'var(--n-set)' : 'var(--n-src)';

// ---------- palette ----------
function renderPalette() {
  const p = $('#palette');
  let html = '', grp = '';
  TP.PALETTE.forEach((it, i) => {
    const g = NT[it.type].group;
    if (g !== grp) { html += '<h3>' + g + '</h3>'; grp = g; }
    const off = NT[it.type].singleton && S.graph && S.graph.nodes.some(n => n.type === it.type);
    const col = it.type === 'pool' ? (it.cfg && it.cfg.siteKind === 'neo' ? 'var(--neo)' : 'var(--onprem)') : typeColor({ type: it.type, cfg: {} });
    html += '<div class="pitem' + (off ? ' off' : '') + '" draggable="' + (!off) + '" data-i="' + i + '" tabindex="0" role="button" title="' + (off ? 'Only one per canvas' : 'Drag onto the canvas, or click to add') + '"><i style="background:' + col + '"></i><div><b>' + it.label + '</b><span>' + it.hint + '</span></div></div>';
  });
  html += '<h3>Problems</h3><ul class="probs" id="probs"></ul>';
  html += '<h3>How to use</h3><div class="help">Drag nodes in, then wire an <b>output pin</b> (right) to an <b>input pin</b> (left). Click a node to edit it. Changes re-simulate and keep the playhead.<br><kbd>Space</kbd> play · <kbd>&larr;</kbd><kbd>&rarr;</kbd> step · <kbd>N</kbd> next breach · <kbd>Del</kbd> remove · <kbd>F</kbd> fit · scroll to zoom, drag the background to pan.</div>';
  p.innerHTML = html;
  renderProblems();
}
$('#palette').addEventListener('dragstart', e => { const it = e.target.closest('.pitem'); if (!it || it.classList.contains('off')) { e.preventDefault(); return; } e.dataTransfer.setData('text/plain', 'pal:' + it.dataset.i); e.dataTransfer.effectAllowed = 'copy'; });
$('#palette').addEventListener('click', e => {
  const it = e.target.closest('.pitem');
  if (it && !it.classList.contains('off')) { const b = $('#graph').getBoundingClientRect(); addFromPalette(+it.dataset.i, toWorld(b.left + b.width / 2 - 120, b.top + b.height / 2 - 60)); return; }
  const pr = e.target.closest('[data-node]');
  if (pr) select({ type: 'node', id: pr.dataset.node });
});
$('#palette').addEventListener('keydown', e => { if (e.key === 'Enter') { const it = e.target.closest('.pitem'); if (it) it.click(); } });
function addFromPalette(i, pt) {
  const it = TP.PALETTE[i];
  if (NT[it.type].singleton && S.graph.nodes.some(n => n.type === it.type)) return toast('Only one ' + NT[it.type].title + ' node per canvas.');
  const id = it.type + (S.nid++);
  const n = TP.node(id, it.type, Math.round(pt.x / 8) * 8, Math.round(pt.y / 8) * 8, it.cfg);
  if (it.type === 'pool' && it.cfg && it.cfg.siteKind !== 'neo') {
    const existing = S.graph.nodes.filter(m => m.type === 'pool' && m.cfg.siteKind === 'onprem').length;
    if (existing) n.cfg.name = n.cfg.name + ' ' + (existing + 1);
  }
  S.graph.nodes.push(n);
  renderGraph(); renderPalette(); select({ type: 'node', id }); scheduleRun();
}
function renderProblems() {
  const ul = $('#probs');
  if (!ul) return;
  const items = S.probs.errors.map(e => ({ e, err: true })).concat(S.probs.warn.map(e => ({ e, err: false })));
  const lint = S.probs.errors.length ? [] : S.lint;
  ul.innerHTML = (items.length ? items.map(x => '<li class="' + (x.err ? 'err' : '') + '"' + (x.e.node ? ' data-node="' + x.e.node + '"' : '') + '>' + esc(x.e.msg) + '</li>').join('') : '<li style="border-left-color:var(--good)">The graph compiles.</li>') +
    lint.map(x => '<li class="lint ' + x.level + '" data-node="' + x.node + '"><b>' + (x.level === 'warn' ? 'Potential issue' : 'Note') + ':</b> ' + esc(x.msg) + '<span class="fix">' + esc(x.fix) + '</span></li>').join('');
}

// ---------- view ----------
const vp = $('#vp'), svg = $('#graph');
function applyView() { vp.setAttribute('transform', 'translate(' + S.view.x + ' ' + S.view.y + ') scale(' + S.view.k + ')'); }
function toWorld(cx, cy) { const b = svg.getBoundingClientRect(); return { x: (cx - b.left - S.view.x) / S.view.k, y: (cy - b.top - S.view.y) / S.view.k }; }
function fit() {
  const ns = S.graph.nodes;
  if (!ns.length) return;
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const n of ns) { const v = views[n.id]; const w = NT[n.type].w, h = v ? v.h : 100; x0 = Math.min(x0, n.x); y0 = Math.min(y0, n.y); x1 = Math.max(x1, n.x + w); y1 = Math.max(y1, n.y + h); }
  const b = svg.getBoundingClientRect();
  const k = clamp(Math.min((b.width - 40) / (x1 - x0), (b.height - 50) / (y1 - y0)), 0.3, 1.2);
  S.view = { k, x: (b.width - (x1 - x0) * k) / 2 - x0 * k, y: (b.height - 26 - (y1 - y0) * k) / 2 - y0 * k };
  applyView();
}
function zoomAt(f, cx, cy) {
  const b = svg.getBoundingClientRect();
  const k = clamp(S.view.k * f, 0.25, 2);
  const px = cx - b.left, py = cy - b.top;
  S.view.x = px - (px - S.view.x) * k / S.view.k; S.view.y = py - (py - S.view.y) * k / S.view.k; S.view.k = k;
  applyView();
}
svg.addEventListener('wheel', e => { e.preventDefault(); zoomAt(Math.exp(-e.deltaY * 0.0015), e.clientX, e.clientY); }, { passive: false });
$('#zIn').onclick = () => { const b = svg.getBoundingClientRect(); zoomAt(1.2, b.left + b.width / 2, b.top + b.height / 2); };
$('#zOut').onclick = () => { const b = svg.getBoundingClientRect(); zoomAt(1 / 1.2, b.left + b.width / 2, b.top + b.height / 2); };
$('#zFit').onclick = fit;
let toastT = 0;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2600); }

// ---------- graph rendering ----------
const PIN_Y = 46;
let views = {}, edgeViews = {};
function nodeHeight(n) {
  if (n.type === 'pool') { const g = poolGrid(n); return 74 + g.rows * (g.sz + 5) + 34; }
  return { agent: 104, chat: 104, trace: 96, router: 104, link: 100, train: 110, model: 96, slo: 76 }[n.type] || 90;
}
function poolGrid(n) {
  const c = n.cfg;
  const maxN = Math.max(1, c.autoscale ? Math.max(c.min, c.max) : c.instances);
  const w = NT.pool.w - 24;
  const cols = Math.min(maxN, 8);
  const sz = Math.max(14, Math.min(26, Math.floor((w - (cols - 1) * 5) / cols)));
  return { maxN, cols, rows: Math.ceil(maxN / cols), sz };
}
function cfgLineFit(n) { const t = cfgLine(n), m = Math.floor((NT[n.type].w - 24) / 5.6); return t.length > m ? t.slice(0, m - 1) + '…' : t; }
function cfgLine(n) {
  const c = n.cfg;
  const prof = () => S.graph.nodes.find(m => m.type === 'model');
  switch (n.type) {
    case 'agent': return fInt(c.users) + ' agents · ' + c.turns + ' turns · ' + fK(c.contextTokens) + ' ctx';
    case 'chat': return fInt(c.users) + ' users · ' + c.turns + ' turns · ' + c.thinkS + ' s think';
    case 'trace': return (c.trace === 'uploaded' ? (traces.uploaded ? traces.uploaded.name : 'upload a CSV') : E.TRACES[c.trace].label.replace('Sample: ', '')) + ' · ' + c.scale + '×';
    case 'router': return ({ 'primary-first': 'Primary first, burst at ' + c.burstWait + ' s', 'least-wait': 'Least estimated wait', 'round-robin': 'Round robin' })[c.policy];
    case 'pool': { const m = prof(); const tp = m ? E.profile(c.gpu, m.cfg).tp : 1; return roleName[c.role] + ' · ' + c.gpu + (tp > 1 ? ' ×' + tp : '') + ' · ' + (c.autoscale ? c.min + '–' + c.max + ' inst, ' + c.coldStart + ' s cold' : c.instances + ' inst'); }
    case 'link': return c.gbps + ' Gbps · ' + c.rttMs + ' ms RTT · $' + c.egressPerGB + '/GB';
    case 'train': return E.MODELS[c.model].label.replace(/ \(.*\)/, '') + ' · ' + fInt(c.gpus) + ' × ' + c.gpu;
    case 'model': return c.params + 'B params' + (c.active !== c.params ? ' (' + c.active + 'B active)' : '') + ' · ' + c.wPrec.toUpperCase() + (c.thinkTokens ? ' · thinks ~' + fK(c.thinkTokens) : '');
    case 'slo': return 'TTFT ≤ ' + c.ttft + ' s · TPOT ≤ ' + c.tpotMs + ' ms';
  }
  return '';
}
function renderGraph() {
  const NL = $('#nodes'), EL = $('#edges');
  NL.innerHTML = ''; EL.innerHTML = '';
  views = {}; edgeViews = {};
  for (const n of S.graph.nodes) buildNode(n, NL);
  for (const e of S.graph.edges) buildEdge(e, EL);
  markSelection(); markProblems();
  if (S.run) updateLive(S.T);
}
function buildNode(n, layer) {
  const w = NT[n.type].w, h = nodeHeight(n), col = typeColor(n);
  const g = el('g', { class: 'node', 'data-node': n.id, transform: 'translate(' + n.x + ' ' + n.y + ')' }, layer);
  el('rect', { class: 'frame', x: 0, y: 0, width: w, height: h, rx: 10 }, g);
  el('path', { d: 'M0 10a10 10 0 0 1 10-10H' + (w - 10) + 'a10 10 0 0 1 10 10V30H0Z', fill: col, 'fill-opacity': 0.9 }, g);
  el('text', { x: 12, y: 20, 'font-size': 12.5, 'font-weight': 600, fill: '#fff' }, g, n.cfg.name.length > 28 ? n.cfg.name.slice(0, 27) + '…' : n.cfg.name);
  el('text', { x: w - 10, y: 20, 'font-size': 10, 'text-anchor': 'end', fill: '#fff', 'fill-opacity': 0.8 }, g, n.type === 'pool' ? n.cfg.site : NT[n.type].title);
  el('text', { x: 12, y: 46, 'font-size': 11, fill: 'var(--muted)' }, g, cfgLineFit(n));
  const v = { g, n, w, h, refs: {} };
  const R = v.refs;
  R.hb = el('g', { class: 'hbadge', transform: 'translate(' + (w - 8) + ' -11)', opacity: 0 }, g);
  R.hbr = el('rect', { x: 0, y: 0, width: 10, height: 18, rx: 9, fill: 'var(--crit)' }, R.hb);
  R.hbt = el('text', { x: 0, y: 12.5, 'font-size': 10.5, 'font-weight': 600, fill: '#fff', 'text-anchor': 'end' }, R.hb, '');
  R.hbTitle = el('title', null, R.hb, '');
  R.lint = el('g', { class: 'lint', transform: 'translate(0 0)', opacity: 0 }, g);
  el('circle', { cx: 0, cy: 0, r: 9, fill: 'var(--warn)', stroke: 'var(--panel)', 'stroke-width': 2 }, R.lint);
  el('text', { x: 0, y: 4, 'font-size': 12, 'font-weight': 700, fill: '#fff', 'text-anchor': 'middle' }, R.lint, '!');

      res.rows.map((r, i) => '<tr class="' + (r.pick ? 'pick' : r.meets && !r.belowQuality ? '' : 'dim') + '"><td class="num">' + (i + 1) + '</td><td><b>' + esc(r.label) + '</b><br><span style="color:var(--muted);font-size:11px">' + r.tp + ' GPU' + (r.tp > 1 ? 's' : '') + '/instance · KV ' + fK(r.kvCap) + ' tok</span></td><td>' + think(r.thinkTokens) + '</td><td>' + (r.meets ? (r.belowQuality ? 'yes, below quality floor' : '<span style="color:var(--good)">yes</span>') : '<span style="color:var(--crit)">no (' + fPct(r.slo) + ' at 8×)</span>') + '</td><td class="num">' + fInt(r.peakGpus) + ' GPUs · ' + (+r.factor).toFixed(2) + '×</td><td class="num">' + fUsd(r.costPerHr) + '</td><td class="num">' + fUsd(r.costPerKReq) + '</td><td class="num">' + fUsd(r.costPerMTok) + '</td><td class="num">' + fS(r.ttftP99) + '</td><td class="num">' + fPct(r.thinkShare) + '</td><td class="num">' + (r.quality == null ? '–' : r.quality) + '</td><td>' + (r.bottleneck ? esc(r.bottleneck.name) + ': ' + r.bottleneck.label : !r.meets ? 'Per-request latency: even with spare capacity, the longest prompts take too long on one instance. More GPUs per instance, faster GPUs or a looser TTFT target help; more instances do not.' : '–') + '</td><td><button class="btn" type="button" data-advapply="' + i + '">Apply</button></td></tr>').join('') +
      '</tbody></table></div><div class="sub" style="margin-top:6px">Fleet needed scales every pool in the drawn graph together (fixed sizes, autoscaling min and max) to the smallest size that meets the target. <b>Apply</b> switches the Model node and resizes the pools to match.</div>';
  }
}
$('#analysis').addEventListener('click', e => {
  const t = e.target;
  const a = t.closest('[data-act]');
  if (a && a.dataset.act === 'closeAnalysis') { S.analysis = null; renderAnalysis(); return; }
  if (a && a.dataset.act === 'cancelJob') { if (S.job) S.job.cancel = true; S.job = null; S.analysis = null; renderAnalysis(); return; }
  const su = t.closest('[data-suite]');
  if (su) { const r = S.analysis.rows[+su.dataset.suite]; if (r.st) { S.stressDraft = JSON.parse(JSON.stringify(r.st)); applyStress(r.st); } else { S.stress = null; scheduleRun(0); } return; }
  const hr = t.closest('[data-hrrun]');
  if (hr) { const m = +hr.dataset.hrrun, k = S.analysis.res.kind; const st = k === 'ctx' ? { name: 'Context ' + m + '×', ctx: { mult: m, add: 0 }, outages: [] } : { name: (k === 'users' ? 'Users ' : 'Traffic ') + m + '×', surge: { mult: m, start: 0, dur: 0, target: k === 'users' ? 'sessions' : 'all' }, outages: [] }; S.stressDraft = st; applyStress(st); return; }
  const ap = t.closest('[data-advapply]');
  if (ap) {
    const r = S.analysis.res.rows[+ap.dataset.advapply];
    const mn = S.graph.nodes.find(n => n.type === 'model');
    Object.assign(mn.cfg, E.MODELS[r.key], { key: r.key, thinkTokens: r.thinkTokens });
    for (const n of S.graph.nodes) if (n.type === 'pool') {
      const c = n.cfg, f = r.factor;
      if (c.autoscale) { c.min = Math.round(c.min * f); c.max = Math.max(1, c.min, Math.round(c.max * f)); } else c.instances = Math.max(1, Math.round(c.instances * f));
    }
    renderGraph(); renderDetails(); scheduleRun(0); toast('Applied ' + r.label + ' with reasoning ' + (r.thinkTokens ? fK(r.thinkTokens) : 'off') + ' and resized the pools.');
  }
});

// ---------- model advisor panel ----------
const THINK_LEVELS = [[0, 'Off'], [500, 'Low'], [2000, 'Med'], [8000, 'High']];
function renderAdvisorPanel() {
  const box = $('#details'), A = S.adv;
  const nC = Object.values(A.cands).filter(Boolean).length;
  box.innerHTML = '<span class="typetag" style="background:var(--accent)">Model advisor</span><h2>Which model should serve this?</h2>' +
    '<div class="sub">For each model and reasoning level you tick, FleetScope resizes the drawn fleet to the smallest size that serves this traffic at the SLO, then ranks by cost.</div>' +
    '<h3 class="sec">Candidates</h3><table class="mtx"><thead><tr><th>Model</th>' + THINK_LEVELS.map(l => '<th title="' + (l[0] ? l[0] + ' hidden thinking tokens per request (median)' : 'No reasoning') + '">' + l[1] + '</th>').join('') + '<th title="Your eval score, 0 to 100">Quality</th></tr></thead><tbody>' +
    Object.keys(E.MODELS).map(k => '<tr><td>' + esc(E.MODELS[k].label) + '</td>' + THINK_LEVELS.map(l => '<td><input type="checkbox" data-cand="' + k + '|' + l[0] + '" aria-label="' + esc(E.MODELS[k].label + ' reasoning ' + l[1]) + '"' + (A.cands[k + '|' + l[0]] ? ' checked' : '') + '></td>').join('') + '<td><input type="number" min="0" max="100" step="1" data-q="' + k + '" value="' + (A.quality[k] != null ? A.quality[k] : '') + '" aria-label="' + esc(E.MODELS[k].label) + ' quality score"></td></tr>').join('') + '</tbody></table>' +
    '<div class="sub">Reasoning levels are median hidden thinking tokens per request: Low 500, Med 2,000, High 8,000.</div>' +
    '<div class="ctl"><label for="advMQ">Minimum quality (from your evals, optional)</label><input type="number" id="advMQ" min="0" max="100" step="1" data-adv="minQuality" value="' + esc(A.minQuality) + '"></div>' +
    '<div class="ctl"><label><span>Attainment target</span><output data-advout>' + A.target + '%</output></label><input type="range" data-adv="target" min="80" max="99.9" step="0.1" value="' + A.target + '" aria-label="Attainment target"></div>' +
    '<div class="ctl check"><label for="advSt"><input type="checkbox" id="advSt" data-adv="underStress"' + (A.underStress ? ' checked' : '') + (S.stress ? '' : ' disabled') + '>Size for the active stress test' + (S.stress ? ' (' + esc(S.stress.name) + ')' : ' (none active)') + '</label></div>' +
    '<div class="btnrow"><button class="btn primary" type="button" data-act="advise"' + (nC ? '' : ' disabled') + '>Recommend (' + nC + ' candidate' + (nC === 1 ? '' : 's') + ')</button></div>' +
    '<h3 class="sec">How reasoning changes the picture</h3><div class="sub" style="line-height:1.5">' +
    'Thinking tokens are decoded before the first answer token. They hold KV cache, take decode time, and are billed like output. They usually aren’t carried into the next turn (the Model node can keep them).<br>' +
    '&bull; <b>TTFT:</b> if thinking is hidden, the user waits for all of it, so TTFT grows by thinking tokens × time per token. A 2-second TTFT target is usually out of reach. Tick <i>Streamed thinking counts as the first token</i> on the SLO node if your product streams it.<br>' +
    '&bull; <b>Capacity:</b> decode work per request multiplies, so fleets become decode-bound and KV-bound, and agents’ turns slow down, lowering throughput.<br>' +
    '&bull; <b>Cost:</b> compare <i>$ per 1,000 requests</i>, not $ per million tokens. A reasoning model can be cheaper per token yet costlier per answer.</div>';
}
function advisorPanelEvents(e) {
  if (!(S.sel && S.sel.type === 'advisor')) return false;
  const t = e.target, A = S.adv;
  if (e.type === 'input' || e.type === 'change') {
    if (t.dataset.cand) { A.cands[t.dataset.cand] = t.checked; const n = Object.values(A.cands).filter(Boolean).length; const b = $('[data-act="advise"]'); if (b) { b.disabled = !n; b.textContent = 'Recommend (' + n + ' candidate' + (n === 1 ? '' : 's') + ')'; } return true; }
    if (t.dataset.q) { A.quality[t.dataset.q] = t.value === '' ? null : clamp(+t.value, 0, 100); return true; }
    if (t.dataset.adv) { const k = t.dataset.adv; A[k] = k === 'underStress' ? t.checked : k === 'target' ? +t.value : t.value; const o = $('[data-advout]'); if (o) o.textContent = A.target + '%'; return true; }
    return false;
  }
  const b = t.closest('[data-act="advise"]');
  if (b) { runAdvisor(); return true; }
  return false;
}
function runAdvisor() {
  const spec = compiledSpec(); if (!spec) return;
  const A = S.adv;
  const candidates = Object.keys(A.cands).filter(k => A.cands[k]).map(k => { const [key, th] = k.split('|'); return { key, thinkTokens: +th }; });
  const quality = {}; for (const k in A.quality) if (A.quality[k] != null) quality[k] = A.quality[k];
  const minQ = A.minQuality === '' || A.minQuality == null ? null : +A.minQuality;
  const it = E.adviseIter(spec, { target: A.target / 100, candidates, quality, minQuality: minQ, iters: 5, stress: A.underStress && S.stress ? S.stress : null });
  function* wrap() { let x; while (!(x = it.next()).done) yield { done: x.value.done, total: x.value.total, text: 'Sizing ' + x.value.model + (x.value.thinkTokens ? ' with ' + fK(x.value.thinkTokens) + ' thinking' : '') + '…' }; return x.value; }
  startJob('Model advisor', wrap(), res => { S.analysis = { kind: 'advisor', res, minQuality: minQ == null ? '' : minQ }; });
}
['click', 'input', 'change'].forEach(ev => $('#details').addEventListener(ev, e => { if (stressPanelEvents(e)) e.stopImmediatePropagation(); else if (advisorPanelEvents(e)) e.stopImmediatePropagation(); }, true));
$('#whatifBtn').onclick = () => { if (S.stress) S.stressDraft = JSON.parse(JSON.stringify(S.stress)); select({ type: 'stress' }); };
$('#advisorBtn').onclick = () => select({ type: 'advisor' });

// templates
const tplSel = $('#tpl');
tplSel.innerHTML = TP.TEMPLATES.map(t => '<option value="' + t.id + '">Template: ' + t.name + ' — ' + t.desc + '</option>').join('');
tplSel.onchange = () => loadTemplate(tplSel.value);
function loadTemplate(id) {
  const t = TP.TEMPLATES.find(x => x.id === id);
  S.tpl = id; S.graph = t.build(); S.sel = null; S.dirty = false; firstRun = true; setPlaying(false);
  S.stress = null; S.autoBase = null; S.stressDraft = blankStress(); S.analysis = null; if (S.job) S.job.cancel = true; renderAnalysis();
  S.nid = 100; S.needFit = true;
  renderPalette(); renderGraph(); requestAnimationFrame(fit); renderDetails(); scheduleRun(0);
}
renderLensBar();
loadTemplate('burst');
requestAnimationFrame(loop);
window.addEventListener('resize', () => {});
})();
</script>
