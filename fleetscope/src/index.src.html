<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FleetScope</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: editor shell. Toolbar on top; node palette left; graph canvas centre with timeline and charts dock under it; details panel right. */
:root {
  --bg: #e9edf1; --panel: #ffffff; --panel-2: #f4f6f8; --canvas: #e3e8ee; --grid: rgba(40, 60, 80, .09);
  --ink: #16212b; --muted: #5a6876; --line: #d3dae1;
  --accent: #1f5fd1; --onprem: #1f5fd1; --neo: #b45f12; --train: #148a8a;
  --n-src: #2d8a57; --n-route: #56677a; --n-link: #8a5cd6; --n-set: #6b7785;
  --good: #1f8a4c; --warn: #b98000; --crit: #c8372d;
  --c-queue: #d9653b; --c-prefill: #1f5fd1; --c-xfer: #8a5cd6; --c-dwait: #8d99a6;
  --font-ui: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-display: 'IBM Plex Sans Condensed', 'IBM Plex Sans', system-ui, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1015; --panel: #131a21; --panel-2: #18212a; --canvas: #0e141a; --grid: rgba(160, 190, 220, .07);
    --ink: #e2e8ed; --muted: #94a3b0; --line: #2a3640;
    --accent: #6f9dff; --onprem: #6f9dff; --neo: #e59a4f; --train: #3cc2bd;
    --n-src: #4cc38a; --n-route: #8fa1b3; --n-link: #b08cf2; --n-set: #8c98a4;
    --good: #45c181; --warn: #e2b440; --crit: #f0685c;
    --c-queue: #f0875e; --c-prefill: #6f9dff; --c-xfer: #b08cf2; --c-dwait: #7d8a96;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1015; --panel: #131a21; --panel-2: #18212a; --canvas: #0e141a; --grid: rgba(160, 190, 220, .07);
  --ink: #e2e8ed; --muted: #94a3b0; --line: #2a3640;
  --accent: #6f9dff; --onprem: #6f9dff; --neo: #e59a4f; --train: #3cc2bd;
  --n-src: #4cc38a; --n-route: #8fa1b3; --n-link: #b08cf2; --n-set: #8c98a4;
  --good: #45c181; --warn: #e2b440; --crit: #f0685c;
  --c-queue: #f0875e; --c-prefill: #6f9dff; --c-xfer: #b08cf2; --c-dwait: #7d8a96;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 13px/1.45 var(--font-ui); }
button, select, input { font: inherit; color: inherit; }
.shell { display: grid; grid-template-columns: 210px minmax(0, 1fr) 340px; grid-template-rows: auto minmax(0, 1fr); height: 100%; }
/* toolbar */
.toolbar { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: baseline; gap: 6px; margin-right: 4px; }
.brand b { font: 600 19px/1 var(--font-display); }
.brand span { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: 0 7px; }
.tb { display: flex; align-items: center; gap: 6px; }
.tb select, .tb button { border: 1px solid var(--line); background: var(--panel-2); border-radius: 7px; padding: 4px 9px; cursor: pointer; }
.tb button:hover, .tb select:hover { border-color: var(--accent); }
.tb .play { background: var(--accent); border-color: var(--accent); color: #fff; min-width: 84px; font-weight: 600; }
.clock { font: 500 13px var(--font-mono); font-variant-numeric: tabular-nums; min-width: 104px; text-align: center; }
.status { font-size: 12px; color: var(--muted); margin-left: auto; }
.status b { color: var(--ink); font-weight: 500; }
.status .bad { color: var(--crit); }
/* palette */
.palette { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; padding: 10px; }
.palette h3, .details h3.sec { font: 600 12px var(--font-display); text-transform: uppercase; letter-spacing: .7px; color: var(--muted); margin: 12px 0 6px; }
.palette h3:first-child { margin-top: 0; }
.pitem { display: flex; gap: 8px; align-items: flex-start; border: 1px solid var(--line); background: var(--panel-2); border-radius: 8px; padding: 6px 8px; margin-bottom: 6px; cursor: grab; user-select: none; }
.pitem:hover { border-color: var(--accent); }
.pitem:active { cursor: grabbing; }
.pitem i { flex: 0 0 4px; align-self: stretch; border-radius: 2px; }
.pitem b { display: block; font-size: 12.5px; font-weight: 600; }
.pitem span { display: block; font-size: 11px; color: var(--muted); line-height: 1.3; }
.pitem.off { opacity: .45; cursor: not-allowed; }
.probs { list-style: none; margin: 0; padding: 0; font-size: 11.5px; }
.probs li { padding: 5px 6px; border-radius: 6px; margin-bottom: 4px; cursor: pointer; border-left: 3px solid var(--warn); background: var(--panel-2); }
.probs li.err { border-left-color: var(--crit); }
.probs li:hover { outline: 1px solid var(--accent); }
.help { font-size: 11px; color: var(--muted); line-height: 1.5; }
.help kbd { font: 10.5px var(--font-mono); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; background: var(--panel-2); }
/* centre */
.center { display: block; overflow-y: auto; min-height: 0; min-width: 0; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 6px; padding: 8px 10px 0; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 5px 9px; position: relative; overflow: hidden; }
.kpi::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--line); }
.kpi.good::before { background: var(--good); } .kpi.warn::before { background: var(--warn); } .kpi.crit::before { background: var(--crit); }
.kpi.train::before { background: var(--train); }
.kpi .k { font-size: 10.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi .v { font: 500 16px/1.2 var(--font-mono); font-variant-numeric: tabular-nums; }
.kpi .d { font: 10.5px var(--font-mono); color: var(--muted); min-height: 14px; white-space: nowrap; }
.kpi .d.better { color: var(--good); } .kpi .d.worse { color: var(--crit); }
.canvasWrap { position: relative; margin: 8px 10px 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--canvas); height: clamp(420px, 64vh, 900px); }
#graph { width: 100%; height: 100%; display: block; touch-action: none; user-select: none; }
#graph text { font-family: var(--font-ui); }
#graph .mono { font-family: var(--font-mono); }
#graph .node { cursor: move; }
#graph .node .frame { fill: var(--panel); stroke: var(--line); stroke-width: 1.2; }
#graph .node.sel .frame { stroke: var(--accent); stroke-width: 2.4; }
#graph .node.err .frame { stroke: var(--crit); stroke-width: 2; }
#graph .pin { cursor: crosshair; }
#graph .pin:hover { stroke-width: 3; }
#graph .ehit { cursor: pointer; }
#graph .edge.sel .wire { stroke: var(--accent) !important; }
.hud { position: absolute; right: 8px; top: 8px; display: flex; gap: 4px; }
.hud button { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 2px 8px; cursor: pointer; font-family: var(--font-mono); }
.toast { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); background: var(--ink); color: var(--panel); padding: 6px 12px; border-radius: 8px; font-size: 12px; opacity: 0; pointer-events: none; transition: opacity .2s; }
.toast.on { opacity: .92; }
.legendHud { position: absolute; left: 10px; bottom: 8px; display: flex; gap: 10px; font-size: 11px; color: var(--muted); background: color-mix(in srgb, var(--panel) 80%, transparent); padding: 3px 8px; border-radius: 6px; }
.legendHud i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: 0; }
.timeline { margin: 6px 10px 0; display: grid; gap: 3px; }
#vstrip { width: 100%; height: 12px; display: block; cursor: pointer; border-radius: 3px; }
#scrub { width: 100%; accent-color: var(--accent); margin: 0; }
.dock { margin: 8px 10px 10px; }
.dock > summary { cursor: pointer; font: 600 12px var(--font-display); text-transform: uppercase; letter-spacing: .7px; color: var(--muted); }
.charts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 6px; }
.chart { background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 6px 8px; min-width: 0; }
.chart h4 { font: 600 12px var(--font-display); margin: 0; color: var(--ink); }
.chart h4 small { font: 400 10.5px var(--font-ui); color: var(--muted); margin-left: 4px; }
.legend { display: flex; flex-wrap: wrap; gap: 2px 9px; font-size: 10.5px; color: var(--muted); margin: 2px 0; }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
.legend i.dash { height: 0; border-top: 2px dashed; border-radius: 0; width: 12px; vertical-align: 3px; }
.chart svg { width: 100%; height: auto; display: block; cursor: crosshair; }
.chart svg text { font: 10px var(--font-mono); fill: var(--muted); }
.chart.wide { grid-column: 1 / -1; }
/* details */
.details { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; padding: 10px 12px 30px; font-size: 12.5px; }
.details h2 { font: 600 16px var(--font-display); margin: 0; }
.details .sub { color: var(--muted); font-size: 11.5px; margin: 2px 0 6px; }
.typetag { display: inline-block; font-size: 10.5px; color: #fff; border-radius: 4px; padding: 0 6px; margin-bottom: 4px; }
.ctl { margin: 8px 0 0; }
.ctl label { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; }
.ctl label output { font: 11.5px var(--font-mono); color: var(--muted); white-space: nowrap; }
.ctl input[type=range] { width: 100%; accent-color: var(--accent); margin: 3px 0 0; }
.ctl select, .ctl input[type=number], .ctl input[type=text] { width: 100%; margin-top: 3px; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel-2); }
.ctl.check label { justify-content: flex-start; align-items: center; gap: 8px; cursor: pointer; }
.ctl .hint { font-size: 11px; color: var(--muted); margin-top: 2px; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; margin-top: 4px; }
.seg button { flex: 1; border: 0; background: var(--panel-2); padding: 4px; font-size: 11.5px; cursor: pointer; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--accent); color: #fff; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
.readout { margin-top: 10px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; font-size: 11.5px; }
.readout table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.readout td:last-child { text-align: right; font-family: var(--font-mono); }
.warnline { color: var(--crit); margin-top: 4px; font-size: 11.5px; }
.row { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; border-bottom: 1px solid var(--line); }
.row span:last-child { font-family: var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; }
.spark { width: 100%; height: 40px; display: block; margin: 2px 0 6px; }
.sparklabel { font-size: 11px; color: var(--muted); margin-top: 6px; }
.blind { margin: 8px 0; padding: 6px 8px; border-radius: 7px; font-size: 11.5px; background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--neo) 14%, transparent) 0 6px, transparent 6px 12px); border: 1px solid color-mix(in srgb, var(--neo) 50%, var(--line)); }
.btnrow { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.btn { border: 1px solid var(--line); background: var(--panel-2); border-radius: 7px; padding: 4px 10px; cursor: pointer; font-size: 12px; }
.btn:hover { border-color: var(--accent); }
.btn.danger { color: var(--crit); }
.targets { list-style: none; padding: 0; margin: 4px 0 0; }
.targets li { display: flex; justify-content: space-between; align-items: center; gap: 6px; padding: 3px 0; border-bottom: 1px solid var(--line); font-size: 12px; }
.reqlist { list-style: none; margin: 4px 0 0; padding: 0; }
.reqlist li { padding: 5px 4px; border-bottom: 1px solid var(--line); cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; border-radius: 6px; }
.reqlist li:hover { background: var(--panel-2); }
.reqlist .bar { grid-column: 1 / -1; display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: var(--line); }
.reqlist .meta { color: var(--muted); font-size: 10.5px; font-family: var(--font-mono); }
.reqlist .ttft { font-family: var(--font-mono); }
.wf .wrow { display: grid; grid-template-columns: 86px 1fr 60px; gap: 6px; align-items: center; font-size: 11.5px; margin: 3px 0; }
.wf .track { position: relative; height: 10px; background: var(--panel-2); border-radius: 3px; }
.wf .track i { position: absolute; top: 0; bottom: 0; border-radius: 3px; }
.wf .wrow span:last-child { font-family: var(--font-mono); text-align: right; }
.linkbtn { background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; text-decoration: underline; font-size: 12px; }
.pill { display: inline-block; font-size: 11px; padding: 0 7px; border-radius: 99px; border: 1px solid var(--line); }
.pill.ok { color: var(--good); border-color: var(--good); } .pill.bad { color: var(--crit); border-color: var(--crit); }
.ctl label.upload, .upload { display: block; margin-top: 8px; border: 1px dashed var(--line); border-radius: 8px; padding: 8px; text-align: center; cursor: pointer; font-size: 11.5px; color: var(--muted); }
.upload:hover, .upload.drag { border-color: var(--accent); color: var(--ink); }
.upload input { display: none; }
.note { font-size: 11px; color: var(--muted); margin-top: 4px; }
.note.err { color: var(--crit); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (max-width: 1300px) { .charts { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 1000px) {
  .shell { grid-template-columns: 1fr; grid-template-rows: auto auto 70vh auto; height: auto; }
  .palette { border-right: 0; border-bottom: 1px solid var(--line); max-height: 220px; }
  .details { border-left: 0; border-top: 1px solid var(--line); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="shell">
  <header class="toolbar">
    <div class="brand"><b>FleetScope</b><span title="Performance comes from spec-sheet figures and fixed efficiency factors, not measurements">uncalibrated prototype</span></div>
    <div class="tb">
      <select id="tpl" aria-label="Load a template" title="Loading a template replaces the canvas"></select>
    </div>
    <div class="tb">
      <button type="button" id="bPlay" class="play" title="Play or pause (Space)">&#9654; Play</button>
      <button type="button" id="bBack" title="Back 1 s (Left arrow)" aria-label="Back one second">&#9664;1s</button>
      <button type="button" id="bFwd" title="Forward 1 s (Right arrow)" aria-label="Forward one second">1s&#9654;</button>
      <select id="speed" aria-label="Playback speed" title="Speed (keys 1 to 6)">
        <option value="1">1×</option><option value="5">5×</option><option value="15" selected>15×</option><option value="30">30×</option><option value="60">60×</option><option value="120">120×</option>
      </select>
      <span class="clock" id="clock">00:00 / 00:00</span>
      <button type="button" id="bNext" title="Next second with TTFT breaches (N)">Next breach</button>
    </div>
    <div class="tb">
      <button type="button" id="pinBtn">Pin as baseline</button>
      <button type="button" id="clearBtn" hidden>Clear baseline</button>
      <button type="button" id="copyBtn" title="Copy this graph as JSON">Copy graph JSON</button>
    </div>
    <div class="status" id="status">Simulating…</div>
  </header>
  <aside class="palette" id="palette"></aside>
  <section class="center">
    <div class="kpis" id="kpis"></div>
    <div class="canvasWrap" id="cwrap">
      <svg id="graph" aria-label="Fleet graph editor">
        <defs>
          <pattern id="gridp" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="var(--grid)" stroke-width="1"/></pattern>
          <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="var(--line)" stroke-width="3"/></pattern>
        </defs>
        <g id="vp"><rect x="-20000" y="-20000" width="40000" height="40000" fill="url(#gridp)" id="bg"/><g id="edges"></g><g id="nodes"></g><g id="dots"></g><path id="tempWire" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="5 4" d=""/></g>
      </svg>
      <div class="hud"><button type="button" id="zIn" aria-label="Zoom in">+</button><button type="button" id="zOut" aria-label="Zoom out">&minus;</button><button type="button" id="zFit">Fit</button></div>
      <div class="legendHud"><span><i style="background:var(--onprem)"></i>request to on-prem</span><span><i style="background:var(--neo)"></i>request to neocloud</span><span><i style="background:var(--c-xfer)"></i>KV cache transfer</span><span><i style="background:var(--train)"></i>gradient sync</span></div>
      <div class="toast" id="toast" role="status"></div>
    </div>
    <div class="timeline">
      <svg id="vstrip" viewBox="0 0 1000 12" preserveAspectRatio="none" aria-label="Seconds with TTFT breaches; click to jump"></svg>
      <input type="range" id="scrub" min="0" max="600" step="0.1" value="0" aria-label="Playhead">
    </div>
    <details class="dock" open><summary>Charts</summary><div class="charts" id="charts"></div></details>
  </section>
  <aside class="details" id="details" aria-live="polite"></aside>
</div>

<script>
(function () {
'use strict';
const E = window.FleetEngine, TP = window.FleetTemplates, NT = TP.NODE_TYPES, IN = window.FleetIngest;
const $ = s => document.querySelector(s);
const NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs, parent, text) {
  const n = document.createElementNS(NS, tag);
  if (attrs) for (const k in attrs) if (attrs[k] != null) n.setAttribute(k, attrs[k]);
  if (text != null) n.textContent = text;
  if (parent) parent.appendChild(n);
  return n;
}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const mmss = s => { s = Math.max(0, Math.floor(s)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
const fS = s => !isFinite(s) ? '–' : s < 1 ? Math.round(s * 1000) + ' ms' : s < 100 ? s.toFixed(s < 10 ? 2 : 1) + ' s' : Math.round(s) + ' s';
const fMs = s => !isFinite(s) ? '–' : (s < 0.01 ? (s * 1000).toFixed(1) : Math.round(s * 1000)) + ' ms';
const fPct = v => !isFinite(v) ? '–' : (v * 100).toFixed(v >= 0.995 && v < 1 ? 1 : 0) + '%';
const fK = v => !isFinite(v) ? '–' : v >= 1e6 ? (v / 1e6).toFixed(1) + 'M' : v >= 1e4 ? Math.round(v / 1e3) + 'k' : v >= 1e3 ? (v / 1e3).toFixed(1) + 'k' : String(Math.round(v));
const fUsd = v => !isFinite(v) ? '–' : v >= 1000 ? '$' + Math.round(v).toLocaleString('en-US') : '$' + v.toFixed(v < 10 ? 2 : 0);
const fInt = v => Math.round(v).toLocaleString('en-US');
const roleName = { agg: 'Aggregated', prefill: 'Prefill', decode: 'Decode' };

// ---------- state ----------
const S = { graph: null, sel: null, view: { x: 40, y: 20, k: 0.8 }, run: null, baseline: null, T: 0, playing: false, speed: 15, probs: { errors: [], warn: [] }, nid: 1, tpl: 'burst' };
const traces = {};
function traceLookup(key, scale) {
  let tr;
  if (key === 'uploaded') tr = traces.uploaded ? traces.uploaded.trace : [];
  else tr = traces[key] || (traces[key] = E.genTrace(key, 7));
  return E.scaleTrace(tr, scale || 1, 7);
}
const nodeById = id => S.graph.nodes.find(n => n.id === id);
const typeColor = n => n.type === 'pool' ? (n.cfg.siteKind === 'neo' ? 'var(--neo)' : 'var(--onprem)') : n.type === 'train' ? 'var(--train)' : n.type === 'link' ? 'var(--n-link)' : n.type === 'router' ? 'var(--n-route)' : (n.type === 'model' || n.type === 'slo') ? 'var(--n-set)' : 'var(--n-src)';

// ---------- palette ----------
function renderPalette() {
  const p = $('#palette');
  let html = '', grp = '';
  TP.PALETTE.forEach((it, i) => {
    const g = NT[it.type].group;
    if (g !== grp) { html += '<h3>' + g + '</h3>'; grp = g; }
    const off = NT[it.type].singleton && S.graph && S.graph.nodes.some(n => n.type === it.type);

    if (pts) for (let k = 0; k < 5 && di < dots.length; k++) { const p = along(pts, ((t * 0.6 + k / 5) % 1)), d = dots[di++]; d.setAttribute('cx', p.x); d.setAttribute('cy', p.y); d.setAttribute('fill', 'var(--train)'); d.setAttribute('r', 5); }
  }
  for (; di < dots.length; di++) { const d = dots[di]; if (d.getAttribute('cx') !== '-9999') { d.setAttribute('cx', -9999); d.setAttribute('cy', -9999); } }
}

// ---------- KPIs ----------
function kpiTile(k, v, cls, d, dcls, extra) { return '<div class="kpi ' + (cls || '') + (extra || '') + '"><div class="k" title="' + k + '">' + k + '</div><div class="v">' + v + '</div><div class="d ' + (dcls || '') + '">' + (d || '') + '</div></div>'; }
function delta(cur, base, lowerBetter, fmt) {
  if (!S.baseline || !isFinite(cur) || !isFinite(base)) return ['', ''];
  const diff = cur - base;
  if (Math.abs(diff) < 1e-9) return ['= baseline', ''];
  return [(diff > 0 ? '▲ ' : '▼ ') + fmt(Math.abs(diff)), (lowerBetter ? diff < 0 : diff > 0) ? 'better' : 'worse'];
}
function renderKpis() {
  const R = S.run, s = R.summary, b = S.baseline ? S.baseline.summary : {}, slo = R.spec.slo;
  const tiles = [];
  const t1 = (k, v, cls, cur, base, lower, fmt, extra) => { const [d, dc] = delta(cur, base, lower, fmt); tiles.push(kpiTile(k, v, cls, d, dc, extra)); };
  if (s.requests) {
    t1('SLO attainment', fPct(s.slo), s.slo >= 0.99 ? 'good' : s.slo >= 0.9 ? 'warn' : 'crit', s.slo, b.slo, false, v => (v * 100).toFixed(1) + ' pt');
    t1('TTFT p99', fS(s.ttftP99), s.ttftP99 <= slo.ttft ? 'good' : 'crit', s.ttftP99, b.ttftP99, true, fS);
    t1('TPOT p99', fMs(s.tpotP99), s.tpotP99 <= slo.tpot ? 'good' : 'crit', s.tpotP99, b.tpotP99, true, fMs);
    t1('Compute load', fPct(s.util), '', s.util, b.util, false, v => (v * 100).toFixed(0) + ' pt');
    t1('Peak serving GPUs', fInt(s.peakGpus), '', s.peakGpus, b.peakGpus, true, fInt);
    t1('Serving $ / hour', fUsd(s.costPerHr), '', s.costPerHr, b.costPerHr, true, fUsd);
    t1('$ / M output tok', fUsd(s.costPerMTok), '', s.costPerMTok, b.costPerMTok, true, fUsd);
    t1('Cross-site traffic', s.crossGB >= 1 ? fK(s.crossGB) + ' GB' : (s.crossGB * 1000).toFixed(0) + ' MB', '', s.crossGB, b.crossGB, true, v => fK(v) + ' GB');
    if (s.recorded && isFinite(s.recorded.errP99)) { const e = s.recorded.errP99; tiles.push(kpiTile('Recorded TTFT p99 (log)', fS(s.recorded.ttftP99), Math.abs(e) <= 0.2 ? 'good' : 'warn', 'sim ' + (e >= 0 ? '+' : '') + Math.round(e * 100) + '% vs log', '')); }
    if (s.dropped) tiles.push(kpiTile('Rejected (context > KV)', fInt(s.dropped), 'crit', '', ''));
  }
  if (s.train) {
    const t = s.train, bt = b.train || {};
    t1('Training step', fS(t.stepS), 'train', t.stepS, bt.stepS, true, fS);
    t1('Waiting on sync', fPct(t.commShare), t.commShare > 0.2 ? 'crit' : t.commShare > 0.05 ? 'warn' : 'good', t.commShare, bt.commShare, true, v => (v * 100).toFixed(0) + ' pt');
    t1('Days / 100B tokens', t.daysPer100B.toFixed(1), 'train', t.daysPer100B, bt.daysPer100B, true, v => v.toFixed(1));
    t1('Training $ / hour', fUsd(t.costPerHr), 'train', t.costPerHr, bt.costPerHr, true, fUsd);
  }
  $('#kpis').innerHTML = tiles.join('');
}

// ---------- charts ----------
const CH = { w: 420, h: 150, l: 38, r: 8, t: 8, b: 18 };
let charts = [];
function niceMax(v) { if (!(v > 0)) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); for (const m of [1, 2, 2.5, 5, 10]) if (m * p >= v) return m * p; return 10 * p; }
function makeChart(title, legend, opt) {
  opt = opt || {};
  const card = document.createElement('section');
  card.className = 'chart' + (opt.wide ? ' wide' : '');
  card.innerHTML = '<h4>' + title + '</h4><div class="legend">' + legend.map(l => '<span><i class="' + (l.dash ? 'dash' : '') + '" style="' + (l.dash ? 'border-color:' : 'background:') + l.c + '"></i>' + l.n + '</span>').join('') + '</div>';
  const W = opt.wide ? 1000 : CH.w, H = opt.h || CH.h, L = opt.l || CH.l;
  const s = el('svg', { viewBox: '0 0 ' + W + ' ' + H, role: 'img', 'aria-label': title.replace(/<[^>]+>/g, '') });
  card.appendChild(s);
  $('#charts').appendChild(card);
  const D = Math.max(1, S.run.D - 1);
  const ch = { svg: s, W, H, L, X: v => L + (W - L - CH.r) * v / D };
  s.addEventListener('click', e => { const pt = s.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const p = pt.matrixTransform(s.getScreenCTM().inverse()); seek(clamp((p.x - L) / (W - L - CH.r) * D, 0, D)); });
  return ch;
}
function axes(ch, yMax, yFmt) {
  const Y = v => ch.H - CH.b - (ch.H - CH.b - CH.t) * clamp(v / yMax, 0, 1);
  for (let i = 0; i <= 4; i++) { const v = yMax * i / 4, y = Y(v); el('line', { x1: ch.L, x2: ch.W - CH.r, y1: y, y2: y, stroke: 'var(--line)', 'stroke-width': i ? 0.6 : 1 }, ch.svg); if (i % 2 === 0) el('text', { x: ch.L - 4, y: y + 3.5, 'text-anchor': 'end' }, ch.svg, yFmt(v)); }
  const D = S.run.D, step = D > 1500 ? 600 : D > 700 ? 300 : 120;
  for (let s = 0; s <= D; s += step) el('text', { x: ch.X(s), y: ch.H - 4, 'text-anchor': 'middle' }, ch.svg, mmss(s));
  return Y;
}
function linePath(arr, X, Y, cap) { let d = '', pen = false; for (let i = 0; i < arr.length; i++) { const v = arr[i]; if (!isFinite(v)) { pen = false; continue; } d += (pen ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(cap ? Math.min(v, cap) : v).toFixed(1); pen = true; } return d; }
function stacked(ch, series, Y) {
  const n = series[0].data.length, acc = new Float64Array(n);
  for (const s of series) {
    let top = '', bot = '';
    for (let i = 0; i < n; i++) { const y0 = acc[i]; acc[i] += s.data[i] || 0; top += (i ? 'L' : 'M') + ch.X(i).toFixed(1) + ' ' + Y(acc[i]).toFixed(1); bot = 'L' + ch.X(i).toFixed(1) + ' ' + Y(y0).toFixed(1) + bot; }
    el('path', { d: top + bot + 'Z', fill: s.c, 'fill-opacity': 0.75 }, ch.svg);
  }
}
function ph(ch) { ch.ph = el('line', { y1: CH.t, y2: ch.H - CH.b, stroke: 'var(--ink)', 'stroke-width': 1.1, 'stroke-dasharray': '3 3' }, ch.svg); }
function buildCharts() {
  $('#charts').innerHTML = ''; charts = [];
  const R = S.run, Sr = R.series, slo = R.spec.slo;
  { const leg = [{ n: 'p99', c: 'var(--accent)' }, { n: 'p50', c: 'color-mix(in srgb, var(--accent) 45%, transparent)' }, { n: 'target', c: 'var(--crit)', dash: true }];
    if (S.baseline) leg.push({ n: 'baseline p99', c: 'var(--muted)', dash: true });
    const hasRec = Sr.recP99 && Array.prototype.some.call(Sr.recP99, isFinite);
    if (hasRec) leg.push({ n: 'recorded p99 (log)', c: 'var(--good)', dash: true });
    const ch = makeChart('TTFT <small>rolling 30 s, s</small>', leg);
    let m = slo.ttft * 1.5; for (let i = 0; i < R.D; i++) { if (isFinite(Sr.p99[i])) m = Math.max(m, Sr.p99[i]); if (hasRec && isFinite(Sr.recP99[i])) m = Math.max(m, Sr.recP99[i]); }
    if (S.baseline) for (const v of S.baseline.p99) if (isFinite(v)) m = Math.max(m, v);
    m = Math.min(niceMax(m), Math.max(niceMax(slo.ttft * 10), 10));
    const Y = axes(ch, m, v => v < 10 ? v.toFixed(1) : Math.round(v));
    if (S.baseline) el('path', { d: linePath(S.baseline.p99.slice(0, R.D), ch.X, Y, m), stroke: 'var(--muted)', fill: 'none', 'stroke-width': 1.2, 'stroke-dasharray': '5 3' }, ch.svg);
    el('path', { d: linePath(Sr.p50, ch.X, Y, m), stroke: 'var(--accent)', 'stroke-opacity': 0.45, fill: 'none', 'stroke-width': 1.2 }, ch.svg);
    el('path', { d: linePath(Sr.p99, ch.X, Y, m), stroke: 'var(--accent)', fill: 'none', 'stroke-width': 1.7 }, ch.svg);
    if (hasRec) el('path', { d: linePath(Sr.recP99, ch.X, Y, m), stroke: 'var(--good)', fill: 'none', 'stroke-width': 1.5, 'stroke-dasharray': '2 3' }, ch.svg);
    el('line', { x1: ch.L, x2: ch.W - CH.r, y1: Y(slo.ttft), y2: Y(slo.ttft), stroke: 'var(--crit)', 'stroke-dasharray': '6 4', 'stroke-width': 1.1 }, ch.svg);
    ph(ch); charts.push(ch); }
  { const ch = makeChart('Where TTFT goes <small>mean, rolling 10 s</small>', [{ n: 'queue', c: 'var(--c-queue)' }, { n: 'prefill', c: 'var(--c-prefill)' }, { n: 'network/KV', c: 'var(--c-xfer)' }, { n: 'decode wait', c: 'var(--c-dwait)' }]);
    let m = 0.1; for (let i = 0; i < R.D; i++) m = Math.max(m, Sr.bq[i] + Sr.bp[i] + Sr.bx[i] + Sr.bd[i]);
    const Y = axes(ch, niceMax(m), v => v < 10 ? v.toFixed(1) : Math.round(v));
    stacked(ch, [{ data: Sr.bq, c: 'var(--c-queue)' }, { data: Sr.bp, c: 'var(--c-prefill)' }, { data: Sr.bx, c: 'var(--c-xfer)' }, { data: Sr.bd, c: 'var(--c-dwait)' }], Y);
    ph(ch); charts.push(ch); }
  if (R.pools.length) { const ps = R.pools.slice().sort((a, b) => (a.siteKind === 'neo') - (b.siteKind === 'neo'));
    const shade = (p, i) => p.siteKind === 'neo' ? 'color-mix(in srgb, var(--neo) ' + (90 - (i % 3) * 25) + '%, transparent)' : 'color-mix(in srgb, var(--onprem) ' + (90 - (i % 3) * 25) + '%, transparent)';
    const leg = ps.map((p, i) => ({ n: p.name, c: shade(p, i) }));
    if (S.baseline) leg.push({ n: 'baseline', c: 'var(--muted)', dash: true });
    const ch = makeChart('Serving GPUs <small>incl. cold starts</small>', leg);
    let m = 1; for (let i = 0; i < R.D; i++) { let s = 0; for (const p of ps) s += Sr.gpus[p.id][i]; m = Math.max(m, s); }
    if (S.baseline) for (const v of S.baseline.gpus) m = Math.max(m, v);
    const Y = axes(ch, niceMax(m), fK);
    stacked(ch, ps.map((p, i) => ({ data: Sr.gpus[p.id], c: shade(p, i) })), Y);
    if (S.baseline) el('path', { d: linePath(S.baseline.gpus.slice(0, R.D), ch.X, Y), stroke: 'var(--muted)', fill: 'none', 'stroke-width': 1.2, 'stroke-dasharray': '5 3' }, ch.svg);
    ph(ch); charts.push(ch); }
  { const ch = makeChart('Traffic <small>req/s</small>', [{ n: 'arrivals', c: 'var(--accent)' }, { n: 'completions', c: 'var(--muted)' }]);
    let m = 1; for (let i = 0; i < R.D; i++) m = Math.max(m, Sr.arrivals[i], Sr.completions[i]);
    const Y = axes(ch, niceMax(m), fK);
    el('path', { d: linePath(Sr.completions, ch.X, Y), stroke: 'var(--muted)', fill: 'none', 'stroke-width': 1.1 }, ch.svg);
    el('path', { d: linePath(Sr.arrivals, ch.X, Y), stroke: 'var(--accent)', fill: 'none', 'stroke-width': 1.3 }, ch.svg);
    ph(ch); charts.push(ch); }
  { const rows = R.pools.map(p => ({ n: p.name, data: Sr.util[p.id], c: p.siteKind === 'neo' ? 'var(--neo)' : 'var(--onprem)' }));
    for (const L of R.links) if (!L.fabric || R.frames.some(f => f.links[L.id].util > 0.01)) rows.push({ n: L.name, data: Float64Array.from(R.frames, f => f.links[L.id].util), c: 'var(--c-xfer)' });
    const h = 12 + rows.length * 18 + 16;
    const ch = makeChart('Load heatmap <small>compute load per pool, bandwidth per link; click to jump</small>', [], { wide: true, h, l: 160 });
    const bin = Math.max(1, Math.ceil(R.D / 300));
    rows.forEach((row, ri) => {
      const y = 6 + ri * 18;
      el('text', { x: ch.L - 6, y: y + 11, 'text-anchor': 'end' }, ch.svg, row.n.length > 26 ? row.n.slice(0, 25) + '…' : row.n);
      for (let s = 0; s < R.D; s += bin) { let v = 0; for (let j = s; j < Math.min(R.D, s + bin); j++) v = Math.max(v, row.data[j] || 0); if (v < 0.02) continue; el('rect', { x: ch.X(s), y, width: Math.max(1, ch.X(s + bin) - ch.X(s) + 0.3), height: 14, fill: row.c, 'fill-opacity': (0.08 + 0.9 * v).toFixed(2) }, ch.svg); }
    });
    const step = R.D > 1500 ? 300 : R.D > 700 ? 120 : 60;
    for (let s = 0; s <= R.D; s += step) el('text', { x: ch.X(s), y: h - 3, 'text-anchor': 'middle' }, ch.svg, mmss(s));
    ch.ph = el('line', { y1: 4, y2: h - 14, stroke: 'var(--ink)', 'stroke-width': 1.1, 'stroke-dasharray': '3 3' }, ch.svg);
    charts.push(ch); }
}
function buildStrip() {
  const v = $('#vstrip');
  v.innerHTML = '';
  const R = S.run, Sr = R.series, D = Math.max(1, R.D);
  el('rect', { x: 0, y: 0, width: 1000, height: 12, fill: 'var(--panel)' }, v);
  for (let s = 0; s < R.D; s++) { if (!Sr.firsts[s]) continue; const f = Sr.viol[s] / Sr.firsts[s]; if (f <= 0.02) continue; el('rect', { x: 1000 * s / D, y: 0, width: Math.max(1, 1000 / D), height: 12, fill: 'var(--crit)', 'fill-opacity': (0.2 + 0.8 * f).toFixed(2) }, v); }
  if (R.summary.train) for (const st of R.train.steps) if (st.comm > 0.5) el('rect', { x: 1000 * (st.end - st.comm) / D, y: 9, width: Math.max(1, 1000 * st.comm / D), height: 3, fill: 'var(--train)' }, v);
}
$('#vstrip').addEventListener('click', e => { if (!S.run) return; const b = e.currentTarget.getBoundingClientRect(); seek((e.clientX - b.left) / b.width * (S.run.D - 1)); });

// ---------- playback ----------
let lastSec = -1;
function seek(t) { if (!S.run) return; S.T = clamp(t, 0, Math.max(0, S.run.D - 1)); render(true); }
function render(force) {
  const R = S.run;
  if (!R) return;
  updateLive(S.T);
  for (const ch of charts) { const x = ch.X(S.T); ch.ph.setAttribute('x1', x); ch.ph.setAttribute('x2', x); }
  $('#clock').textContent = mmss(S.T) + ' / ' + mmss(R.D);
  const sc = $('#scrub'); if (document.activeElement !== sc) sc.value = S.T;
  const sec = Math.floor(S.T);
  if (force || sec !== lastSec) {
    lastSec = sec;
    if (S.sel && (S.sel.type === 'node' || S.sel.type === 'edge')) renderLive();
    else if (!S.sel || S.sel.type !== 'req') renderOverview();
  }
}
let lastTs = 0;
function loop(ts) {
  if (S.playing && S.run) {
    const dt = lastTs ? Math.min(0.1, (ts - lastTs) / 1000) : 0;
    S.T += dt * S.speed;
    if (S.T >= S.run.D - 1) { S.T = S.run.D - 1; setPlaying(false); }
    render(false);
  }
  lastTs = ts;
  requestAnimationFrame(loop);
}
function setPlaying(v) { S.playing = v; $('#bPlay').innerHTML = v ? '&#10074;&#10074; Pause' : '&#9654; Play'; }
$('#bPlay').onclick = () => { if (!S.run) return; if (!S.playing && S.T >= S.run.D - 1.01) S.T = 0; setPlaying(!S.playing); };
$('#bBack').onclick = () => seek(Math.floor(S.T) - 1);
$('#bFwd').onclick = () => seek(Math.floor(S.T) + 1);
$('#speed').onchange = e => { S.speed = +e.target.value; };
$('#scrub').addEventListener('input', e => { S.T = +e.target.value; render(false); });
function nextBreach() {
  const R = S.run; if (!R) return;
  const Sr = R.series, ok = s => Sr.firsts[s] && Sr.viol[s] / Sr.firsts[s] > 0.1;
  for (let s = Math.floor(S.T) + 1; s < R.D; s++) if (ok(s)) return seek(s);
  for (let s = 0; s <= Math.floor(S.T); s++) if (ok(s)) return seek(s);
  toast('No seconds with more than 10% of requests over the TTFT target.');
}
$('#bNext').onclick = nextBreach;
document.addEventListener('keydown', e => {
  if (e.target.closest('input, select, textarea')) return;
  if (e.key === ' ') { e.preventDefault(); $('#bPlay').click(); }
  else if (e.key === 'ArrowRight') seek(Math.floor(S.T) + 1);
  else if (e.key === 'ArrowLeft') seek(Math.floor(S.T) - 1);
  else if (e.key === 'n' || e.key === 'N') nextBreach();
  else if (e.key === 'f' || e.key === 'F') fit();
  else if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); deleteSelection(); }
  else if (/^[1-6]$/.test(e.key)) { const sp = $('#speed'); sp.selectedIndex = +e.key - 1; S.speed = +sp.value; }
});
$('#pinBtn').onclick = () => {
  const R = S.run; if (!R) return;
  const tot = new Float64Array(R.D);
  for (const p of R.pools) for (let i = 0; i < R.D; i++) tot[i] += R.series.gpus[p.id][i];
  S.baseline = { label: R.label, summary: R.summary, p99: Array.from(R.series.p99), gpus: Array.from(tot) };
  $('#clearBtn').hidden = false; $('#pinBtn').textContent = 'Re-pin baseline';
  toast('Pinned. Change anything and the KPIs and charts compare against it.');
  doRun();
};
$('#clearBtn').onclick = () => { S.baseline = null; $('#clearBtn').hidden = true; $('#pinBtn').textContent = 'Pin as baseline'; doRun(); };
$('#copyBtn').onclick = () => {
  const txt = JSON.stringify(S.graph, null, 1);
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(() => toast('Graph JSON copied.'), () => toast('Copy was blocked by the browser.'));
  else toast('Copy is not available here.');
};
// templates
const tplSel = $('#tpl');
tplSel.innerHTML = TP.TEMPLATES.map(t => '<option value="' + t.id + '">Template: ' + t.name + ' — ' + t.desc + '</option>').join('');
tplSel.onchange = () => loadTemplate(tplSel.value);
function loadTemplate(id) {
  const t = TP.TEMPLATES.find(x => x.id === id);
  S.tpl = id; S.graph = t.build(); S.sel = null; S.dirty = false; firstRun = true; setPlaying(false);
  S.nid = 100; S.needFit = true;
  renderPalette(); renderGraph(); requestAnimationFrame(fit); renderDetails(); scheduleRun(0);
}
loadTemplate('burst');
requestAnimationFrame(loop);
window.addEventListener('resize', () => {});
})();
</script>
</body>
