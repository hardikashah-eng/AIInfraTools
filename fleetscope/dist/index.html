<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FleetScope</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: editor shell. Toolbar on top; node palette left; graph canvas centre with timeline and charts dock under it; details panel right. */
:root {
  --bg: #e9edf1; --panel: #ffffff; --panel-2: #f4f6f8; --canvas: #e3e8ee; --grid: rgba(40, 60, 80, .09);
  --ink: #16212b; --muted: #5a6876; --line: #d3dae1;
  --accent: #1f5fd1; --onprem: #1f5fd1; --neo: #b45f12; --train: #148a8a;
  --n-src: #2d8a57; --n-route: #56677a; --n-link: #8a5cd6; --n-set: #6b7785;
  --good: #1f8a4c; --warn: #b98000; --crit: #c8372d;
  --c-queue: #d9653b; --c-prefill: #1f5fd1; --c-xfer: #8a5cd6; --c-dwait: #8d99a6;
  --font-ui: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-display: 'IBM Plex Sans Condensed', 'IBM Plex Sans', system-ui, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1015; --panel: #131a21; --panel-2: #18212a; --canvas: #0e141a; --grid: rgba(160, 190, 220, .07);
    --ink: #e2e8ed; --muted: #94a3b0; --line: #2a3640;
    --accent: #6f9dff; --onprem: #6f9dff; --neo: #e59a4f; --train: #3cc2bd;
    --n-src: #4cc38a; --n-route: #8fa1b3; --n-link: #b08cf2; --n-set: #8c98a4;
    --good: #45c181; --warn: #e2b440; --crit: #f0685c;
    --c-queue: #f0875e; --c-prefill: #6f9dff; --c-xfer: #b08cf2; --c-dwait: #7d8a96;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1015; --panel: #131a21; --panel-2: #18212a; --canvas: #0e141a; --grid: rgba(160, 190, 220, .07);
  --ink: #e2e8ed; --muted: #94a3b0; --line: #2a3640;
  --accent: #6f9dff; --onprem: #6f9dff; --neo: #e59a4f; --train: #3cc2bd;
  --n-src: #4cc38a; --n-route: #8fa1b3; --n-link: #b08cf2; --n-set: #8c98a4;
  --good: #45c181; --warn: #e2b440; --crit: #f0685c;
  --c-queue: #f0875e; --c-prefill: #6f9dff; --c-xfer: #b08cf2; --c-dwait: #7d8a96;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 13px/1.45 var(--font-ui); }
button, select, input { font: inherit; color: inherit; }
.shell { display: grid; grid-template-columns: 210px minmax(0, 1fr) 340px; grid-template-rows: auto minmax(0, 1fr); height: calc(100% - 34px); }
.shell[hidden] { display: none; }
.viewbar { height: 34px; box-sizing: border-box; display: flex; align-items: center; gap: 2px; padding: 0 10px; background: var(--ink); color: var(--panel); }
.viewbar b { font: 600 13px var(--font-display); margin-right: 12px; letter-spacing: .3px; }
.viewbar button { border: 0; background: transparent; color: inherit; opacity: .7; padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 12.5px; }
.viewbar button[aria-selected="true"] { opacity: 1; background: color-mix(in srgb, var(--panel) 18%, transparent); font-weight: 600; }
.viewbar .hint { margin-left: auto; font-size: 11.5px; opacity: .65; }
/* cluster view */
.cfg .card { border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; margin-bottom: 6px; background: var(--panel-2); }
.cfg .card summary { cursor: pointer; font-size: 12px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.cfg .card summary span { color: var(--muted); font-size: 11px; }
.cfg .frow { display: flex; justify-content: space-between; align-items: center; gap: 6px; font-size: 11.5px; margin: 4px 0; }
.cfg .frow input, .cfg .frow select, .cfg .ctl input { width: 74px; border: 1px solid var(--line); border-radius: 5px; padding: 2px 4px; background: var(--panel); }
.cfg .chk { display: block; font-size: 12px; margin: 5px 0; cursor: pointer; }
.cfg .lbl { font-size: 11.5px; color: var(--muted); }
.cfg .ctl { margin: 6px 0; }
.sw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: 0; }
.chead { margin: 8px 10px 0; font-size: 13px; background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 8px; padding: 7px 10px; }
.chead b { font-weight: 600; }
.chead .sub { color: var(--muted); }
.gridWrap { position: relative; margin: 8px 10px 0; padding: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
.gridWrap canvas { display: block; cursor: crosshair; }
.gtip { position: absolute; pointer-events: none; background: var(--ink); color: var(--panel); font-size: 11.5px; padding: 4px 8px; border-radius: 6px; max-width: 260px; z-index: 3; }
.glegend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 11px; color: var(--muted); margin: 6px 12px 0; }
.glegend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
.glegend i.empty { border: 1px solid var(--line); background: none; }
.glegend i.hatch { background: repeating-linear-gradient(135deg, var(--muted) 0 2px, transparent 2px 4px); }
.glegend i.dash { border-top: 1.5px dashed var(--ink); height: 0; width: 14px; border-radius: 0; vertical-align: 3px; }
.glegend .sep { font-weight: 600; }
#clusterApp .timeline, #trainingApp .timeline, #inferenceApp .timeline { margin: 6px 10px 0; padding: 6px 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
#inferenceApp .timeline input, #trainingApp .timeline input, #clusterApp .timeline input { width: 100%; }
#cGantt { display: block; margin: 0 18px 20px; }
.cpad { margin: 12px 18px 4px !important; font: 600 12px var(--font-display); text-transform: uppercase; letter-spacing: .7px; color: var(--muted); }
.cpad .sub { text-transform: none; letter-spacing: 0; }
#cKpis .v, #tKpis .v, #iKpis .v { font-size: 15px; white-space: nowrap; }
.tname { font-size: 13px; }
.tname b { font-weight: 600; }
.sec2 { font: 600 12px var(--font-display); text-transform: uppercase; letter-spacing: .7px; color: var(--muted); margin: 0 0 6px; }
.sec2 .sub { text-transform: none; letter-spacing: 0; font-weight: 400; }
.wbar { display: flex; height: 18px; border-radius: 5px; overflow: hidden; }
.wbar i { display: block; height: 100%; }
.hbar { display: grid; grid-template-columns: 170px 1fr 60px; gap: 8px; align-items: center; font-size: 12px; margin: 3px 0; }
.hbar i { display: block; height: 9px; border-radius: 3px; }
.hbar b { font: 500 12px var(--font-mono); text-align: right; }
.two { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); }
.cgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 6px; }
.ccard { border: 1px solid var(--line); border-left: 4px solid var(--good); border-radius: 8px; padding: 6px 8px; font-size: 12px; background: var(--panel-2); }
.ccard.bad { border-left-color: var(--crit); }
.ccard b { display: block; font-weight: 600; margin-bottom: 2px; }
.ccard span { color: var(--muted); }
#trainingApp .lead { font-size: 13px; margin: 2px 0 8px; }
.btnlike { border: 1px solid var(--line); background: var(--panel-2); border-radius: 7px; padding: 4px 9px; cursor: pointer; font-size: 13px; }
.btnlike:hover { border-color: var(--accent); }
/* toolbar */
.toolbar { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: baseline; gap: 6px; margin-right: 4px; }
.brand b { font: 600 19px/1 var(--font-display); }
.brand span { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: 0 7px; }
.tb { display: flex; align-items: center; gap: 6px; }
.tb select, .tb button { border: 1px solid var(--line); background: var(--panel-2); border-radius: 7px; padding: 4px 9px; cursor: pointer; }
.tb button:hover, .tb select:hover { border-color: var(--accent); }
.tb .play { background: var(--accent); border-color: var(--accent); color: #fff; min-width: 84px; font-weight: 600; }
.clock { font: 500 13px var(--font-mono); font-variant-numeric: tabular-nums; min-width: 104px; text-align: center; }
.status { font-size: 12px; color: var(--muted); margin-left: auto; }
.status b { color: var(--ink); font-weight: 500; }
.status .bad { color: var(--crit); }
/* palette */
.palette { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; padding: 10px; }
.palette h3, .details h3.sec { font: 600 12px var(--font-display); text-transform: uppercase; letter-spacing: .7px; color: var(--muted); margin: 12px 0 6px; }
.palette h3:first-child { margin-top: 0; }
.pitem { display: flex; gap: 8px; align-items: flex-start; border: 1px solid var(--line); background: var(--panel-2); border-radius: 8px; padding: 6px 8px; margin-bottom: 6px; cursor: grab; user-select: none; }
.pitem:hover { border-color: var(--accent); }
.pitem:active { cursor: grabbing; }
.pitem i { flex: 0 0 4px; align-self: stretch; border-radius: 2px; }
.pitem b { display: block; font-size: 12.5px; font-weight: 600; }
.pitem span { display: block; font-size: 11px; color: var(--muted); line-height: 1.3; }
.pitem.off { opacity: .45; cursor: not-allowed; }
.probs { list-style: none; margin: 0; padding: 0; font-size: 11.5px; }
.probs li { padding: 5px 6px; border-radius: 6px; margin-bottom: 4px; cursor: pointer; border-left: 3px solid var(--warn); background: var(--panel-2); }
.probs li.err { border-left-color: var(--crit); }
.probs li:hover { outline: 1px solid var(--accent); }
.help { font-size: 11px; color: var(--muted); line-height: 1.5; }
.help kbd { font: 10.5px var(--font-mono); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; background: var(--panel-2); }
/* centre */
.center { display: block; overflow-y: auto; min-height: 0; min-width: 0; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 6px; padding: 8px 10px 0; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 5px 9px; position: relative; overflow: hidden; }
.kpi::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--line); }
.kpi.good::before { background: var(--good); } .kpi.warn::before { background: var(--warn); } .kpi.crit::before { background: var(--crit); }
.kpi.train::before { background: var(--train); }
.kpi .k { font-size: 10.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi .v { font: 500 16px/1.2 var(--font-mono); font-variant-numeric: tabular-nums; }
.kpi .d { font: 10.5px var(--font-mono); color: var(--muted); min-height: 14px; white-space: nowrap; }
.kpi .d.better { color: var(--good); } .kpi .d.worse { color: var(--crit); }
.canvasWrap { position: relative; margin: 8px 10px 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--canvas); height: clamp(420px, 64vh, 900px); }
#graph { width: 100%; height: 100%; display: block; touch-action: none; user-select: none; }
#graph text { font-family: var(--font-ui); }
#graph .mono { font-family: var(--font-mono); }
#graph .node { cursor: move; }
#graph .node .frame { fill: var(--panel); stroke: var(--line); stroke-width: 1.2; }
#graph .node.sel .frame { stroke: var(--accent); stroke-width: 2.4; }
#graph .node.err .frame { stroke: var(--crit); stroke-width: 2; }
#graph .node.h1 .frame { stroke: var(--warn); stroke-width: 2.6; }
#graph .node.h2 .frame { stroke: var(--crit); stroke-width: 3.2; }
#graph .node.h2 .frame { filter: drop-shadow(0 0 6px color-mix(in srgb, var(--crit) 55%, transparent)); }
#graph .hbadge { cursor: help; }
#graph .lint { cursor: help; }
.probs li.lint { border-left-color: var(--warn); }
.probs li.lint.info { border-left-color: var(--accent); }
.probs li .fix { display: block; color: var(--muted); margin-top: 2px; }
.health { margin: 4px 0 6px; }
.health .row b { font-weight: 600; }
.hdot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 0; }
#graph .pin { cursor: crosshair; }
#graph .pin:hover { stroke-width: 3; }
#graph .ehit { cursor: pointer; }
#graph .edge.sel .wire { stroke: var(--accent) !important; }
.hud { position: absolute; right: 8px; top: 8px; display: flex; gap: 4px; }
.hud button { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 2px 8px; cursor: pointer; font-family: var(--font-mono); }
.toast { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); background: var(--ink); color: var(--panel); padding: 6px 12px; border-radius: 8px; font-size: 12px; opacity: 0; pointer-events: none; transition: opacity .2s; }
.toast.on { opacity: .92; }
.stressBanner { position: absolute; left: 8px; top: 8px; max-width: calc(100% - 140px); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; background: var(--panel); border: 1px solid var(--warn); border-left: 4px solid var(--warn); border-radius: 8px; padding: 5px 10px; font-size: 12px; }
.stressBanner b { font-weight: 600; }
.stressBanner[hidden], .analysis[hidden] { display: none; }
.analysis { margin: 8px 10px 0; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.analysis h3 { font: 600 14px var(--font-display); margin: 0 0 4px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.analysis .lead { font-size: 13px; margin: 2px 0 8px; max-width: 90ch; }
.analysis .lead b { font-weight: 600; }
.atable { width: 100%; border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
.atable th { text-align: left; font-weight: 600; color: var(--muted); font-size: 11px; border-bottom: 1px solid var(--line); padding: 4px 6px; white-space: nowrap; }
.atable td { border-bottom: 1px solid var(--line); padding: 4px 6px; }
.atable td.num { font-family: var(--font-mono); text-align: right; white-space: nowrap; }
.atable tr.click { cursor: pointer; }
.atable tr.click:hover td { background: var(--panel-2); }
.atable tr.pick td { background: color-mix(in srgb, var(--good) 10%, transparent); }
.atable tr.dim td { color: var(--muted); }
.ascroll { overflow-x: auto; }
.progress { height: 6px; background: var(--panel-2); border-radius: 3px; overflow: hidden; margin: 6px 0; }
.progress i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .15s; }
.sgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 6px; }
.sgrid button { text-align: left; border: 1px solid var(--line); background: var(--panel-2); border-radius: 8px; padding: 5px 8px; cursor: pointer; font-size: 12px; line-height: 1.25; }
.sgrid button:hover { border-color: var(--accent); }
.sgrid button:disabled { opacity: .45; cursor: not-allowed; }
.sgrid button span { display: block; color: var(--muted); font-size: 10.5px; }
.orow { border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; margin-top: 6px; background: var(--panel-2); }
.lensbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 8px 10px 0; }
.ltabs { display: flex; gap: 2px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 9px; padding: 2px; }
.ltabs button { border: 0; background: transparent; border-radius: 7px; padding: 4px 11px; font-size: 12.5px; cursor: pointer; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.ltabs button i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.ltabs button[aria-selected="true"] { background: var(--panel); color: var(--ink); font-weight: 600; box-shadow: 0 0 0 1px var(--line); }
.lscope { display: flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.lscope button { border: 0; background: var(--panel-2); padding: 3px 9px; font-size: 11.5px; cursor: pointer; }
.lscope button.on { background: var(--ink); color: var(--panel); }
.lscope[hidden] { display: none; }
.linfo { flex: 1; min-width: 260px; font-size: 12px; color: var(--muted); }
.linfo b { color: var(--ink); font-weight: 600; }
.lgrad { display: inline-block; width: 60px; height: 8px; border-radius: 4px; vertical-align: -1px; margin: 0 4px; }
.lrows .row { cursor: pointer; }
.lrows .row:hover span:first-child { text-decoration: underline; }
.lbar { display: block; height: 4px; border-radius: 2px; margin-top: 2px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.mtx { width: 100%; border-collapse: collapse; font-size: 11.5px; margin-top: 4px; }
.mtx th, .mtx td { padding: 3px 2px; border-bottom: 1px solid var(--line); text-align: center; }
.mtx th:first-child, .mtx td:first-child { text-align: left; }
.mtx input[type=number] { width: 52px; padding: 2px 4px; border: 1px solid var(--line); border-radius: 5px; background: var(--panel); }
.kpi.wide { grid-column: span 2; cursor: pointer; }
.kpi.wide .v { font-size: 13.5px; font-family: var(--font-ui); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.legendHud { position: absolute; left: 10px; bottom: 8px; display: flex; gap: 10px; font-size: 11px; color: var(--muted); background: color-mix(in srgb, var(--panel) 80%, transparent); padding: 3px 8px; border-radius: 6px; }
.legendHud i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: 0; }
.timeline { margin: 6px 10px 0; display: grid; gap: 3px; }
#vstrip { width: 100%; height: 12px; display: block; cursor: pointer; border-radius: 3px; }
#scrub { width: 100%; accent-color: var(--accent); margin: 0; }
.dock { margin: 8px 10px 10px; }
.dock > summary { cursor: pointer; font: 600 12px var(--font-display); text-transform: uppercase; letter-spacing: .7px; color: var(--muted); }
.charts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 6px; }
.chart { background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 6px 8px; min-width: 0; }
.chart h4 { font: 600 12px var(--font-display); margin: 0; color: var(--ink); }
.chart h4 small { font: 400 10.5px var(--font-ui); color: var(--muted); margin-left: 4px; }
.legend { display: flex; flex-wrap: wrap; gap: 2px 9px; font-size: 10.5px; color: var(--muted); margin: 2px 0; }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
.legend i.dash { height: 0; border-top: 2px dashed; border-radius: 0; width: 12px; vertical-align: 3px; }
.chart svg { width: 100%; height: auto; display: block; cursor: crosshair; }
.chart svg text { font: 10px var(--font-mono); fill: var(--muted); }
.chart.wide { grid-column: 1 / -1; }
/* details */
.details { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; padding: 10px 12px 30px; font-size: 12.5px; }
.details h2 { font: 600 16px var(--font-display); margin: 0; }
.details .sub { color: var(--muted); font-size: 11.5px; margin: 2px 0 6px; }
.typetag { display: inline-block; font-size: 10.5px; color: #fff; border-radius: 4px; padding: 0 6px; margin-bottom: 4px; }
.ctl { margin: 8px 0 0; }
.ctl label { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; }
.ctl label output { font: 11.5px var(--font-mono); color: var(--muted); white-space: nowrap; }
.ctl input[type=range] { width: 100%; accent-color: var(--accent); margin: 3px 0 0; }
.ctl select, .ctl input[type=number], .ctl input[type=text] { width: 100%; margin-top: 3px; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel-2); }
.ctl.check label { justify-content: flex-start; align-items: center; gap: 8px; cursor: pointer; }
.ctl .hint { font-size: 11px; color: var(--muted); margin-top: 2px; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; margin-top: 4px; }
.seg button { flex: 1; border: 0; background: var(--panel-2); padding: 4px; font-size: 11.5px; cursor: pointer; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--accent); color: #fff; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
.readout { margin-top: 10px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; font-size: 11.5px; }
.readout table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.readout td:last-child { text-align: right; font-family: var(--font-mono); }
.warnline { color: var(--crit); margin-top: 4px; font-size: 11.5px; }
.row { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; border-bottom: 1px solid var(--line); }
.row span:last-child { font-family: var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; }
.spark { width: 100%; height: 40px; display: block; margin: 2px 0 6px; }

.btnrow { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }

.reqlist { list-style: none; margin: 4px 0 0; padding: 0; }

.reqlist li:hover { background: var(--panel-2); }

.reqlist .ttft { font-family: var(--font-mono); }

<script>
/* FleetScope engine: time-stepped fleet simulation for LLM serving and training.
   Pure functions, no DOM. Deterministic for (workload, scenario, seed).
   Performance is derived from model and GPU spec-sheet figures with fixed efficiency factors:
   a first-order roofline model, not calibrated. */
(function (root) {
  'use strict';

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;

  }
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

  // Approximate public spec-sheet figures (dense TFLOPS, HBM GB, HBM TB/s). Prices are placeholders, $/GPU-hour.
  const GPUS = {
    A100: { label: 'A100 80GB', hbm: 80, bw: 2.0, bf16: 312, fp8: 312, onprem: 0.9, rent: 1.6 },
    L40S: { label: 'L40S 48GB', hbm: 48, bw: 0.864, bf16: 362, fp8: 733, onprem: 0.7, rent: 1.1 },
    H100: { label: 'H100 80GB', hbm: 80, bw: 3.35, bf16: 989, fp8: 1979, onprem: 1.4, rent: 2.4 },
    H200: { label: 'H200 141GB', hbm: 141, bw: 4.8, bf16: 989, fp8: 1979, onprem: 2.0, rent: 3.5 },
    MI300X: { label: 'MI300X 192GB', hbm: 192, bw: 5.3, bf16: 1307, fp8: 2615, onprem: 1.5, rent: 2.6 },
    B200: { label: 'B200 180GB', hbm: 180, bw: 8.0, bf16: 2250, fp8: 4500, onprem: 3.2, rent: 5.5 }
  };
  // Approximate architecture figures. kvDim = per-token, per-layer K+V width (2 x kv_heads x head_dim, or MLA latent).
  const MODELS = {
    'llama-8b': { label: 'Llama 3.1 8B', params: 8, active: 8, layers: 32, kvHeads: 8, headDim: 128, mla: 0 },
    'coder-32b': { label: 'Qwen2.5-Coder 32B', params: 32.8, active: 32.8, layers: 64, kvHeads: 8, headDim: 128, mla: 0 },
    'llama-70b': { label: 'Llama 3.3 70B', params: 70.6, active: 70.6, layers: 80, kvHeads: 8, headDim: 128, mla: 0 },
    'llama-405b': { label: 'Llama 3.1 405B', params: 405, active: 405, layers: 126, kvHeads: 8, headDim: 128, mla: 0 },
    'moe-671b': { label: 'MoE 671B, 37B active (MLA)', params: 671, active: 37, layers: 61, kvHeads: 0, headDim: 0, mla: 576 }
  };

  // ---------- performance profile ----------
  function profile(gpuKey, m) {
    const G = GPUS[gpuKey];
    const wBytes = m.params * 1e9 * (m.wPrec === 'bf16' ? 2 : 1);
    const kvElem = m.kvPrec === 'bf16' ? 2 : 1;
    const kvBytesPerToken = m.mla ? m.layers * m.mla * kvElem : 2 * m.layers * m.kvHeads * m.headDim * kvElem;

    const tflops = (m.wPrec === 'bf16' ? G.bf16 : G.fp8) * 1e12;
    const bw = G.bw * 1e12 * 0.75;
    const prefill = tp * tflops * 0.45 / (2 * m.active * 1e9);
    const weightRead = Math.min(wBytes, m.active * 1e9 * (m.wPrec === 'bf16' ? 2 : 1) * (m.params > m.active ? 3 : 1));
    const a = weightRead / (tp * bw) + 0.003;
    const b0 = 2 * m.active * 1e9 / (tp * tflops * 0.5);
    const c = kvBytesPerToken / (tp * bw);
    const kvCap = Math.max(0, Math.floor((tp * G.hbm * 1e9 * 0.9 - wBytes) / kvBytesPerToken));
    return { gpu: gpuKey, tp, prefill, a, b0, c, kvCap, kvBytesPerToken, wBytes, multiNode: tp > 8 };
  }

  // Calibration: measured multipliers on the spec-sheet profile. prefill scales prefill throughput;
  // decode scales every decode-step term (fixed, per-sequence and per-context-token).
  function calibrated(P, cal) {
    if (!cal || ((cal.prefill || 1) === 1 && (cal.decode || 1) === 1)) return P;
    const d = cal.decode || 1;
    return Object.assign({}, P, { prefill: P.prefill * (cal.prefill || 1), a: P.a * d, b0: P.b0 * d, c: P.c * d, calib: { prefill: cal.prefill || 1, decode: d } });
  }

  // ---------- recorded traces ----------
  const TRACES = {
    chat: { label: 'Sample: chat, daily ramp with a spike' },
    agentic: { label: 'Sample: agentic, long prompts in bursts' },
    steady: { label: 'Sample: steady 10 req/s' },
    sessions: { label: 'Sample: agent sessions log (session ids, recorded latency)' }
  };
  // A synthetic "recorded" agent log: 150 sessions whose turns follow the previous answer plus tool time,
  // with recorded TTFT and end-to-end latency, cache hits, and occasional parallel tool calls.
  function genSessionLog(seed) {
    const rng = makeRng((seed * 7919 + 4) >>> 0);
    const rows = [];
    for (let sid = 0; sid < 150; sid++) {
      let t = rng.u() * 420, ctx = Math.round(4000 + 26000 * rng.u());
      const turns = Math.max(2, Math.round(rng.logn(8, 0.5)));
      for (let k = 0; k < turns && t < 600; k++) {
        const add = Math.round(rng.logn(2000, 0.8));
        const isl = Math.min(120000, ctx + add), osl = clamp(Math.round(rng.logn(300, 0.7)), 8, 4000);
        const ttft = 0.25 + isl * (1 - 0.85) / 15000 + rng.u() * 0.3, e2e = ttft + osl * 0.03;
        rows.push({ t, isl, osl, cached: Math.round(ctx * 0.85), ttft, e2e, session: 'agent-' + sid });
        if (rng.u() < 0.1) rows.push({ t: t + 0.2, isl: Math.round(isl * 0.6), osl: Math.round(osl * 0.5), cached: Math.round(ctx * 0.5), ttft: ttft * 0.8, e2e: ttft * 0.8 + osl * 0.015, session: 'agent-' + sid });
        ctx = isl + osl;
        t += e2e + Math.max(0.3, rng.logn(4, 0.6));

    return rows.sort((a, b) => a.t - b.t);
  }
  function genTrace(kind, seed) {
    if (kind === 'sessions') return genSessionLog(seed);
    const rng = makeRng((seed * 7919 + (kind === 'chat' ? 1 : kind === 'agentic' ? 2 : 3)) >>> 0);
    const D = 600;
    let rate, isl, osl, peak;
    if (kind === 'chat') {
      rate = t => 9 + 7 * Math.sin(Math.PI * t / D) + (t >= 330 && t < 390 ? 14 : 0); peak = 30;
      isl = () => clamp(Math.round(rng.logn(1100, 0.9)), 32, 16000);
      osl = () => clamp(Math.round(rng.logn(220, 0.8)), 8, 2048);
    } else if (kind === 'agentic') {
      rate = t => 2.5 + (t >= 40 && ((t - 40) % 100) < 20 ? 12 : 0); peak = 14.5;
      isl = () => clamp(Math.round(rng.logn(7000, 0.6)), 500, 60000);
      osl = () => clamp(Math.round(rng.logn(150, 0.7)), 8, 1500);
    } else {
      rate = () => 10; peak = 10;
      isl = () => clamp(Math.round(rng.logn(800, 0.7)), 32, 8000);
      osl = () => clamp(Math.round(rng.logn(300, 0.7)), 8, 2048);
    }
    const out = [];
    let t = 0;
    for (;;) {
      t += -Math.log(1 - rng.u()) / peak;
      if (t >= D) break;
      if (rng.u() < rate(t) / peak) out.push({ t, isl: isl(), osl: osl() });
    }
    return out;
  }
  // Scales load by thinning or duplicating requests. Copies keep token counts and cache hits but
  // drop recorded latencies and sessions, which only describe the original request.
  function scaleTrace(tr, f, seed) {
    if (Math.abs(f - 1) < 1e-9) return tr.map(r => Object.assign({}, r));
    const rng = makeRng((seed + 101) >>> 0);
    const out = [];
    for (const r of tr) {
      let n = Math.floor(f);
      if (rng.u() < f - n) n++;
      for (let k = 0; k < n; k++) {
        if (k === 0) { out.push(Object.assign({}, r)); continue; }
        const c = { t: r.t + rng.u() * 0.5, isl: r.isl, osl: r.osl };
        if (r.cached != null) c.cached = r.cached;
        out.push(c);
      }
    }
    out.sort((a, b) => a.t - b.t);
    return out;
  }
  // ---------- helpers ----------
  class Q {
    constructor() { this.a = []; this.h = 0; }
    push(x) { this.a.push(x); }
    get length() { return this.a.length - this.h; }
    peek() { return this.a[this.h]; }
    shift() { const x = this.a[this.h++]; if (this.h > 1024 && this.h * 2 > this.a.length) { this.a = this.a.slice(this.h); this.h = 0; } return x; }
  }
  class Heap {
    constructor() { this.a = []; }
    get size() { return this.a.length; }

    }
  }
  function pct(sorted, p) {
    if (!sorted.length) return NaN;
    return sorted[Math.min(sorted.length - 1, Math.max(0, Math.ceil(p * sorted.length) - 1))];
  }

  // ---------- simulation ----------
  // ----- lenses: where cost and latency go, and what each failure would cost -----
  // Spend per pool (with the share paid for idle GPUs), egress per link and training spend over seconds [s0, s1).
  function costBreakdown(R, s0, s1) {
    s0 = Math.max(0, Math.floor(s0)); s1 = Math.min(R.D, Math.ceil(s1));
    const out = { nodes: {}, total: 0, idle: 0, egress: 0, seconds: Math.max(0, s1 - s0), bySite: { onprem: 0, neo: 0 } };
    for (const p of R.pools) {
      let spend = 0, idle = 0, gpuS = 0, tok = 0;
      for (let s = s0; s < s1; s++) { const f = R.frames[s].pools[p.id]; if (!f) continue; spend += f.cost; gpuS += f.gpus; tok += f.tok; if (f.gpus > 0) idle += f.cost * Math.max(0, 1 - f.busyGpu / f.gpus); }
      out.nodes[p.id] = { kind: 'pool', spend, idle, gpuHours: gpuS / 3600, tokens: tok, perMTok: tok ? spend / (tok / 1e6) : NaN };
      out.total += spend; out.idle += idle; out.bySite[p.siteKind === 'neo' ? 'neo' : 'onprem'] += spend;
    }
    for (const L of R.links) {
      if (L.fabric) continue;
      let egr = 0, tegr = 0;
      for (let s = s0; s < s1; s++) { const f = R.frames[s].links[L.id]; if (f) { egr += f.egr || 0; tegr += f.tegr || 0; } }
      out.nodes[L.id] = { kind: 'link', spend: egr + tegr, egress: egr, trainEgress: tegr };
      out.total += egr + tegr; out.egress += egr + tegr;

    const T = R.spec.train;
    if (T && R.summary.train) {
      const spend = R.summary.train.gpuCostPerHr * out.seconds / 3600;
      out.nodes[T.id] = { kind: 'train', spend };
      out.total += spend;

  }
  // Where time to first token goes, node by node, for requests that arrived in [t0, t1).
  function latencyBreakdown(R, t0, t1) {
    const nodes = {}, add = (id, k, v) => { if (!id || !(v > 0)) return; const n = nodes[id] || (nodes[id] = { sec: 0, parts: {} }); n.sec += v; n.parts[k] = (n.parts[k] || 0) + v; };
    const src = {};
    let n = 0, total = 0, lo = 0, hi = R.reqs.length;
    while (lo < hi) { const m = (lo + hi) >> 1; if (R.reqs[m].t < t0) lo = m + 1; else hi = m; }
    for (let i = lo; i < R.reqs.length; i++) {
      const q = R.reqs[i];
      if (q.t >= t1) break;
      if (!isFinite(q.ttft)) continue;
      n++; total += q.ttft;
      const S = src[q.src] || (src[q.src] = { n: 0, sum: 0, miss: 0, list: [] });
      S.n++; S.sum += q.ttft; S.list.push(q.ttft); if (q.ttft > R.spec.slo.ttft) S.miss++;
      add(q.pPool, 'queue', q.bQueue); add(q.pPool, 'prefill', q.bPrefill);
      if (q.dPool && q.dPool !== q.pPool) { add(q.xLink, 'transfer', q.tXferEnd - q.tPrefEnd); add(q.inLink || q.xLink, 'network', q.net); add(q.dPool, 'decode wait', q.bDwait); add(q.dPool, 'thinking', q.bThink); }
      else { add(q.inLink, 'network', q.net); add(q.pPool, 'thinking', q.bThink); }
    }
    for (const id in nodes) { nodes[id].perReq = n ? nodes[id].sec / n : 0; nodes[id].share = total ? nodes[id].sec / total : 0; }
    for (const id in src) { const S = src[id]; S.list.sort((a, b) => a - b); nodes[id] = { kind: 'source', perReq: S.sum / S.n, p99: pct(S.list, 0.99), miss: S.miss / S.n, n: S.n, share: 0 }; delete S.list; }

      P.nodes++; P.gpusPerNode = Math.max(P.gpusPerNode, g); P.nodeNames.push(n.metadata.name);
      P.domainsSeen.set(domain, (P.domainsSeen.get(domain) || 0) + 1);
    }
    const pools = [...poolMap.values()].map(P => ({ id: P.id, name: P.name, gpu: P.gpu, gpusPerNode: P.gpusPerNode, nodes: P.nodes, domainNodes: Math.max(...P.domainsSeen.values()), site: opt.site || 'On-prem DC', product: P.product }));
    const nodePool = {}; for (const P of poolMap.values()) for (const nm of P.nodeNames) nodePool[nm] = P.id;
    // queues
    const queues = [];
    for (const cq of kind('ClusterQueue')) {
      let quota = 0;
      for (const rg of (cq.spec && cq.spec.resourceGroups) || []) for (const f of rg.flavors || []) for (const r of f.resources || []) if (/gpu/.test(r.name)) quota += +r.nominalQuota || 0;
      queues.push({ id: cq.metadata.name, name: cq.metadata.name, quota, priority: 0, team: (cq.metadata.labels && (cq.metadata.labels.team || cq.metadata.labels.owner)) || '' });
    }
    const lq = {}; for (const q of kind('LocalQueue')) lq[(q.metadata.namespace || '') + '/' + q.metadata.name] = q.spec && q.spec.clusterQueue;
    // workloads: group GPU pods by owner
    const wl = new Map();
    const prioOf = p => (p.spec && (p.spec.priority != null ? p.spec.priority : /high|critical|prod/i.test(p.spec.priorityClassName || '') ? 100 : /low|batch|preempt/i.test(p.spec.priorityClassName || '') ? -10 : 0));
    for (const p of kind('Pod')) {
      let g = 0;
      for (const c of (p.spec && p.spec.containers) || []) g += gpuOf((c.resources || {}).limits) || gpuOf((c.resources || {}).requests);
      if (!g) continue;
      const md = p.metadata || {}, L = md.labels || {}, ref = (md.ownerReferences || [])[0] || {};
      const jobName = L['jobset.sigs.k8s.io/jobset-name'] || L['training.kubeflow.org/job-name'] || L['batch.kubernetes.io/job-name'] || L['job-name'] || L['app.kubernetes.io/instance'] || L.app || (ref.name || md.name).replace(/-[a-z0-9]{8,10}(-[a-z0-9]{5})?$/, '');
      const key = (md.namespace || 'default') + '/' + jobName;
      const isTrain = !!(L['jobset.sigs.k8s.io/jobset-name'] || L['training.kubeflow.org/job-name'] || ref.kind === 'PyTorchJob' || ref.kind === 'JobSet' || /train|pretrain|finetune/i.test(jobName));
      const isInf = !isTrain && (ref.kind === 'ReplicaSet' || ref.kind === 'Deployment' || ref.kind === 'StatefulSet' || /serv|infer|vllm|triton/i.test(jobName));
      const q = L['kueue.x-k8s.io/queue-name'] ? (lq[(md.namespace || '') + '/' + L['kueue.x-k8s.io/queue-name']] || L['kueue.x-k8s.io/queue-name']) : '';
      if (!wl.has(key)) wl.set(key, { id: 'w' + wl.size, name: jobName, kind: isTrain ? 'training' : isInf ? 'inference' : 'batch', queue: q, gpusPerPod: g, pods: 0, priority: prioOf(p), pool: null, topology: isTrain ? 'domain' : 'any', durationH: isTrain ? 6 : 1, startH: 0, namespace: md.namespace || 'default', running: 0, pending: 0, created: md.creationTimestamp || '' });
      const W = wl.get(key);
      W.pods++; W.gpusPerPod = Math.max(W.gpusPerPod, g);
      if (p.status && p.status.phase === 'Running') W.running++; else if (p.status && p.status.phase === 'Pending') W.pending++;
      if (p.spec && p.spec.nodeName && nodePool[p.spec.nodeName] && !W.pool) W.poolSeen = nodePool[p.spec.nodeName];
    }
    const workloads = [...wl.values()].map(w => {
      const o = Object.assign({}, w);
      if (o.kind === 'batch') { o.ratePerH = Math.max(1, o.pods); o.pods = 1; }
      if (o.kind === 'inference') { o.minPods = Math.max(1, Math.round(o.pods / 2)); }
      delete o.poolSeen; return o;
    });
    if (!queues.length) {
      const total = pools.reduce((a, p) => a + p.nodes * p.gpusPerNode, 0);
      queues.push({ id: 'default', name: 'default', quota: total, priority: 0, team: '' });
    }
    const qset = new Set(queues.map(q => q.id));
    for (const w of workloads) if (!qset.has(w.queue)) w.queue = queues[0].id;
    const notes = [pools.length + ' GPU node pool' + (pools.length === 1 ? '' : 's') + ' (' + pools.reduce((a, p) => a + p.nodes, 0) + ' nodes, ' + pools.reduce((a, p) => a + p.nodes * p.gpusPerNode, 0) + ' GPUs)',
      workloads.length + ' GPU workloads from ' + workloads.reduce((a, w) => a + (w.kind === 'batch' ? w.ratePerH : w.pods), 0) + ' pods', queues.length + ' queue' + (queues.length === 1 ? '' : 's') + (kind('ClusterQueue').length ? ' from Kueue' : ' (none found; one queue holds everything)'),
      'Durations are not in the API: training jobs default to 6 h, batch jobs to 1 h. Edit them before trusting wait times.'];
    return { spec: { seed: 11, horizonH: 8, policy: Object.assign({}, POLICY_DEFAULTS), pools, queues, workloads }, notes };
  }
  function matchGpu(product) {
    const p = String(product).toUpperCase();
    for (const k of ['B200', 'H200', 'H100', 'MI300X', 'L40S', 'A100']) if (p.includes(k)) return k;
    return 'H100';
  }

  // A mixed cluster: on-prem H100s in two IB domains, a neocloud H200 pool, inference with a daily cycle,
  // a 256-GPU pre-training gang, fine-tunes, and a stream of one-GPU evaluation jobs.
  function sampleCluster() {
    return {
      seed: 11, horizonH: 8, policy: Object.assign({}, POLICY_DEFAULTS, { placement: 'spread' }),
      pools: [
        { id: 'h100', name: 'h100-onprem', gpu: 'H100', gpusPerNode: 8, nodes: 48, domainNodes: 24, site: 'On-prem DC', faultPerGpuDay: 0.03, repairH: 6 },
        { id: 'h200', name: 'h200-neocloud', gpu: 'H200', gpusPerNode: 8, nodes: 16, domainNodes: 16, site: 'Neocloud A', faultPerGpuDay: 0.01, repairH: 3 }
      ],
      queues: [
        { id: 'serving', name: 'serving', team: 'ML Platform', quota: 160, priority: 100 },
        { id: 'research', name: 'research', team: 'Foundation Models', quota: 288, priority: 10 },
        { id: 'eval', name: 'eval', team: 'Evaluation', quota: 64, priority: 0 }
      ],
      workloads: [
        { id: 'chat', name: 'chat-serving', kind: 'inference', queue: 'serving', gpusPerPod: 2, pods: 40, minPods: 16, peakH: 14, clockH: 9 },
        { id: 'agents', name: 'coding-agents-serving', kind: 'inference', queue: 'serving', gpusPerPod: 4, pods: 16, minPods: 8, peakH: 11, clockH: 9 },
        { id: 'pretrain', name: 'pretrain-70b', kind: 'training', queue: 'research', gpusPerPod: 8, pods: 20, topology: 'domain', startH: 0.5, durationH: 6, ckptMin: 45, restartMin: 12, pool: 'h100' },
        { id: 'ft1', name: 'finetune-coder', kind: 'training', queue: 'research', gpusPerPod: 8, pods: 4, topology: 'domain', startH: 1, durationH: 2, ckptMin: 20, restartMin: 5 },
        { id: 'ft2', name: 'finetune-safety', kind: 'training', queue: 'research', gpusPerPod: 8, pods: 2, topology: 'domain', startH: 2.5, durationH: 1.5, ckptMin: 20, restartMin: 5 },
        { id: 'evals', name: 'eval-jobs', kind: 'batch', queue: 'eval', gpusPerPod: 1, ratePerH: 40, durationH: 0.5 },
        { id: 'embed', name: 'embedding-backfill', kind: 'batch', queue: 'eval', gpusPerPod: 2, ratePerH: 6, durationH: 1.5, priority: -10 }
      ]
    };
  }

  const api = { STEP, POLICY_DEFAULTS, POLICY_VARIANTS, REASON, simulateCluster, inferenceReadiness, comparePoliciesIter, comparePolicies, fromKube, sampleCluster, normalizeCluster: normalize };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.FleetCluster = api;
})(typeof window !== 'undefined' ? window : this);

<script>
/* FleetScope cluster view: GPU allocation grid, scheduler policy what-ifs, workload timeline. Browser only. */
(function () {
  'use strict';
  const C = window.FleetCluster;
  const $ = (s, r) => (r || document).querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fInt = v => (isFinite(v) ? Math.round(v).toLocaleString('en-US') : '–');
  const fPct = v => (isFinite(v) ? Math.round(v * 100) + '%' : '–');
  const fGh = v => (isFinite(v) ? (v >= 10 ? fInt(v) : v.toFixed(1)) + ' GPU-h' : '–');
  const fMin = v => (!isFinite(v) ? '–' : v >= 90 ? (v / 60).toFixed(1) + ' h' : Math.round(v) + ' min');
  const hm = s => { const m = Math.floor(s / 60); return Math.floor(m / 60) + ':' + String(m % 60).padStart(2, '0'); };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  const WL_VARS = ['--onprem', '--neo', '--train', '--n-link', '--n-src', '--n-route'];
  const WL_EXTRA = ['#b8467a', '#7d8f1d', '#2f7fa8', '#a0522d'];
  const CS = { spec: C.sampleCluster(), run: null, k: 0, playing: false, speed: 4, baseline: null, sel: null, compare: null, job: null, notes: null, tpl: 'sample' };
  let colors = {};
  function readColors() {
    const st = getComputedStyle(document.documentElement), g = v => st.getPropertyValue(v).trim();
    colors = { wl: WL_VARS.map(g).concat(WL_EXTRA), free: g('--panel-2'), line: g('--line'), crit: g('--crit'), warn: g('--warn'), ink: g('--ink'), muted: g('--muted'), panel: g('--panel'), good: g('--good'), queue: g('--c-queue'), link: g('--n-link'), canvas: g('--canvas') };
  }
  const wlColor = i => colors.wl[i % colors.wl.length];
  const REASON_COLOR = () => ({ quota: colors.warn, capacity: colors.crit, fragmentation: colors.queue, topology: colors.link });

  // ---------- layout ----------
  const root = $('#clusterApp');
  root.innerHTML = `
  <header class="toolbar">
    <div class="tb"><select id="cTpl" aria-label="Cluster"><option value="sample">Sample: mixed GPU cluster (64 nodes, 512 GPUs)</option></select>
      <label class="btnlike" title="kubectl get nodes,pods,clusterqueues,localqueues -A -o json">Import kubectl JSON<input type="file" id="cFile" accept=".json" hidden></label></div>
    <div class="tb">
      <button type="button" id="cPlay" class="play">&#9654; Play</button>
      <select id="cSpeed" aria-label="Playback speed"><option value="1">1 tick</option><option value="4" selected>4 ticks</option><option value="16">16 ticks</option><option value="60">60 ticks</option></select>
      <span class="clock" id="cClock">0:00 / 8:00</span>
    </div>
    <div class="tb"><button type="button" id="cPin">Pin as baseline</button><button type="button" id="cClear" hidden>Clear baseline</button><button type="button" id="cCompare" title="Run this cluster under each scheduler policy">Compare policies</button></div>
    <div class="status" id="cStatus">Simulating…</div>
  </header>
  <aside class="palette cfg" id="cCfg"></aside>
  <section class="center">
    <div class="chead" id="cHead"></div>
    <div class="kpis" id="cKpis"></div>
    <section class="analysis" id="cAnalysis" hidden></section>
    <div class="gridWrap"><canvas id="cGrid" aria-label="GPU allocation grid: one square per GPU, grouped by node, IB domain and pool"></canvas><div class="gtip" id="cTip" hidden></div></div>
    <div class="glegend" id="cLegend"></div>
    <div class="timeline"><canvas id="cTime" aria-label="Allocation over time; click to jump"></canvas><input type="range" id="cScrub" min="0" max="2879" step="1" value="0" aria-label="Playhead"></div>
    <h3 class="sec cpad">Workloads over time <span class="sub" style="font-weight:400">running in the workload colour; pending coloured by why it waits; click to jump</span></h3>
    <canvas id="cGantt" aria-label="Workload states over time"></canvas>
  </section>
  <aside class="details" id="cSide" aria-live="polite"></aside>`;

  // ---------- config panel ----------
  const FIELDS = {
    pool: [['nodes', 'Nodes', 1, 512, 1], ['gpusPerNode', 'GPUs per node', 1, 16, 1], ['domainNodes', 'Nodes per IB domain', 1, 512, 1], ['faultPerGpuDay', 'Faults per GPU-day', 0, 1, 0.001], ['repairH', 'Repair time (h)', 0.1, 72, 0.1]],
    queue: [['quota', 'GPU quota', 0, 4096, 1], ['priority', 'Priority', -100, 1000, 1]],
    inference: [['minPods', 'Min replicas', 0, 512, 1], ['pods', 'Peak replicas', 1, 512, 1], ['gpusPerPod', 'GPUs per pod', 1, 16, 1], ['peakH', 'Peak hour of day', 0, 23, 1]],
    training: [['pods', 'Pods (gang size)', 1, 512, 1], ['gpusPerPod', 'GPUs per pod', 1, 16, 1], ['startH', 'Submitted at (h)', 0, 48, 0.25], ['durationH', 'Run time (h)', 0.1, 200, 0.1], ['ckptMin', 'Checkpoint every (min)', 0, 600, 1], ['restartMin', 'Restart / load (min)', 0, 120, 1]],
    batch: [['ratePerH', 'Jobs per hour', 0, 2000, 1], ['gpusPerPod', 'GPUs per job', 1, 16, 1], ['durationH', 'Median run time (h)', 0.05, 48, 0.05]]
  };
  function numInput(path, v, lo, hi, step) { return '<input type="number" data-path="' + path + '" value="' + (v == null ? '' : v) + '" min="' + lo + '" max="' + hi + '" step="' + step + '">'; }
  function renderCfg() {
    const s = CS.spec, P = Object.assign({}, C.POLICY_DEFAULTS, s.policy);
    const seg = (key, opts) => '<div class="seg" data-pol="' + key + '">' + opts.map(([v, l]) => '<button type="button" data-v="' + v + '" class="' + (P[key] === v ? 'on' : '') + '">' + l + '</button>').join('') + '</div>';
    const chk = (key, label, hint) => '<label class="chk" title="' + esc(hint) + '"><input type="checkbox" data-pol="' + key + '"' + (P[key] ? ' checked' : '') + '> ' + label + '</label>';
    let h = (CS.notes ? '<div class="note">' + CS.notes.map(esc).join('<br>') + '</div>' : '') +
      '<h3>Scheduler policy</h3><div class="ctl"><span class="lbl">Placement</span>' + seg('placement', [['binpack', 'Bin-pack'], ['spread', 'Spread']]) + '</div>' +
      chk('gang', 'Gang scheduling', 'Place all pods of a training job together, or none') + chk('topology', 'Topology-aware (one IB domain per job)', 'Training jobs that ask for it are placed within one InfiniBand domain') +
      chk('preemption', 'Preemption', 'Higher-priority work may evict lower-priority pods, and queues may reclaim borrowed quota') + chk('borrowing', 'Quota borrowing', 'A queue may use other queues’ unused quota') +
      '<div class="ctl"><span class="lbl">Queue order</span>' + seg('order', [['besteffort', 'Best-effort FIFO'], ['strict', 'Strict FIFO']]) + '</div>' +
      '<div class="ctl"><span class="lbl">Simulated hours</span>' + numInput('horizonH', s.horizonH, 1, 72, 1) + '</div>';
    h += '<h3>Node pools</h3>' + s.pools.map((p, i) => '<details class="card"><summary><b>' + esc(p.name) + '</b> <span>' + p.nodes + ' × ' + p.gpusPerNode + ' ' + esc(p.gpu) + '</span></summary>' + FIELDS.pool.map(([k, l, lo, hi, st]) => '<label class="frow"><span>' + l + '</span>' + numInput('pools.' + i + '.' + k, p[k], lo, hi, st) + '</label>').join('') + '</details>').join('');
    h += '<h3>Queues</h3>' + s.queues.map((q, i) => '<details class="card"><summary><b>' + esc(q.name) + '</b> <span>' + q.quota + ' GPUs' + (q.team ? ' · ' + esc(q.team) : '') + '</span></summary>' + FIELDS.queue.map(([k, l, lo, hi, st]) => '<label class="frow"><span>' + l + '</span>' + numInput('queues.' + i + '.' + k, q[k], lo, hi, st) + '</label>').join('') + '</details>').join('');
    h += '<h3>Workloads</h3>' + s.workloads.map((w, i) => '<details class="card"><summary><i class="sw" style="background:' + wlColor(i) + '"></i><b>' + esc(w.name) + '</b> <span>' + w.kind + ' · ' + esc(w.queue) + '</span></summary>' +
      FIELDS[w.kind].map(([k, l, lo, hi, st]) => '<label class="frow"><span>' + l + '</span>' + numInput('workloads.' + i + '.' + k, w[k], lo, hi, st) + '</label>').join('') +
      '<label class="frow"><span>Priority (blank: queue’s)</span>' + numInput('workloads.' + i + '.priority', w.priority, -1000, 1000, 1) + '</label>' +
      (w.kind === 'training' ? '<label class="frow"><span>Placement</span><select data-path="workloads.' + i + '.topology"><option value="domain"' + (w.topology === 'domain' ? ' selected' : '') + '>one IB domain</option><option value="any"' + (w.topology !== 'domain' ? ' selected' : '') + '>anywhere</option></select></label>' : '') +
      '</details>').join('');
    $('#cCfg').innerHTML = h;
  }
  function setPath(path, v) {
    const ks = path.split('.'); let o = CS.spec;
    for (let i = 0; i < ks.length - 1; i++) o = o[ks[i]];
    o[ks[ks.length - 1]] = v;
  }
  $('#cCfg').addEventListener('change', e => {
    const t = e.target;
    if (t.dataset.path) { setPath(t.dataset.path, t.tagName === 'SELECT' ? t.value : t.value === '' ? null : +t.value); schedule(); }
    else if (t.dataset.pol) { CS.spec.policy = Object.assign({}, CS.spec.policy, { [t.dataset.pol]: t.checked }); schedule(); }
  });
  $('#cCfg').addEventListener('click', e => {
    const b = e.target.closest('.seg button'); if (!b) return;
    const key = b.parentNode.dataset.pol;
    CS.spec.policy = Object.assign({}, CS.spec.policy, { [key]: b.dataset.v });
    for (const x of b.parentNode.children) x.classList.toggle('on', x === b);
    schedule();
  });
  let timer = 0;
  function schedule() { clearTimeout(timer); $('#cStatus').textContent = 'Re-simulating…'; timer = setTimeout(run, 250); }

  // ---------- run ----------
  function run() {
    const t0 = performance.now();
    try { CS.run = C.simulateCluster(CS.spec); } catch (err) { $('#cStatus').textContent = 'Simulation failed: ' + err.message; return; }
    const R = CS.run;
    CS.k = clamp(CS.k, 0, R.T - 1);
    $('#cScrub').max = R.T - 1;
    $('#cStatus').innerHTML = '<b>' + fInt(R.G) + '</b> GPUs on <b>' + R.nodes.length + '</b> nodes · <b>' + R.spec.horizonH + ' h</b> simulated in ' + Math.round(performance.now() - t0) + ' ms';
    layoutGrid(); drawTimeline(); drawGantt(); renderKpis(); renderHead(); renderLegend(); draw(); renderSide();
  }

  // ---------- KPIs and headline ----------
  function renderKpis() {
    const s = CS.run.summary, b = CS.baseline;
    const tile = (k, v, cls, cur, base, lower, fmt) => {
      let d = '', dc = '';
      if (b && isFinite(cur) && isFinite(base) && Math.abs(cur - base) > 1e-9) { d = (cur > base ? '▲ ' : '▼ ') + fmt(Math.abs(cur - base)); dc = (lower ? cur < base : cur > base) ? 'better' : 'worse'; }
      else if (b) d = '= baseline';
      return '<div class="kpi ' + (cls || '') + '"><div class="k" title="' + k + '">' + k + '</div><div class="v">' + v + '</div><div class="d ' + dc + '">' + d + '</div></div>';
    };
    const bs = b ? b.summary : {};
    $('#cKpis').innerHTML = [
      tile('GPU allocation', fPct(s.allocation), s.allocation > 0.8 ? 'good' : s.allocation > 0.5 ? 'warn' : 'crit', s.allocation, bs.allocation, false, v => Math.round(v * 100) + ' pt'),
      tile('Stranded GPU-hours', fGh(s.strandedGpuH), s.strandedGpuH > 50 ? 'crit' : '', s.strandedGpuH, bs.strandedGpuH, true, fGh),
      tile('Allocated but idle', fGh(s.idleAllocGpuH), s.idleAllocGpuH > 20 ? 'warn' : '', s.idleAllocGpuH, bs.idleAllocGpuH, true, fGh),
      tile('Training admitted', s.trainingAdmitted + ' / ' + s.trainingTotal, s.trainingAdmitted < s.trainingTotal ? 'crit' : 'good', s.trainingAdmitted, bs.trainingAdmitted, false, v => String(v)),
      tile('Mean training wait', fMin(s.trainingWaitMin), '', s.trainingWaitMin, bs.trainingWaitMin, true, fMin),
      tile('Batch job wait', fMin(s.batchWaitMin), '', s.batchWaitMin, bs.batchWaitMin, true, fMin),
      tile('Inference fully placed', fPct(s.inferenceFull), s.inferenceFull < 0.99 ? 'crit' : 'good', s.inferenceFull, bs.inferenceFull, false, v => Math.round(v * 100) + ' pt'),
      tile('Preemptions', fInt(s.preemptions), '', s.preemptions, bs.preemptions, true, fInt),
      tile('GPU faults (job restarts)', fInt(s.faults) + ' (' + fInt(s.restarts) + ')', s.faults ? 'warn' : '', s.faults, bs.faults, true, fInt),
      tile('Work lost to faults', fGh(s.lostGpuH), s.lostGpuH > 0 ? 'warn' : '', s.lostGpuH, bs.lostGpuH, true, fGh)
    ].join('');
  }
  function renderHead() {
    const R = CS.run, s = R.summary, W = R.workloads;
    const blocked = W.filter(w => w.kind === 'training' && !w.admittedOk && isFinite(w.submitted));
    const worst = W.filter(w => w.kind === 'training' && w.admittedOk).sort((a, b) => b.waitMin - a.waitMin)[0];
    let h;
    if (blocked.length) { const w = blocked[0]; h = '<b>' + esc(w.name) + '</b> (' + w.gpus + ' GPUs) never started: ' + esc(C.REASON[w.topReason] || 'it waited') + '. '; }
    else if (worst && worst.waitMin > 15) h = '<b>' + esc(worst.name) + '</b> waited <b>' + fMin(worst.waitMin) + '</b> to start, mostly because ' + esc(C.REASON[worst.topReason] || 'it waited') + '. ';
    else h = 'Every training job started within ' + fMin(worst ? worst.waitMin : 0) + '. ';
    if (s.strandedGpuH > 20) h += '<b>' + fGh(s.strandedGpuH) + '</b> sat free but stranded on part-used nodes while work waited. ';
    if (s.idleAllocGpuH > 10) h += '<b>' + fGh(s.idleAllocGpuH) + '</b> were held by training jobs that could not run (waiting for the rest of a gang, or restarting). ';
    if (s.faults) h += s.faults + ' GPU fault' + (s.faults > 1 ? 's' : '') + (s.lostGpuH > 0.5 ? ' cost ' + fGh(s.lostGpuH) + ' of training since checkpoints' : '') + '.';
    $('#cHead').innerHTML = h + (CS.baseline ? ' <span class="sub">Compared with <b>' + esc(CS.baseline.label) + '</b>.</span>' : '');
  }
  function renderLegend() {
    const R = CS.run, rc = REASON_COLOR();
    $('#cLegend').innerHTML = R.spec.workloads.map((w, i) => '<span><i style="background:' + wlColor(i) + '"></i>' + esc(w.name) + '</span>').join('') +
      '<span><i class="hatch"></i>held, not running</span><span><i style="background:' + colors.crit + '"></i>faulted</span><span><i class="empty"></i>free</span>' +
      '<span class="sep">pending:</span>' + Object.entries(rc).map(([k, c]) => '<span><i style="background:' + c + '"></i>' + k + '</span>').join('');
  }

  // ---------- GPU grid ----------
  const G = { tile: 8, gap: 1, nodeGap: 6, rows: [], pos: null, w: 0, h: 0 };
  function layoutGrid() {
    const R = CS.run, cv = $('#cGrid'), W = cv.parentNode.clientWidth - 16;
    const gpn = Math.max(...R.nodes.map(n => n.gpus));
    const cols = gpn <= 4 ? gpn : Math.ceil(gpn / 2), rowsPer = Math.ceil(gpn / cols);
    const nw = cols * (G.tile + G.gap) + G.nodeGap, nh = rowsPer * (G.tile + G.gap) + G.nodeGap;
    const perRow = Math.max(4, Math.floor((W - 110) / nw));
    const pos = new Array(R.G); let y = 6;
    G.labels = [];
    R.spec.pools.forEach((p, pi) => {
      const doms = R.domains.map((d, di) => ({ d, di })).filter(x => x.d.pool === pi);
      G.labels.push({ y: y + 10, text: p.name + ' · ' + p.gpu + ' · ' + p.site, bold: true });
      y += 18;
      for (const { d, di } of doms) {
        G.labels.push({ y: y + 10, text: 'IB domain ' + (doms.findIndex(x => x.di === di) + 1), x: 0 });
        d.nodes.forEach((ni, j) => {
          const n = R.nodes[ni], cx = 110 + (j % perRow) * nw, cy = y + Math.floor(j / perRow) * nh;
          for (let g = 0; g < n.gpus; g++) pos[n.base + g] = { x: cx + (g % cols) * (G.tile + G.gap), y: cy + Math.floor(g / cols) * (G.tile + G.gap), node: ni, idx: g };
          n.box = { x: cx - 2, y: cy - 2, w: cols * (G.tile + G.gap) + 3, h: rowsPer * (G.tile + G.gap) + 3 };
        });
        y += Math.ceil(d.nodes.length / perRow) * nh + 6;
      }
      y += 8;
    });
    G.pos = pos; G.w = W; G.h = y;
    const dpr = window.devicePixelRatio || 1;
    cv.width = W * dpr; cv.height = y * dpr; cv.style.width = W + 'px'; cv.style.height = y + 'px';
    cv.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function draw() {
    const R = CS.run; if (!R) return;
    const k = CS.k, fr = R.frames[k], cv = $('#cGrid'), ctx = cv.getContext('2d');
    ctx.clearRect(0, 0, G.w, G.h);
    ctx.font = '11px ' + getComputedStyle(document.body).fontFamily;
    for (const L of G.labels) { ctx.fillStyle = L.bold ? colors.ink : colors.muted; ctx.font = (L.bold ? '600 ' : '') + '11px ' + getComputedStyle(document.body).fontFamily; ctx.fillText(L.text, 0, L.y); }
    for (const n of R.nodes) { if (!n.box) continue; ctx.strokeStyle = CS.sel && CS.sel.node === R.nodes.indexOf(n) ? colors.ink : colors.line; ctx.lineWidth = 1; ctx.strokeRect(n.box.x + 0.5, n.box.y + 0.5, n.box.w, n.box.h); }
    for (let g = 0; g < R.G; g++) {
      const p = G.pos[g]; if (!p) continue;
      const o = fr.own[g], st = fr.st[g];
      if (st === 3) { ctx.fillStyle = colors.crit; ctx.fillRect(p.x, p.y, G.tile, G.tile); ctx.strokeStyle = colors.panel; ctx.beginPath(); ctx.moveTo(p.x + 1, p.y + 1); ctx.lineTo(p.x + G.tile - 1, p.y + G.tile - 1); ctx.stroke(); continue; }
      if (o < 0) { ctx.strokeStyle = colors.line; ctx.strokeRect(p.x + 0.5, p.y + 0.5, G.tile - 1, G.tile - 1); continue; }
      ctx.fillStyle = wlColor(o);
      ctx.globalAlpha = st === 2 ? 0.35 : 1;
      ctx.fillRect(p.x, p.y, G.tile, G.tile);
      ctx.globalAlpha = 1;
      if (st === 2) { ctx.strokeStyle = wlColor(o); ctx.beginPath(); ctx.moveTo(p.x, p.y + G.tile); ctx.lineTo(p.x + G.tile, p.y); ctx.stroke(); }
    }
    $('#cClock').textContent = hm(k * R.step) + ' / ' + hm(R.T * R.step);
    const sc = $('#cScrub'); if (document.activeElement !== sc) sc.value = k;
    drawPlayheads();
  }
  $('#cGrid').addEventListener('mousemove', e => {
    const R = CS.run; if (!R) return;
    const b = e.target.getBoundingClientRect(), x = e.clientX - b.left, y = e.clientY - b.top;
    let hit = -1;
    for (let g = 0; g < R.G; g++) { const p = G.pos[g]; if (p && x >= p.x && x < p.x + G.tile + 1 && y >= p.y && y < p.y + G.tile + 1) { hit = g; break; } }
    const tip = $('#cTip');
    if (hit < 0) { tip.hidden = true; return; }
    const p = G.pos[hit], n = R.nodes[p.node], fr = R.frames[CS.k], o = fr.own[hit], st = fr.st[hit];
    const fx = R.gpuFaults.find(x => x.gpu === hit);
    tip.innerHTML = '<b>' + esc(n.name) + '</b> GPU ' + p.idx + '<br>' + (st === 3 ? '<span style="color:var(--crit)">faulted, under repair</span>' : o < 0 ? 'free' : esc(R.spec.workloads[o].name) + (st === 2 ? ' (held, not running)' : '')) + (fx ? '<br>' + fx.faults + ' fault' + (fx.faults > 1 ? 's' : '') + ' this run' : '');
    tip.style.left = (x + 14) + 'px'; tip.style.top = (y + 10) + 'px'; tip.hidden = false;
  });
  $('#cGrid').addEventListener('mouseleave', () => { $('#cTip').hidden = true; });
  $('#cGrid').addEventListener('click', e => {
    const R = CS.run; if (!R) return;
    const b = e.target.getBoundingClientRect(), x = e.clientX - b.left, y = e.clientY - b.top;
    const ni = R.nodes.findIndex(n => n.box && x >= n.box.x && x <= n.box.x + n.box.w && y >= n.box.y && y <= n.box.y + n.box.h);
    CS.sel = ni >= 0 ? { node: ni } : null; draw(); renderSide();
  });

  // ---------- timeline and Gantt ----------
  const TL = { h: 120, l: 44, r: 8 };
  function sizeCanvas(cv, h) { const W = cv.parentNode.clientWidth - 16, dpr = window.devicePixelRatio || 1; cv.width = W * dpr; cv.height = h * dpr; cv.style.width = W + 'px'; cv.style.height = h + 'px'; const ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); return { ctx, W }; }
  let tlImg = null, gtImg = null;
  function drawTimeline() {
    const R = CS.run, S = R.series, cv = $('#cTime'), { ctx, W } = sizeCanvas(cv, TL.h), H = TL.h - 16;
    const X = k => TL.l + (W - TL.l - TL.r) * k / (R.T - 1), Y = v => 4 + H * (1 - v / R.G);
    ctx.clearRect(0, 0, W, TL.h);
    const band = (lo, hi, col, alpha) => { ctx.beginPath(); for (let k = 0; k < R.T; k++) ctx.lineTo(X(k), Y(hi(k))); for (let k = R.T - 1; k >= 0; k--) ctx.lineTo(X(k), Y(lo(k))); ctx.closePath(); ctx.globalAlpha = alpha; ctx.fillStyle = col; ctx.fill(); ctx.globalAlpha = 1; };
    const busy = k => S.alloc[k] - S.idleAlloc[k];
    band(() => 0, busy, colors.wl[0], 0.75);
    band(busy, k => S.alloc[k], colors.warn, 0.6);
    band(k => S.alloc[k], k => S.alloc[k] + S.stranded[k], colors.queue, 0.6);
    band(k => R.G - S.faulted[k], () => R.G, colors.crit, 0.8);
    // pending demand line
    ctx.beginPath(); for (let k = 0; k < R.T; k++) { const v = S.pendQuota[k] + S.pendCapacity[k] + S.pendFragmentation[k] + S.pendTopology[k]; ctx.lineTo(X(k), Y(Math.min(R.G, S.alloc[k] + v))); }
    ctx.strokeStyle = colors.ink; ctx.setLineDash([3, 3]); ctx.lineWidth = 1; ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = colors.muted; ctx.font = '10px ' + getComputedStyle(document.body).fontFamily;
    ctx.fillText(R.G + ' GPUs', 0, 12); ctx.fillText('0', 0, 4 + H);
    for (let h = 0; h <= R.spec.horizonH; h += Math.max(1, Math.round(R.spec.horizonH / 8))) ctx.fillText(h + 'h', X(h * 3600 / R.step) - 6, TL.h - 2);
    tlImg = ctx.getImageData(0, 0, cv.width, cv.height);
    $('#cTimeLegend') || cv.insertAdjacentHTML('beforebegin', '<div class="glegend" id="cTimeLegend"></div>');
    $('#cTimeLegend').innerHTML = '<span><i style="background:' + colors.wl[0] + '"></i>busy</span><span><i style="background:' + colors.warn + '"></i>allocated, idle</span><span><i style="background:' + colors.queue + '"></i>stranded free</span><span><i style="background:' + colors.crit + '"></i>faulted</span><span><i class="dash"></i>allocated + pending demand</span>';
  }
  const GT = { row: 16, l: 150 };
  function drawGantt() {
    const R = CS.run, cv = $('#cGantt'), n = R.spec.workloads.length, h = n * GT.row + 18, { ctx, W } = sizeCanvas(cv, h);
    const rc = REASON_COLOR(), X = k => GT.l + (W - GT.l - TL.r) * k / (R.T - 1), dx = (W - GT.l - TL.r) / (R.T - 1) + 0.6;
    ctx.clearRect(0, 0, W, h);
    const font = getComputedStyle(document.body).fontFamily;
    R.spec.workloads.forEach((w, i) => {
      const y = i * GT.row + 2, st = R.wlState[i];
      ctx.fillStyle = colors.ink; ctx.font = '11px ' + font; ctx.fillText(w.name.length > 22 ? w.name.slice(0, 21) + '…' : w.name, 0, y + 11);
      for (let k = 0; k < R.T; k++) {
        const s = st[k]; if (!s) continue;
        // running: full-height bar in the workload colour; pending or partly placed: a thin bar coloured by the reason
        if (s === 2) { ctx.fillStyle = wlColor(i); ctx.fillRect(X(k), y + 2, dx, GT.row - 5); }
        else if (s === 3) { ctx.fillStyle = colors.line; ctx.fillRect(X(k), y + 6, dx, GT.row - 13); }
        else { ctx.fillStyle = s === 4 ? colors.warn : rc[R.frames[k].reasons[i]] || colors.muted; ctx.fillRect(X(k), y + 5, dx, GT.row - 11); }
      }
    });
    for (const e of R.events) if (e.kind === 'fault' || e.kind === 'preempt' || e.kind === 'restart') { const y = e.wl * GT.row + 2; ctx.fillStyle = e.kind === 'preempt' ? colors.ink : colors.crit; ctx.fillRect(X(e.t / R.step) - 1, y, 2, GT.row - 2); }
    gtImg = ctx.getImageData(0, 0, cv.width, cv.height);
  }
  function drawPlayheads() {
    const R = CS.run;
    for (const [id, img, l] of [['#cTime', tlImg, TL.l], ['#cGantt', gtImg, GT.l]]) {
      if (!img) continue;
      const cv = $(id), ctx = cv.getContext('2d'), dpr = window.devicePixelRatio || 1, W = cv.width / dpr;
      ctx.putImageData(img, 0, 0);
      const x = l + (W - l - TL.r) * CS.k / (R.T - 1);
      ctx.strokeStyle = colors.ink; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, cv.height / dpr); ctx.stroke();
    }
  }
  for (const [id, l] of [['#cTime', TL.l], ['#cGantt', GT.l]]) $(id).addEventListener('click', e => {
    const R = CS.run, b = e.target.getBoundingClientRect(), x = e.clientX - b.left;
    seek(Math.round((x - l) / (b.width - l - TL.r) * (R.T - 1)));
  });
  $('#cScrub').addEventListener('input', e => seek(+e.target.value));
  function seek(k) { CS.k = clamp(k, 0, CS.run.T - 1); draw(); renderSideLive(); }

  // ---------- side panel ----------
  function renderSide() {
    const R = CS.run;
    let h = '<div id="cLive"></div>';
    h += '<h3 class="sec">Workloads</h3><table class="atable"><thead><tr><th>Workload</th><th>Waited</th><th>Goodput</th></tr></thead><tbody>' +
      R.workloads.map((w, i) => '<tr><td><i class="sw" style="background:' + wlColor(i) + '"></i><b>' + esc(w.name) + '</b><br><span class="sub">' +
        [w.kind + (w.kind === 'batch' ? ', ' + w.jobs.submitted + ' jobs' : ', ' + fInt(w.gpus) + ' GPUs'), w.kind === 'training' ? (w.admittedOk ? fPct(w.progress) + ' done' : 'never started') : '', w.topReason ? 'waited on ' + w.topReason : '', w.preempts ? w.preempts + ' preempted' : '', w.faults ? w.faults + ' faults' + (w.restarts ? ', ' + w.restarts + ' restarts' : '') : ''].filter(Boolean).join(' · ') +
        '</span></td><td class="num">' + fMin(w.waitMin) + '</td><td class="num">' + fPct(w.goodput) + '</td></tr>').join('') + '</tbody></table>';
    if (R.nodeFaults.length) h += '<h3 class="sec">Most-faulting nodes</h3>' + R.nodeFaults.slice(0, 5).map(n => '<div class="row"><span>' + esc(n.name) + '</span><span>' + n.faults + '</span></div>').join('') +
      '<h3 class="sec">Most-faulting GPUs</h3>' + R.gpuFaults.slice(0, 5).map(g => '<div class="row"><span>' + esc(g.node) + ' GPU ' + g.index + '</span><span>' + g.faults + '</span></div>').join('');
    $('#cSide').innerHTML = h;
    renderSideLive();
  }
  function renderSideLive() {
    const R = CS.run, k = CS.k, fr = R.frames[k], box = $('#cLive'); if (!box) return;
    const pend = R.spec.workloads.map((w, i) => ({ w, i, r: fr.reasons[i] })).filter(x => x.r);
    let h = '<h2>At ' + hm(k * R.step) + '</h2><div class="sub">' + fInt(R.series.alloc[k]) + ' of ' + R.G + ' GPUs allocated · ' + fInt(R.series.free[k]) + ' free · ' + fInt(R.series.faulted[k]) + ' faulted' + (R.series.stranded[k] ? ' · ' + fInt(R.series.stranded[k]) + ' stranded' : '') + '</div>';
    h += '<h3 class="sec">Pending</h3>' + (pend.length ? pend.map(x => '<div class="row"><span><i class="sw" style="background:' + wlColor(x.i) + '"></i>' + esc(x.w.name) + '</span><span>' + esc(C.REASON[x.r] || x.r) + '</span></div>').join('') : '<div class="sub">Nothing waiting.</div>');
    if (CS.sel && CS.sel.node != null) {
      const n = R.nodes[CS.sel.node], counts = {};
      for (let g = n.base; g < n.base + n.gpus; g++) { const o = fr.own[g], key = fr.st[g] === 3 ? 'faulted' : o < 0 ? 'free' : R.spec.workloads[o].name + (fr.st[g] === 2 ? ' (idle)' : ''); counts[key] = (counts[key] || 0) + 1; }
      h += '<h3 class="sec">Node ' + esc(n.name) + '</h3>' + Object.entries(counts).map(([k2, v]) => '<div class="row"><span>' + esc(k2) + '</span><span>' + v + ' GPU' + (v > 1 ? 's' : '') + '</span></div>').join('') + '<div class="sub">' + n.faults + ' fault' + (n.faults === 1 ? '' : 's') + ' this run · IB domain ' + (n.domain + 1) + '</div>';
    }
    const near = [];
    for (const e of R.events) {
      if (Math.abs(e.t / R.step - k) > 60) continue;
      const lastE = near[near.length - 1];
      if (lastE && lastE.t === e.t && lastE.wl === e.wl && lastE.detail === e.detail) lastE.n++; else near.push(Object.assign({ n: 1 }, e));
    }
    if (near.length) h += '<h3 class="sec">Events around now</h3>' + near.slice(-6).map(e => '<div class="row"><span>' + hm(e.t) + ' ' + esc(R.spec.workloads[e.wl].name) + '</span><span>' + esc(e.detail) + (e.n > 1 ? ' ×' + e.n : '') + '</span></div>').join('');
    box.innerHTML = h;
  }

  // ---------- compare policies ----------
  function compare() {
    if (CS.job) CS.job.cancel = true;
    const job = { cancel: false }, it = C.comparePoliciesIter(CS.spec);
    CS.job = job;
    const box = $('#cAnalysis'); box.hidden = false;
    const step = () => {
      if (job.cancel) return;
      const x = it.next();
      if (!x.done) { box.innerHTML = '<h3>Comparing scheduler policies</h3><div class="progress"><i style="width:' + (100 * x.value.done / x.value.total) + '%"></i></div><div class="sub">' + esc(x.value.text) + '</div>'; setTimeout(step, 0); return; }

  function renderCompare() {
    const rows = CS.compare, box = $('#cAnalysis'), base = rows[0];

    const tw = r => r.workloads.filter(w => w.kind === 'training');
    box.innerHTML = '<h3>Scheduler policies on this cluster <button class="linkbtn" type="button" data-act="close">Close</button></h3>' +
      '<p class="lead">As configured: <b>' + fPct(base.summary.allocation) + '</b> allocation, ' + base.summary.trainingAdmitted + ' of ' + base.summary.trainingTotal + ' training jobs started. ' + (best !== base ? 'Best: <b>' + esc(best.name) + '</b>, with ' + fPct(best.summary.allocation) + ' allocation and ' + best.summary.trainingAdmitted + ' of ' + best.summary.trainingTotal + ' started.' : 'No single change does better.') + ' Click a row to apply it.</p>' +
      '<div class="ascroll"><table class="atable"><thead><tr><th>Policy</th><th>Allocation</th><th>Stranded</th><th>Allocated, idle</th><th>Training started</th><th>Mean training wait</th><th>Batch wait</th><th>Inference placed</th><th>Preemptions</th><th>Work lost</th></tr></thead><tbody>' +
      rows.map((r, i) => { const s = r.summary; return '<tr class="click' + (r === best ? ' pick' : '') + '" data-pol="' + i + '"><td><b>' + esc(r.name) + '</b></td><td class="num">' + fPct(s.allocation) + '</td><td class="num">' + fGh(s.strandedGpuH) + '</td><td class="num">' + fGh(s.idleAllocGpuH) + '</td><td class="num">' + s.trainingAdmitted + ' / ' + s.trainingTotal + '</td><td class="num">' + fMin(s.trainingWaitMin) + '</td><td class="num">' + fMin(s.batchWaitMin) + '</td><td class="num">' + fPct(s.inferenceFull) + '</td><td class="num">' + fInt(s.preemptions) + '</td><td class="num">' + fGh(s.lostGpuH) + '</td></tr>'; }).join('') + '</tbody></table></div>' +
      '<div class="sub">Each row changes one thing from the configured policy. Training waits count jobs that never started up to the end of the run.</div>';
    void tw;
  }
  $('#cAnalysis').addEventListener('click', e => {
    if (e.target.closest('[data-act="close"]')) { $('#cAnalysis').hidden = true; return; }
    const tr = e.target.closest('[data-pol]'); if (!tr) return;
    const r = CS.compare[+tr.dataset.pol];
    if (!CS.baseline) CS.baseline = { label: 'policy as configured', summary: CS.run.summary };
    $('#cClear').hidden = false;
    CS.spec.policy = Object.assign({}, r.policy); renderCfg(); run();
  });

  // ---------- toolbar ----------
  let raf = 0, last = 0;
  function tick(ts) {
    if (!CS.playing) return;
    if (ts - last > 33) { last = ts; CS.k += CS.speed; if (CS.k >= CS.run.T - 1) { CS.k = CS.run.T - 1; setPlaying(false); } draw(); renderSideLive(); }
    raf = requestAnimationFrame(tick);
  }
  function setPlaying(on) { CS.playing = on; $('#cPlay').innerHTML = on ? '&#10074;&#10074; Pause' : '&#9654; Play'; if (on) { if (CS.k >= CS.run.T - 1) CS.k = 0; raf = requestAnimationFrame(tick); } else cancelAnimationFrame(raf); }
  $('#cPlay').addEventListener('click', () => setPlaying(!CS.playing));
  $('#cSpeed').addEventListener('change', e => { CS.speed = +e.target.value; });
  $('#cPin').addEventListener('click', () => { CS.baseline = { label: 'pinned baseline', summary: CS.run.summary }; $('#cClear').hidden = false; renderKpis(); renderHead(); });
  $('#cClear').addEventListener('click', () => { CS.baseline = null; $('#cClear').hidden = true; renderKpis(); renderHead(); });
  $('#cCompare').addEventListener('click', compare);
  $('#cTpl').addEventListener('change', e => { if (e.target.value === 'sample') { CS.spec = C.sampleCluster(); CS.notes = null; } else if (CS.imported) { CS.spec = JSON.parse(JSON.stringify(CS.imported.spec)); CS.notes = CS.imported.notes; } CS.baseline = null; renderCfg(); run(); });
  $('#cFile').addEventListener('change', e => {
    const f = e.target.files[0]; if (!f) return;
    f.text().then(txt => {
      try { CS.imported = C.fromKube(txt); } catch (err) { $('#cStatus').textContent = 'Could not read ' + f.name + ': ' + err.message; return; }
      const sel = $('#cTpl');
      if (!sel.querySelector('[value="imported"]')) sel.insertAdjacentHTML('beforeend', '<option value="imported"></option>');
      sel.querySelector('[value="imported"]').textContent = 'Imported: ' + f.name;
      sel.value = 'imported'; sel.dispatchEvent(new Event('change'));
    });
  });
  window.addEventListener('resize', () => { if (CS.run && !root.hidden) { layoutGrid(); drawTimeline(); drawGantt(); draw(); } });

  let started = false;
  window.FleetClusterView = {
    show() { root.hidden = false; readColors(); if (!started) { started = true; renderCfg(); run(); } else { layoutGrid(); drawTimeline(); drawGantt(); draw(); } },
    hide() { root.hidden = true; setPlaying(false); },
    state: CS
  };
})();

<script>
/* FleetScope training model: one training job, step by step, with data loading, compute, gradient sync,
   checkpoints, stragglers, GPU faults and restarts. Deterministic for a given spec and seed. */
(function (root) {
  'use strict';
  const E = (typeof module !== 'undefined' && module.exports) ? require('./engine.js') : root.FleetEngine;

  const DEFAULTS = {
    seed: 3, horizonH: 12, model: 'llama-70b', gpu: 'H100', gpus: 160, gpusPerNode: 8, tp: 8, pp: 1, microbatches: 8,
    batchMTokens: 4, kernelEff: 0.55, overlap: 0.7, ibGbpsPerGpu: 400, nvlinkGBs: 450,
    storageGBs: 40, remoteGBs: 1, cacheHit: 0.2, workersPerGpu: 8, prefetch: true,
    mixes: [
      { name: 'Text, pre-tokenized', tokensPerSample: 4096, bytesPerToken: 2, remoteShare: 0, samplesPerWorkerS: 400 },
      { name: 'Video + images, 70% in a cloud bucket', tokensPerSample: 2000, bytesPerToken: 600, remoteShare: 0.7, samplesPerWorkerS: 0.06 }
    ],
    switchMixAtH: 4,
    ckptMin: 45, ckptGBs: 20, asyncCkpt: false, restartMin: 12, faultPerGpuDay: 0.03, repairH: 4, spares: 1,
    stragglerShare: 0.01, stragglerSlow: 0.12, queueWaitS: 0, faultLog: null
  };
  const PHASES = ['queue', 'data', 'compute', 'straggler', 'sync', 'optimizer', 'checkpoint', 'restart', 'lost'];
  const PHASE_LABEL = { queue: 'waiting to be scheduled', data: 'waiting on data loading', compute: 'computing', straggler: 'waiting on slow GPUs', sync: 'waiting on gradient sync', optimizer: 'optimizer step', checkpoint: 'writing checkpoints', restart: 'restarting after faults', lost: 'redoing work lost to faults' };

  function norm(spec) {
    const s = Object.assign({}, DEFAULTS, JSON.parse(JSON.stringify(spec || {})));
    s.mixes = (s.mixes && s.mixes.length ? s.mixes : DEFAULTS.mixes).map(m => Object.assign({ tokensPerSample: 4096, bytesPerToken: 2, remoteShare: 0, samplesPerWorkerS: 400, name: 'mix' }, m));
    s.tp = Math.max(1, Math.min(s.tp, s.gpusPerNode));
    s.pp = Math.max(1, s.pp);
    return s;
  }

  // Per-step phase durations for the job on a given data mix (seconds), before stragglers.
  function stepModel(s, mix) {
    const M = E.MODELS[s.model] || E.MODELS['llama-70b'], G = E.GPUS[s.gpu] || E.GPUS.H100;
    const N = s.gpus, tokens = s.batchMTokens * 1e6, dp = Math.max(1, Math.floor(N / (s.tp * s.pp)));
    const compute = 6 * M.active * 1e9 * tokens / (N * G.bf16 * 1e12 * s.kernelEff);
    const tpOver = s.tp > 1 ? compute * 0.06 * Math.log2(s.tp) : 0;
    const bubble = s.pp > 1 ? compute * (s.pp - 1) / (s.microbatches + s.pp - 1) : 0;
    const gradBytes = 2 * M.params * 1e9 / (s.tp * s.pp);
    const multiNode = N > s.gpusPerNode;
    const bw = (multiNode ? s.ibGbpsPerGpu / 8 : s.nvlinkGBs) * 1e9;
    const comm = dp > 1 ? 2 * (dp - 1) / dp * gradBytes / bw : 0;
    const sync = comm * (1 - s.overlap);
    const optimizer = 16 * M.params * 1e9 / N / (G.bw * 1e12 * 0.5);
    const bytes = tokens * mix.bytesPerToken, miss = 1 - s.cacheHit;
    const io = bytes * miss * (1 - mix.remoteShare) / (s.storageGBs * 1e9) + bytes * miss * mix.remoteShare / (s.remoteGBs * 1e9);
    const cpu = tokens / mix.tokensPerSample / (N * s.workersPerGpu * mix.samplesPerWorkerS);
    const dataRaw = Math.max(io, cpu);
    const busy = compute + tpOver + bubble;
    const data = s.prefetch ? Math.max(0, dataRaw - busy) : dataRaw;
    const ckptBytes = 14 * M.params * 1e9;
    const ckptWrite = ckptBytes / (s.ckptGBs * 1e9);
    const minGpus = Math.ceil(16 * M.params * 1e9 / (0.75 * G.hbm * 1e9));
    return { compute, tpOver, bubble, busy, comm, sync, optimizer, dataRaw, io, cpu, data, dataBound: cpu >= io ? 'cpu' : 'io', bytes, tokens, dp, ckptWrite, ckptBytes, minGpus, multiNode, flops: 6 * M.active * 1e9 * tokens };
  }

  // Parses a GPU fault log: CSV or JSON lines with a node/host, a GPU index and optionally a time and Xid.
  function parseFaultLog(text) {
    const out = [];
    const lines = String(text).split(/\r?\n/).filter(l => l.trim());
    let header = null;
    for (const line of lines) {
      let o = null;
      if (line.trim().startsWith('{')) { try { o = JSON.parse(line); } catch (e) { continue; } }
      else if (!header && /(^|,)\s*(node|hostname|host|instance)\s*(,|$)/i.test(line)) { header = line.split(',').map(x => x.trim().toLowerCase()); continue; }
      else if (header) { const v = line.split(','); o = {}; header.forEach((h, i) => { o[h] = (v[i] || '').trim(); }); }
      else {

        const m = line.match(/^(\S+\s+\S+\s+\S+\s+)?(\S+).*Xid.*?\(PCI:([0-9a-f:.]+)\):\s*(\d+)/i);
        if (m) out.push({ node: m[2], gpu: m[3], xid: +m[4], t: null });
        continue;
      }
      if (!o) continue;
      const node = o.node || o.hostname || o.host || o.Hostname || o.instance;
      const gpu = o.gpu != null ? o.gpu : o.gpu_index != null ? o.gpu_index : o.index != null ? o.index : o.device;

  function simulateTraining(specIn) {

      const compute = (m.compute + m.tpOver + m.bubble) * jitter;

      const total = m.data + compute + strag + m.sync + m.optimizer;
      // a fault during this step?

        per.restart += t1 - tf;
        for (let g = 0; g < N; g++) gpuS.restart[g] += t1 - tf;

      }

      for (let g = 0; g < N; g++) { gpuS.compute[g] += compute * slow[g]; gpuS.straggler[g] += compute * (maxSlow - slow[g]); gpuS.data[g] += m.data; gpuS.sync[g] += m.sync; gpuS.optimizer[g] += m.optimizer; }

      if (s.ckptMin > 0 && t - lastCkpt >= s.ckptMin * 60) {

        segs.push({ t0: t, t1, kind: 'checkpoint' });

        for (let g = 0; g < N; g++) gpuS.checkpoint[g] += t1 - t;
        t = t1; lastCkpt = t; ckptTokens = tokens; stepsSinceCkpt = [];
      }
    }
    // steps lost were counted in both their phases and `lost`; move them to `lost` only
    for (const st of steps) if (st.lost) { per.data -= st.data; per.compute -= st.compute; per.straggler -= st.straggler; per.sync -= st.sync; per.optimizer -= st.optimizer; }
    const wall = Math.min(H, Math.max(t, steps.length ? steps[steps.length - 1].t + steps[steps.length - 1].total : t));
    const kept = steps.filter(x => !x.lost);

    const G = E.GPUS[s.gpu] || E.GPUS.H100;
    const usefulFlops = kept.length ? keptTokens * 6 * (E.MODELS[s.model] || E.MODELS['llama-70b']).active * 1e9 : 0;
    const shares = {}; for (const p of PHASES) shares[p] = wall ? Math.max(0, per[p]) / wall : 0;
    const losses = PHASES.filter(p => p !== 'compute' && p !== 'optimizer').map(p => [p, shares[p]]).sort((a, b) => b[1] - a[1]);
    const byMix = s.mixes.map((mx, i) => {
      const ss = steps.filter(x => x.mix === i);
      const avg = k => (ss.length ? ss.reduce((a, x) => a + x[k], 0) / ss.length : NaN);
      return { name: mx.name, steps: ss.length, stepS: avg('total'), dataS: avg('data'), computeS: avg('compute'), syncS: avg('sync'), stragglerS: avg('straggler'), model: models[i] };
    });
    const nodeFaults = {}; for (const f of faults) if (f.lostS != null) nodeFaults[f.node] = (nodeFaults[f.node] || 0) + 1;
    const gpuFaultN = new Uint16Array(N); for (const f of faults) if (f.lostS != null) gpuFaultN[f.gpu]++;

      goodput: shares.compute + shares.optimizer, mfu: wall ? usefulFlops / (wall * N * G.bf16 * 1e12) : 0,
      faults: faults.filter(f => f.lostS != null).length, lostH: per.lost / 3600, restartH: per.restart / 3600,
      dataGBs: steps.length ? steps.reduce((a, x) => a + x.bytes, 0) / steps.reduce((a, x) => a + x.total, 0) / 1e9 : 0,
      bottleneck: losses[0] && losses[0][1] > 0.02 ? { phase: losses[0][0], share: losses[0][1], label: PHASE_LABEL[losses[0][0]] } : null,
