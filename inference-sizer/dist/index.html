<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inference Sizer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: sticky input rail on the left, results read top-down on the right: verdict → topology → SLO check → charts → detail. */
:root {
  --bg: #eef1f0; --surface: #fbfcfc; --sunk: #e4e9e8; --ink: #142321; --muted: #566664; --line: #d3dbd9;
  --accent: #0e6a70; --accent-ink: #ffffff;
  --prefill: #c4581b; --decode: #0e6a70; --agg: #4b5fa8; --spare: #9aa7a5;
  --good: #1f7a3a; --warn: #a86200; --bad: #b3261e;
  --f-display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1615; --surface: #15201f; --sunk: #1b2928; --ink: #e3ebe9; --muted: #93a3a0; --line: #283634;
    --accent: #4fbfc5; --accent-ink: #062022;
    --prefill: #f08a50; --decode: #4fbfc5; --agg: #8ea2ef; --spare: #5d6b69;
    --good: #5cc27a; --warn: #e0a040; --bad: #f0786e; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1615; --surface: #15201f; --sunk: #1b2928; --ink: #e3ebe9; --muted: #93a3a0; --line: #283634;
  --accent: #4fbfc5; --accent-ink: #062022;
  --prefill: #f08a50; --decode: #4fbfc5; --agg: #8ea2ef; --spare: #5d6b69;
  --good: #5cc27a; --warn: #e0a040; --bad: #f0786e; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--f-body); }
h1, h2, h3 { font-family: var(--f-display); font-weight: 600; text-wrap: balance; margin: 0; letter-spacing: 0.01em; }
h1 { font-size: 26px; }
h2 { font-size: 18px; }
h3 { font-size: 14px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.num, td.n, .mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
a { color: var(--accent); }

header.top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px; padding: 18px 24px 14px; border-bottom: 1px solid var(--line); background: var(--surface); }
header.top p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.spec { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }

.layout { display: grid; grid-template-columns: 360px minmax(0, 1fr); gap: 0; }
aside.inputs { border-right: 1px solid var(--line); background: var(--surface); padding: 16px 18px 40px; position: sticky; top: 0; align-self: start; max-height: 100vh; overflow-y: auto; }
main.results { padding: 20px 24px 60px; display: flex; flex-direction: column; gap: 20px; min-width: 0; }
@media (max-width: 900px) {
  .layout { grid-template-columns: 1fr; }
  aside.inputs { position: static; max-height: none; border-right: 0; border-bottom: 1px solid var(--line); }
  main.results { padding: 16px; }
  header.top { padding: 14px 16px; }
}

fieldset { border: 0; padding: 0; margin: 0 0 18px; }
legend { font-family: var(--f-display); font-weight: 600; font-size: 15px; padding: 0; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
legend .idx { font-family: var(--f-mono); font-size: 11px; color: var(--muted); font-weight: 400; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }
.field { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.field.wide { grid-column: 1 / -1; }
.field label { font-size: 12px; color: var(--muted); }
.field .hint { font-size: 11.5px; color: var(--muted); }
.field .hint.warn { color: var(--warn); }
input[type=number], select { width: 100%; font: 500 13.5px var(--f-mono); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
select { font-family: var(--f-body); }
input:focus-visible, select:focus-visible, button:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.unitwrap { position: relative; }
.unitwrap .u { position: absolute; right: 9px; top: 50%; transform: translateY(-50%); font-size: 11px; color: var(--muted); pointer-events: none; }
.unitwrap input { padding-right: 46px; }
.chk { flex-direction: row; align-items: center; gap: 8px; }
.chk label { color: var(--ink); font-size: 13px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
.chip { font: 500 11.5px var(--f-mono); border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 2px 9px; cursor: pointer; }
.chip:hover { border-color: var(--accent); color: var(--accent); }
.chip.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
details.sub { border: 1px solid var(--line); border-radius: 8px; padding: 0 10px; margin-top: 10px; background: var(--bg); }
details.sub > summary { cursor: pointer; padding: 8px 0; font-size: 12.5px; font-weight: 500; }
details.sub[open] > summary { border-bottom: 1px solid var(--line); margin-bottom: 10px; }
details.sub .grid2 { padding-bottom: 12px; }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; }
button { font: 500 13px var(--f-body); border-radius: 6px; padding: 7px 12px; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button:hover { border-color: var(--accent); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; min-width: 0; }
.card > h2 { margin-bottom: 10px; }
.card .sub { color: var(--muted); font-size: 13px; margin: -4px 0 12px; max-width: 75ch; }

.verdict { border-top: 4px solid var(--accent); }
.verdict.fail { border-top-color: var(--bad); }
.vhead { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; align-items: flex-start; }
.vhead .what { font-family: var(--f-display); font-size: 22px; font-weight: 600; }
.vhead .why { color: var(--muted); margin-top: 2px; max-width: 70ch; }
.pill { display: inline-flex; align-items: center; gap: 6px; font: 500 11.5px var(--f-mono); padding: 2px 8px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
.pill.good { color: var(--good); } .pill.warn { color: var(--warn); } .pill.bad { color: var(--bad); } .pill.neutral { color: var(--muted); }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 14px; }
.kpi { background: var(--bg); border-radius: 8px; padding: 10px 12px; }
.kpi .k { font-size: 12px; color: var(--muted); }
.kpi .v { font: 500 26px/1.15 var(--f-mono); font-variant-numeric: tabular-nums; margin-top: 2px; }
.kpi .v small { font-size: 13px; color: var(--muted); font-weight: 400; }
.kpi .d { font-size: 12px; color: var(--muted); }
.kpi.main .v { color: var(--accent); }
.warns { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
.warnline { border-left: 3px solid var(--warn); padding: 4px 10px; background: var(--bg); font-size: 13px; }
.warnline.bad { border-left-color: var(--bad); }

.pools { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; margin-bottom: 14px; }
.pool { border: 1px solid var(--line); border-left: 5px solid var(--decode); border-radius: 8px; padding: 10px 12px; }
.pool.p { border-left-color: var(--prefill); } .pool.a { border-left-color: var(--agg); } .pool.s { border-left-color: var(--spare); }
.pool .t { font-family: var(--f-display); font-weight: 600; font-size: 15px; }
.pool .l { font: 500 13px var(--f-mono); margin: 2px 0 4px; }
.pool ul { margin: 0; padding-left: 16px; color: var(--muted); font-size: 12.5px; }

.rack { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.node { border: 1px solid var(--line); border-radius: 6px; padding: 6px; background: var(--bg); }
.node .nh { display: flex; justify-content: space-between; font: 11px var(--f-mono); color: var(--muted); margin-bottom: 5px; }
.gpus { display: grid; grid-template-columns: repeat(8, 1fr); gap: 3px; }
.gpu { aspect-ratio: 1 / 1.35; border-radius: 3px; background: var(--sunk); display: flex; align-items: flex-end; justify-content: center; font: 9px var(--f-mono); color: var(--accent-ink); padding-bottom: 2px; overflow: hidden; }
.gpu.p { background: var(--prefill); color: #fff; } .gpu.d { background: var(--decode); color: var(--accent-ink); } .gpu.a { background: var(--agg); color: #fff; }
.gpu.s { background: repeating-linear-gradient(135deg, var(--spare) 0 3px, transparent 3px 6px); border: 1px solid var(--spare); }
.gpu.gl { box-shadow: inset 2px 0 0 var(--surface); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 10px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }

.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 20px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-weight: 500; color: var(--muted); font-size: 12px; }
td.n, th.n { text-align: right; }
tr.chosen td { background: color-mix(in srgb, var(--accent) 10%, transparent); }
tr.chosen td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
.tablewrap { overflow-x: auto; }
.muted { color: var(--muted); }
.x { color: var(--muted); font-size: 12px; }

.membar { display: flex; height: 26px; border-radius: 5px; overflow: hidden; border: 1px solid var(--line); }
.membar div { height: 100%; }
.memlegend { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 10px; margin-top: 10px; font-size: 12.5px; align-items: center; }
.memlegend i { width: 11px; height: 11px; border-radius: 2px; display: inline-block; }
dl.kv { display: grid; grid-template-columns: 1fr auto; gap: 5px 14px; margin: 0; font-size: 13px; }
dl.kv dt { color: var(--muted); }
dl.kv dd { margin: 0; text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
dl.kv .sep { grid-column: 1 / -1; border-top: 1px solid var(--line); margin: 4px 0; }

svg.chart { width: 100%; height: auto; display: block; overflow: visible; }
svg.chart text { fill: var(--muted); font: 11px var(--f-mono); }
svg.chart .grid { stroke: var(--line); stroke-width: 1; }
.method { font-size: 13px; }
.method ol { padding-left: 20px; margin: 6px 0; display: flex; flex-direction: column; gap: 6px; max-width: 90ch; }
.method code { font-family: var(--f-mono); font-size: 12px; background: var(--bg); padding: 1px 4px; border-radius: 3px; }
.toast { font-size: 12px; color: var(--good); min-height: 1em; }
.note { font-size: 12.5px; color: var(--muted); margin: 0 0 10px; }
.note code, .sub code { font-family: var(--f-mono); font-size: 11.5px; }
.lbl { font-size: 12px; color: var(--muted); display: block; margin: 8px 0 3px; }
textarea { width: 100%; font: 12px/1.45 var(--f-mono); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px; resize: vertical; }
input[type=text] { width: 100%; font: 13px var(--f-body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
.saver { border-top: 1px solid var(--line); padding: 10px 0 12px; display: flex; flex-direction: column; gap: 6px; }
.saver > label { font-size: 12px; color: var(--muted); }
.saverow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.saverow input { flex: 1 1 160px; }
.msg { font-size: 12.5px; min-height: 0; }
.msg.good { color: var(--good); } .msg.bad, .msg .bad { color: var(--bad); }
.field[hidden] { display: none; }
.eyebrow { font: 500 12px var(--f-mono); color: var(--muted); margin-bottom: 2px; }
.toast.bad { color: var(--bad); }
.rack.wide { grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
.rack.wide .gpu { aspect-ratio: 1 / 1.2; font-size: 8px; }
.legend i.hatch { background: repeating-linear-gradient(135deg, var(--spare) 0 3px, transparent 3px 6px); border: 1px solid var(--spare); }
.legend i.dots { background: none; border-top: 2px dotted var(--muted); height: 0; border-radius: 0; }
.overlay { position: fixed; inset: 0; background: color-mix(in srgb, var(--ink) 40%, transparent); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
.overlay[hidden] { display: none; }
.dlg { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; width: min(760px, 100%); max-height: calc(100% - 32px); overflow: auto; display: flex; flex-direction: column; gap: 10px; }
.dlg .dh { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.dlg .sub { margin: 0; color: var(--muted); font-size: 13px; }
.dlg .msg { color: var(--muted); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
/* What fits view */
nav.views { display: flex; gap: 6px; }
nav.views .chip { font-size: 12.5px; padding: 4px 12px; }
.fitlayout { display: grid; grid-template-columns: 360px minmax(0, 1fr); }
.fitlayout[hidden], .layout[hidden] { display: none; }
@media (max-width: 900px) { .fitlayout { grid-template-columns: 1fr; } }
.fittable tr[data-model] { cursor: pointer; }
.fittable tr[data-model]:hover, .fittable tr[data-model]:focus-visible { background: var(--sunk); outline: none; }
.fittable tr.picked { background: var(--sunk); box-shadow: inset 3px 0 0 var(--accent); }
.fittable tr.nofit td { color: var(--muted); }
.fittable td.mono { white-space: nowrap; }
.fittable .why { font-size: 12px; color: var(--muted); }
.fittable .ok { color: var(--good); font-weight: 600; } .fittable .no { color: var(--muted); }
.fittable td.barcell { width: 32%; min-width: 140px; vertical-align: middle; }
.fitbar { display: flex; gap: 2px; height: 10px; }
.fitbar span { display: block; height: 100%; } .fitbar span:first-child { border-radius: 4px 0 0 4px; } .fitbar span:last-child { border-radius: 0 4px 4px 0; }
.fitbar .p, .lg.p { background: var(--decode); } .fitbar .e, .lg.e { background: var(--spare); }
.lg { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin: 0 4px 0 6px; vertical-align: -1px; }
.kvgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px 18px; }
.kvgrid .k { font-size: 12px; color: var(--muted); } .kvgrid .v { font: 500 16px var(--f-mono); font-variant-numeric: tabular-nums; }
.cmdrow { display: flex; gap: 8px; align-items: center; margin: 12px 0 6px; }
.cmdrow code { flex: 1; font: 12.5px var(--f-mono); background: var(--sunk); border-radius: 6px; padding: 8px 10px; overflow-x: auto; white-space: nowrap; }
</style>
</head>
<body>
<header class="top">
  <div>
    <h1>Inference Sizer</h1>
    <p>How many GPUs serve a model at your latency targets, and how to lay them out. Part of AIInfraTools, next to FleetScope.</p>
  </div>
  <nav class="views" aria-label="View">
    <button type="button" class="chip on" data-view="size" aria-pressed="true">Size for traffic</button>
    <button type="button" class="chip" data-view="fit" aria-pressed="false">What fits on my GPUs</button>
  </nav>
  <div class="spec" id="spec"></div>
</header>
<div class="layout">
  <aside class="inputs" id="inputs" aria-label="Inputs"></aside>
  <main class="results" id="results" aria-live="polite"></main>
</div>
<div class="fitlayout" id="fitview" hidden>
  <aside class="inputs" id="fit-inputs" aria-label="What fits: inputs"></aside>
  <main class="results" id="fit-results" aria-live="polite"></main>
</div>
<div class="overlay" id="dialog" hidden></div>
<script>
/* Inference Sizer catalog: GPUs and models, spec-sheet import/export, and Hugging Face config.json parsing.
   Plain data plus validation, so the browser page, the CLI and FleetScope can share it. */
(function (root) {
  'use strict';

  // ---------- schemas ----------
  // Every field a GPU or model entry may carry, with its unit, range and a one-line meaning.
  // The UI builds its edit forms from these, and imports are checked against them.
  const GPU_FIELDS = [
    { k: 'label', type: 'text', label: 'Name', required: true },
    { k: 'vendor', type: 'text', label: 'Vendor' },
    { k: 'hbmGB', label: 'HBM per GPU', unit: 'GB', min: 1, max: 4096, required: true, hint: 'Memory the GPU exposes (e.g. 180 for HGX B200).' },
    { k: 'hbmTBs', label: 'HBM bandwidth', unit: 'TB/s', min: 0.1, max: 100, required: true },
    { k: 'tfBf16', label: 'BF16 dense', unit: 'TFLOPS', min: 1, max: 1e6, required: true, hint: 'Dense, not the "with sparsity" figure.' },
    { k: 'tfFp8', label: 'FP8 dense', unit: 'TFLOPS', min: 0, max: 1e6, hint: '0 if the GPU has no FP8 tensor cores.' },
    { k: 'tfFp4', label: 'FP4 dense', unit: 'TFLOPS', min: 0, max: 1e6, hint: '0 if the GPU has no FP4 tensor cores.' },
    { k: 'scaleUpGBs', label: 'GPU-to-GPU link, per direction', unit: 'GB/s', min: 1, max: 1e5, required: true, hint: 'NVLink / Infinity Fabric. Half the bidirectional figure.' },
    { k: 'domain', label: 'GPUs per scale-up domain', unit: 'GPUs', min: 1, max: 576, required: true, hint: '8 for an HGX server, 72 for an NVL72 rack.' },
    { k: 'nicGbps', label: 'Scale-out NIC per GPU', unit: 'Gb/s', min: 1, max: 1e4, required: true },
    { k: 'nodeKW', label: 'Power per domain (max)', unit: 'kW', min: 0, max: 2000 },
    { k: 'price', label: 'Price', unit: '$/GPU-hr', min: 0, max: 1000, hint: 'Placeholder unless you set your own.' },
    { k: 'source', type: 'text', label: 'Spec sheet URL' },
  ];
  const MODEL_FIELDS = [
    { k: 'name', type: 'text', label: 'Name', required: true },
    { k: 'total', label: 'Total params', unit: 'B', min: 0.01, max: 1e5, required: true },
    { k: 'active', label: 'Active params per token', unit: 'B', min: 0.01, max: 1e5, required: true },
    { k: 'layers', label: 'Layers', min: 1, max: 1000, int: true, required: true },
    { k: 'hidden', label: 'Hidden size', min: 64, max: 1e6, int: true, required: true },
    { k: 'qHeads', label: 'Query heads', min: 1, max: 4096, int: true, required: true },
    { k: 'kvHeads', label: 'KV heads', min: 1, max: 4096, int: true, required: true },
    { k: 'headDim', label: 'Head dim', min: 8, max: 4096, int: true, required: true },
    { k: 'attn', type: 'enum', opts: ['gqa', 'mla'], label: 'Attention', required: true },
    { k: 'mlaLatent', label: 'MLA KV latent (kv_lora_rank)', min: 1, max: 1e5, int: true },
    { k: 'mlaRope', label: 'MLA RoPE dim', min: 0, max: 1e4, int: true },
    { k: 'mlaNope', label: 'MLA QK no-PE dim', min: 0, max: 1e4, int: true },
    { k: 'mlaV', label: 'MLA V head dim', min: 1, max: 1e4, int: true },
    { k: 'experts', label: 'Routed experts (0 = dense)', min: 0, max: 1e5, int: true },
    { k: 'topk', label: 'Experts per token', min: 0, max: 1e4, int: true },
    { k: 'swaFrac', label: 'Share of sliding-window layers', min: 0, max: 1 },
    { k: 'swaWindow', label: 'Sliding window', unit: 'tokens', min: 0, max: 1e8, int: true },
    { k: 'maxCtx', label: 'Max context', unit: 'tokens', min: 256, max: 1e8, int: true, required: true },
    { k: 'wprec', type: 'enum', opts: ['bf16', 'fp8', 'fp4'], label: 'Default weight precision' },
    { k: 'source', type: 'text', label: 'Model card URL' },
  ];

  // ---------- built-in GPUs ----------
  // Per-GPU dense figures. HGX/DGX system totals divided by 8 (or 72 for NVL72); "with sparsity" figures halved.
  // Prices are placeholder on-demand rents (matching FleetScope's table where it has the GPU), not quotes.
  const GPUS = [
    { id: 'B200', label: 'NVIDIA B200 (HGX, 8-GPU)', vendor: 'NVIDIA', hbmGB: 180, hbmTBs: 8, tfBf16: 2250, tfFp8: 4500, tfFp4: 9000, scaleUpGBs: 900, domain: 8, nicGbps: 400, nodeKW: 14.3, price: 5.5,
      source: 'https://www.nvidia.com/en-us/data-center/dgx-b200/' },
    { id: 'B300', label: 'NVIDIA B300 (HGX, 8-GPU)', vendor: 'NVIDIA', hbmGB: 262, hbmTBs: 8, tfBf16: 2250, tfFp8: 4500, tfFp4: 13500, scaleUpGBs: 900, domain: 8, nicGbps: 800, nodeKW: 14.5, price: 7.0,

<script>
/* Export an Inference Sizer result as a FleetScope graph (../fleetscope), so the steady-state answer can be

// ---------- validation ----------

  s.kvMaxUtil = Math.min(1, Math.max(0.3, +s.kvMaxUtil || 0.9));

  ['layers', 'qHeads', 'kvHeads', 'headDim', 'hidden', 'experts', 'topk', 'ctx', 'maxSeqPerGPU', 'domain', 'mlaLatent', 'mlaV'].forEach(k => s[k] = Math.max(1, Math.round(+s[k] || 1)));
  if (!(+state.experts > 0)) s.experts = 0;

}
function warnings(s, r) {

  if (s.avgIn + s.avgOut > s.ctx) w.push(['bad', `The average request (${fInt(s.avgIn + s.avgOut)} tokens) does not fit the ${fCtx(s.ctx)} context window.`]);
  if (s.ctx > s.maxCtx) w.push(['warn', `The ${fCtx(s.ctx)} context window is above this model's maximum of ${fCtx(s.maxCtx)}.`]);
  if (s.avgIn > s.peakIn || s.avgOut > s.peakOut) w.push(['warn', 'An average token count is larger than its peak. Check the token inputs.']);
  if (r.md.computeFallback) w.push(['warn', `${s.gpuLabel} has no ${s.wprec.toUpperCase()} tensor cores. ${s.wprec.toUpperCase()} weights still save memory, but the math runs at the ${r.md.computeFallback.toUpperCase()} rate.`]);
  if (s.kvPolicy === 'reserve') w.push(['warn', `Every session reserves KV for the full ${fCtx(s.ctx)} window (${fGB(M.kvBytes(r.md, s.ctx))} each). Paged allocation (vLLM, SGLang, TRT-LLM default) usually needs far less memory.`]);
  if (s.experts > 0 && s.topk === 0) w.push(['warn', 'Experts is set but experts per token is 0, so the model is treated as dense.']);
  if (s.conc === 0 && s.dau === 0) w.push(['warn', 'Both concurrent sessions and DAU are 0, so there is no load to size for.']);

    if (r.ttftFloor > s.ttft / 1000 * m) w.push(['bad', `TTFT ${s.ttft} ms (less the ${s.sloMargin}% margin) is not reachable for a ${fInt(Math.min(s.peakIn, s.ctx))}-token peak prompt (fastest layout: ${fMs(r.ttftFloor)}). Relax TTFT, cut the peak prompt, raise the prefix-cache hit rate, or use lower-precision weights.`]);

  }

}

function niceMax(v) { if (!(v > 0)) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); for (const m of [1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10]) if (m * p >= v) return m * p; return 10 * p; }

  <div class="tablewrap"><table><thead><tr><th>Metric</th><th>Condition</th><th class="n">Estimate</th><th>Status</th></tr></thead><tbody>
  ${rows.map(x => `<tr><td>${esc(x[0])}</td><td class="muted">${esc(x[1])}</td><td class="n">${fMs(x[2])}</td><td>${pill(x[2], x[3])}</td></tr>`).join('')}
  <tr><td>KV cache in use</td><td class="muted">per ${esc(row.label)} instance at peak</td><td class="n">${pct(row.kvUse)}</td><td><span class="pill ${row.kvUse < 0.85 ? 'good' : row.kvUse <= 1 ? 'warn' : 'bad'}">${row.kvUse < 0.85 ? 'room to spare' : 'near the limit'}</span></td></tr>
  </tbody></table></div></section>`;
}
function memoryHTML(r) {
  const s = r.s, md = r.md, c = r.chosen;
  const row = c.mode === 'disagg' ? r.dis.D : r.agg.best, mi = row.mi;
  const hbm = s.hbmGB * 1e9, held = hbm * (1 - s.memUtil), resv = md.reserve, w = mi.wGPU;
  const kvTot = Math.max(0, mi.avail), kvUsed = Math.min(kvTot, kvTot * row.kvUse);
  const parts = [['Weights', w, 'var(--ink)'], ['KV cache in use', kvUsed, 'var(--decode)'], ['KV cache free', kvTot - kvUsed, 'color-mix(in srgb, var(--decode) 30%, transparent)'], ['Runtime reserve', resv, 'var(--warn)'], ['Held back by engine', held, 'var(--line)']];
  return `<section class="card"><h2>Memory on one decode GPU</h2><p class="sub">${esc(row.label)}, ${s.wprec.toUpperCase()} weights, ${s.kvprec.toUpperCase()} KV, ${s.kvPolicy === 'paged' ? 'paged KV' : 'full-window reservation'}, ${s.hbmGB} GB HBM.</p>
    <div class="membar">${parts.map(p => `<div style="width:${Math.max(0, 100 * p[1] / hbm).toFixed(2)}%;background:${p[2]}" title="${p[0]}"></div>`).join('')}</div>
    <div class="memlegend">${parts.map(p => `<i style="background:${p[2]}"></i><span>${p[0]}</span><span class="mono">${fGB(p[1])}</span>`).join('')}</div>
    <dl class="kv" style="margin-top:14px">
      <dt>KV per token (all layers)</dt><dd>${fGB(md.kvTokLayer * s.layers)}</dd>
      <dt>KV for one ${fCtx(s.ctx)} full-context request</dt><dd>${fGB(mi.ctxBytes)}</dd>
      <dt>KV for an average request (${fInt(s.avgIn + s.avgOut)} tokens)</dt><dd>${fGB(M.kvBytes(md, Math.min(s.ctx, s.avgIn + s.avgOut)))}</dd>
      <dt>KV capacity per instance</dt><dd>${fGB(mi.cap)}</dd>
      ${mi.rep > 1 ? `<dt>KV replicated across GPUs</dt><dd>${mi.rep}× (${md.mla ? 'MLA latent' : s.kvHeads + ' KV heads'} under TP)</dd>` : ''}
      <dt>Sequences per instance at the ${pct(s.kvMaxUtil)} fill limit</dt><dd>${fInt(mi.Bmem)}</dd>
    </dl></section>`;
}
function loadHTML(r) {
  const s = r.s, L = r.load, row = r.chosen.mode === 'disagg' ? r.dis.D : r.agg.best, hit = s.prefixHit / 100;
  return `<section class="card"><h2>Load being sized</h2><p class="sub">Peak figures include ${s.headroom}% headroom. Sized on ${L.binding === 'DAU' ? 'DAU traffic' : 'concurrent sessions'}, the larger of the two.</p>
  <dl class="kv">
    <dt>Requests/s from DAU (peak)</dt><dd>${f1(L.lamDau)}</dd>
    <dt>Requests/s implied by ${fInt(s.conc)} sessions</dt><dd>${f1(L.lamConc)}</dd>
    <dt>Peak request rate sized</dt><dd>${f1(L.lam)}</dd>
    <div class="sep"></div>
    <dt>Prompt tokens/s to prefill${hit ? ` (after ${s.prefixHit}% cache hits)` : ''}</dt><dd>${fTok(L.lam * Math.min(s.avgIn, s.ctx) * (1 - hit))}</dd>
    <dt>Output tokens/s to decode</dt><dd>${fTok(Math.max(L.Dtok, L.Cs / row.tpotOp))}</dd>
    <dt>Streams in flight at peak</dt><dd>${fInt(Math.max(L.Cs, L.Dtok * row.tpotOp))}</dd>
    <div class="sep"></div>
    <dt>Requests per day</dt><dd>${fTok(r.econ.reqDay)}</dd>
    <dt>Input / output tokens per day</dt><dd>${fTok(r.econ.inDay)} / ${fTok(r.econ.outDay)}</dd>
    <dt>Daily average vs sized peak</dt><dd>${s.dau > 0 ? pct(r.econ.avgVsPeak) : '–'}</dd>
  </dl></section>`;
}
function candidatesHTML(r) {
  const c = r.chosen;
  const rows = r.cfgs.map((cfg, i) => {
    const d = r.dis.dec[i], p = r.dis.pre[i], a = r.agg.rows[i];
    const cell = (x, f) => x.feasible ? f(x) : `<span class="x">${esc(x.why)}</span>`;
    const isChosen = c && ((c.mode === 'agg' && r.agg.best === a) || (c.mode === 'disagg' && (r.dis.D === d || r.dis.P === p)));
    return `<tr class="${isChosen ? 'chosen' : ''}"><td class="mono">${cfg.g}</td><td>${esc(d.label)}</td><td class="n">${cell(d, x => fInt(x.Binst))}</td><td class="n">${cell(d, x => fInt(x.gpus))}</td><td>${esc(p.label)}</td><td class="n">${cell(p, x => fInt(x.gpus))}</td><td class="n">${cell(a, x => fInt(x.gpus))}</td></tr>`;
  }).join('');
  return `<section class="card"><h2>Every layout considered</h2><p class="sub">GPUs per model instance, and how many GPUs each pool needs with that instance size. The cheapest feasible layout per pool is used; highlighted rows are the recommendation.</p>
  <div class="tablewrap"><table><thead><tr><th>GPUs / instance</th><th>Decode layout</th><th class="n">Max streams</th><th class="n">Decode GPUs</th><th>Prefill layout</th><th class="n">Prefill GPUs</th><th class="n">Aggregated GPUs</th></tr></thead><tbody>${rows}</tbody></table></div></section>`;
}
function methodHTML() {
  return `<section class="card method"><h2>How the estimate works</h2>
  <ol>
    <li><b>Load.</b> Peak request rate = DAU × requests/user ÷ 86,400 × peak factor. Concurrent sessions convert to a rate with Little's law: sessions ÷ (TTFT + output × TPOT). Decode must hold the session count and deliver rate × average output tokens/s.</li>
    <li><b>Memory.</b> Weights per GPU = params × bytes ÷ GPUs (MoE experts sharded by EP; with MLA, attention runs data-parallel so dense weights are replicated). KV per token = 2 × layers × KV heads × head dim × bytes (MLA: latent + RoPE dims per layer). Sliding-window layers store only the window. KV is replicated when TP is larger than the KV-head count. The context window must fit one full request; under paged allocation each session holds its actual tokens, under reservation the whole window. KV fills to the fill limit at most.</li>
    <li><b>Decode step.</b> <code>max(HBM read time, compute time) + collectives + overhead</code>. The HBM read is weights (only the experts the batch routes to) plus each stream's KV. The largest batch that stays within TPOT less the safety margin sets streams per instance.</li>
    <li><b>Prefill.</b> FLOPs = 2 × active params × prompt tokens + causal attention, at the chosen MFU. TP inside a scale-up domain, context parallelism across domains. Queueing uses an M/D/1 model, with utilisation capped so the average prompt still meets TTFT.</li>
    <li><b>Serving architecture.</b> Disaggregated: separate prefill and decode pools, KV moved over RDMA (counted in TTFT). Aggregated: each step carries decode tokens plus a prefill chunk sized to keep the step within TPOT. Auto picks disaggregated only when it saves at least 10% of nodes.</li>
    <li><b>Fleet.</b> Instances up to the scale-up domain size pack first-fit into nodes (or racks); larger ones span whole domains. N+1 keeps room for one more instance of the largest layout.</li>
    <li><b>GPUs without a precision.</b> FP4 weights on a GPU without FP4 tensor cores keep the memory saving but compute at the FP8 (or BF16) rate.</li>
  </ol>
  <p class="muted" style="max-width:90ch">First-order model. It leaves out speculative decoding / MTP, CUDA-graph padding, request-length variance beyond the peak checks and framework-specific kernels. Calibrate the engine assumptions against a vLLM, SGLang or TensorRT-LLM benchmark at your own sequence lengths, then use Export to FleetScope to replay the result over time.</p></section>`;
}
function summaryText(r) {
  const s = r.s, c = r.chosen, L = r.load;
  const lines = [`Sizing: ${s.modelLabel} on ${s.gpuLabel}, ${s.wprec.toUpperCase()} weights, ${s.kvprec.toUpperCase()} KV, ${fCtx(s.ctx)} context`,
    `Load: ${fInt(s.conc)} concurrent sessions; ${fInt(s.dau)} DAU × ${s.rpu} req/day, ${s.peakFactor}× peak → ${f1(L.lam)} req/s sized (incl. ${s.headroom}% headroom)`,
    `Tokens: in avg ${fInt(s.avgIn)} / peak ${fInt(s.peakIn)}, out avg ${fInt(s.avgOut)} / peak ${fInt(s.peakOut)}`,
    `Targets: TTFT ${s.ttft} ms, TPOT ${s.tpot} ms (sized with a ${s.sloMargin}% margin)`];
  if (!c) { lines.push(`Result: no ${s.gpuLabel} layout meets these targets.`); return lines.join('\n'); }
  if (c.mode === 'disagg') lines.push(`Recommendation: disaggregated. Prefill ${r.dis.P.N} × ${r.dis.P.label} (${r.dis.P.gpus} GPUs), decode ${r.dis.D.N} × ${r.dis.D.label} (${r.dis.D.gpus} GPUs)`, `Estimates: TTFT ${fMs(r.dis.P.ttftAvg)} avg / ${fMs(r.dis.P.ttftPeak)} peak prompt; TPOT ${fMs(r.dis.D.tpotOp)}`);
  else lines.push(`Recommendation: aggregated with chunked prefill. ${r.agg.best.N} × ${r.agg.best.label} (${r.agg.best.gpus} GPUs)`, `Estimates: TTFT ${fMs(r.agg.best.ttftAvg)} avg / ${fMs(r.agg.best.ttftPeak)} peak prompt; TPOT ${fMs(r.agg.best.tpotOp)} typical`);
  lines.push(`Fleet: ${c.gpus} GPUs serving → ${c.totalNodes} × ${c.nodeGPUs}-GPU ${unitName(c.nodeGPUs)}s = ${c.provGPUs} GPUs${c.kw ? `, ~${f1(c.kw)} kW max` : ''}`);
  if (s.dau > 0 && s.price > 0) lines.push(`Cost: ${fUSD(r.econ.costDay)}/day, ${fUSD(r.econ.perMOut)} per 1M output tokens at $${(+s.price).toFixed(2)}/GPU-hr`);
  return lines.join('\n');
}

// ---------- update ----------
let last = null;
function setHint(k, text, warn) { const h = document.getElementById('hint-' + k); if (h) { h.textContent = text || ''; h.classList.toggle('warn', !!warn); } }
function update() {
  save(STORE, state);
  const s = sanitized(), r = M.plan(s);
  last = r;
  const warns = warnings(s, r);
  setHint('ctx', `Model max ${fCtx(s.maxCtx)}. Peak request uses ${fInt(s.peakIn + s.peakOut)} tokens.`, s.peakIn + s.peakOut > s.ctx || s.ctx > s.maxCtx);
  const chips = $('#chips-ctx');
  chips.innerHTML = FIELDS.ctx.chips.filter(v => v <= Math.max(s.maxCtx, 8192)).concat(s.maxCtx > 262144 ? [s.maxCtx] : []).map(v => `<button type="button" class="chip ${v === s.ctx ? 'on' : ''}" data-v="${v}">${fCtx(v)}</button>`).join('');
  setHint('tpot', `${f1(1000 / s.tpot)} tokens/s per user`);
  setHint('model', `${s.experts ? `MoE, ${s.active}B of ${s.total}B active` : `Dense, ${s.total}B`} · ${s.attn === 'mla' ? 'MLA' : s.kvHeads + ' KV heads'} · weights ${fGB(r.md.Wd + r.md.We)}`);
  setHint('gpu', `${s.hbmGB} GB @ ${s.hbmTBs} TB/s · ${fInt(s.tfFp8 || s.tfBf16)} TFLOPS ${s.tfFp8 ? 'FP8' : 'BF16'}${s.tfFp4 ? ` · ${fInt(s.tfFp4)} FP4` : ''} · ${s.domain} per domain`);
  setHint('conc', `Implies ${f1(r.load.lamConc)} req/s`);
  setHint('dau', s.dau > 0 ? `${f1(r.load.lamDau)} req/s at peak` : '');
  $('#spec').textContent = `${s.gpuLabel} · ${s.hbmGB} GB @ ${s.hbmTBs} TB/s · ${s.scaleUpGBs} GB/s scale-up per direction · ${s.domain} GPUs per domain · ${s.nicGbps}G NIC per GPU`;
  const el = $('#results');
  if (!r.chosen) { el.innerHTML = verdictHTML(r, warns) + methodHTML(); return; }
  const lbl = (r.chosen.mode === 'disagg' ? r.dis.D : r.agg.best).label;
  el.innerHTML = verdictHTML(r, warns)
    + `<section class="card"><h2>GPU topology</h2><p class="sub">How the ${r.chosen.provGPUs} GPUs split into model instances and sit on ${r.chosen.nodeGPUs}-GPU ${unitName(r.chosen.nodeGPUs)}s.</p>${topologyHTML(r)}</section>`
    + sloHTML(r)
    + `<div class="two"><section class="card"><h2>Decode step time vs batch</h2><p class="sub">One ${esc(lbl)} instance. Where the curve crosses the target sets streams per instance.</p>${stepChart(r)}</section>
       <section class="card"><h2>GPUs vs TPOT target</h2><p class="sub">Provisioned GPUs as the TPOT target moves; your current target is highlighted.</p>${sensChart(r)}</section></div>`
    + `<div class="two">${memoryHTML(r)}${loadHTML(r)}</div>` + candidatesHTML(r) + methodHTML();
}
$('#results').addEventListener('click', async e => {
  const b = e.target.closest('[data-r]'); if (!b) return;
  if (b.dataset.r === 'copy') {
    const t = $('#toast');
    try { await navigator.clipboard.writeText(summaryText(last)); t.textContent = 'Summary copied.'; }
    catch (err) { showDialog('Summary', 'Copy is blocked here; select the text below.', summaryText(last), 'sizing-summary.txt'); }
  }
  if (b.dataset.r === 'fleetscope') {
    const x = X.toGraph(last);
    if (!x.ok) { $('#toast').textContent = x.errors.join(' '); $('#toast').className = 'toast bad'; return; }
    showDialog('Export to FleetScope', `A FleetScope graph with this model, your targets, ${fInt(x.users)} chat users arriving at the sized peak rate, and the recommended pools (GPUs per instance set). In FleetScope, press <b>Load graph JSON</b> and Play, or save it as <code>fleetscope/scenarios/&lt;name&gt;/graph.json</code> for the CI plan.<br>${x.notes.map(esc).join('<br>')}`, JSON.stringify(x.graph, null, 1), 'graph.json');
  }
});

buildInputs();

<script>
// The Inference Sizer, the other way round.
//   capacity(): a model on hardware you have → the most load it carries within the latency targets, the longest
//               prompt it can take, and the layout that does it
//   fitModels(): hardware you have (+ a workload) → which catalog models fit, ranked
// Both run the sizer's plan() and search on its inputs, so they inherit its model and its calibration (or lack of it).
// Two answers each: "production" (the sizer's 15% headroom, an N+1 spare, a 10% margin under the targets) and "edge"
// (none of those: what a benchmark would show).
(function (root) {
  const SM = typeof require === 'function' ? require('./model.js') : root.SizerModel;
  const SC = typeof require === 'function' ? require('./catalog.js') : root.SizerCatalog;

  const PROFILE = { production: {}, edge: { headroom: 0, nPlus1: false, sloMargin: 0 } };

  // Sizer settings for one model on one GPU type and a workload. hw: { gpu, nodes, gpusPerNode? } ; wl: { isl, osl,
  // islP99?, oslP99?, rate? } ; tg: { ttftS, tpotS } ; extra: any sizer field (kvprec, wprec, eff…, calibration)
  function settings(model, hw, wl, tg, extra) {
    const g = typeof hw.gpu === 'object' ? hw.gpu : SC.GPUS.find(x => x.id === hw.gpu);
    const m = typeof model === 'object' ? model : SC.MODELS.find(x => x.id === model);
    if (!g) throw new Error(`unknown GPU ${hw.gpu}; known: ${SC.GPUS.map(x => x.id).join(', ')}`);
    if (!m) throw new Error(`unknown model ${model}; known: ${SC.MODELS.map(x => x.id).join(', ')}`);
    const isl = wl.isl || 2000, osl = wl.osl || 400, islP99 = Math.max(isl, wl.islP99 || isl * 4), oslP99 = Math.max(osl, wl.oslP99 || osl * 4);
    return Object.assign({}, SM.SETTINGS, m, g, {
      model: m.id, gpu: g.id, domain: hw.gpusPerNode || g.domain,
      dau: (wl.rate || 1) * 86400, rpu: 1, peakFactor: 1, concSource: 'dau', conc: 0,
      avgIn: isl, peakIn: islP99, avgOut: osl, peakOut: oslP99,
      ctx: Math.min(m.maxCtx || 131072, Math.max(SM.SETTINGS.ctx, islP99 + oslP99)),
      ttft: Math.round((tg.ttftS || 2) * 1000), tpot: Math.round((tg.tpotS || 0.05) * 1000), mode: 'auto',
    }, extra || {});
  }

  // The layout plan() chose, as deployable parallelism.
  function layout(p) {
    if (!p || !p.chosen) return null;
    if (p.chosen.mode === 'agg') { const b = p.agg.best; return { mode: 'agg', tp: b.c.tpl, pp: b.c.pp, gpusPerInstance: b.c.g, instances: b.N, concurrency: b.Bop * b.N, kvUse: b.kvUse, label: b.label }; }
    const P = p.dis.P, D = p.dis.D;
    return { mode: 'disagg', prefill: { tp: P.c.tpl, pp: P.c.pp, gpusPerInstance: P.c.g, instances: P.N, label: P.label }, decode: { tp: D.c.tpl, pp: D.c.pp, gpusPerInstance: D.c.g, instances: D.N, label: D.label }, concurrency: D.Bop * D.N, instances: P.N + D.N };
  }

  // Does the plan for settings s fit on hw? (provisioned nodes, spare included, within the nodes there are)
  function fits(s, hw) {
    const p = SM.plan(s, { noSens: true });
    if (!p.chosen) return { ok: false, p };
    const D = s.domain, have = hw.nodes != null ? hw.nodes : Math.floor((hw.gpus || 0) / D);
    const ok = have >= 1 ? p.chosen.totalNodes <= have : (p.chosen.gpus + (s.nPlus1 ? p.chosen.gpus : 0)) <= (hw.gpus || 0);
    return { ok, p };
  }

  // The highest request rate (req/s) the hardware carries within the targets: a doubling then a bisection on rate.
  function maxRate(model, hw, wl, tg, opts) {
    opts = opts || {};
    const prof = PROFILE[opts.profile || 'production'];
    const at = r => fits(settings(model, hw, Object.assign({}, wl, { rate: r }), tg, Object.assign({}, opts.extra, prof)), hw);
    let lo = 0, hi = 0.05, best = null;
    const first = at(hi);
    if (!first.ok) {
      // can't carry even a trickle: say why (weights, one full-context sequence, a latency floor)
      const rows = (first.p.agg && first.p.agg.rows) || [];
      const why = first.p.chosen ? `needs ${first.p.chosen.totalNodes} node(s) even at the lowest load` : (rows.find(r => r.why) || {}).why || 'no layout meets the targets';
      return { rate: 0, why, floors: { ttftS: first.p.ttftFloor, tpotS: first.p.tpotFloor } };
    }
    best = { rate: hi, p: first.p };
    while (hi < 1e5) { const x = at(hi * 2); if (!x.ok) break; hi *= 2; best = { rate: hi, p: x.p }; }
    lo = hi; hi = hi * 2;
    for (let i = 0; i < 14; i++) { const mid = (lo + hi) / 2, x = at(mid); if (x.ok) { lo = mid; best = { rate: mid, p: x.p }; } else hi = mid; }
    return { rate: best.rate, layout: layout(best.p), nodes: best.p.chosen.totalNodes, gpus: best.p.chosen.gpus, provGPUs: best.p.chosen.provGPUs, reason: best.p.reason };
  }

  // The longest prompt (tokens) one request can bring at a light load: memory for weights and KV, and TTFT.
  function maxPrompt(model, hw, wl, tg, opts) {
    opts = opts || {};
    const m = typeof model === 'object' ? model : SC.MODELS.find(x => x.id === model);
    const prof = PROFILE[opts.profile || 'production'], osl = wl.osl || 400;
    const ok = L => fits(settings(model, hw, Object.assign({}, wl, { rate: 0.05, isl: Math.min(L, wl.isl || L), islP99: L, oslP99: osl }), tg, Object.assign({}, opts.extra, prof, { ctx: L + osl })), hw).ok;
    const cap = (m.maxCtx || 131072) - osl;
    if (!ok(1024)) return 0;
    if (ok(cap)) return cap;
    let lo = 1024, hi = cap;
    while (hi - lo > 256) { const mid = Math.floor((lo + hi) / 2); if (ok(mid)) lo = mid; else hi = mid; }
    return lo;
  }

  // Everything about one model on given hardware.
  function capacity(model, hw, wl, tg, opts) {
    opts = opts || {};
    const m = typeof model === 'object' ? model : SC.MODELS.find(x => x.id === model);
    const g = SC.GPUS.find(x => x.id === (typeof hw.gpu === 'object' ? hw.gpu.id : hw.gpu));
    const gpus = hw.nodes != null ? hw.nodes * (hw.gpusPerNode || g.domain) : hw.gpus;
    const prod = maxRate(m, hw, wl, tg, Object.assign({}, opts, { profile: 'production' }));
    const edge = maxRate(m, hw, wl, tg, Object.assign({}, opts, { profile: 'edge' }));
    const out = { model: m.id, name: m.name, params: m.total, active: m.active, gpu: g.id, gpus, wl: { isl: wl.isl || 2000, osl: wl.osl || 400 }, tg: { ttftS: tg.ttftS || 2, tpotS: tg.tpotS || 0.05 },
      production: prod, edge, maxPrompt: opts.noPrompt ? null : maxPrompt(m, hw, wl, tg, opts), modelMaxCtx: m.maxCtx };
    const tps = r => r * (wl.osl || 400);
    if (prod.rate > 0) {
      out.production.outTokensPerS = tps(prod.rate);
      out.production.usersAt = rpu => prod.rate * 86400 / rpu; // daily active users at `rpu` requests each, flat load
      const price = g.price || 0;
      out.production.dollarsPerMOut = price && gpus ? gpus * price / (tps(prod.rate) * 3600 / 1e6) : null;
    }
    return out;
  }

  // Which catalog models fit on the hardware, for a workload. rank: 'largest' (most parameters that still carry the
  // needed rate: a proxy for capability, not a quality score) or 'throughput'.
  function fitModels(hw, wl, tg, opts) {
    opts = opts || {};
    const rows = SC.MODELS.map(m => {
      try { return capacity(m, hw, wl, tg, Object.assign({}, opts, { noPrompt: !opts.prompt })); } catch (e) { return { model: m.id, name: m.name, params: m.total, error: e.message, production: { rate: 0, why: e.message }, edge: { rate: 0 } }; }
    });
    const need = wl.rate || 0;
    for (const r of rows) r.meetsRate = r.production.rate > 0 && r.production.rate >= need;
    const rank = opts.rank || (need ? 'largest' : 'throughput');
    rows.sort((a, b) => (b.meetsRate - a.meetsRate) || (rank === 'largest' ? (b.params - a.params) : (b.production.rate - a.production.rate)));
    return { hw, wl, tg, need, rank, rows };
  }

  const api = { settings, capacity, maxRate, maxPrompt, fitModels, layout, PROFILE };
  if (typeof module !== 'undefined' && module.exports) module.exports = api; else root.SizerFit = api;
})(typeof self !== 'undefined' ? self : this);

</script>
<script>
/* Inference Sizer, "What fits" view: given GPUs, which models fit and how much load each carries; click a model for
   its capacity. Uses window.SizerCatalog (built-in catalog) and window.SizerFit. Separate from ui.js on purpose. */
(function () {
'use strict';
const C = window.SizerCatalog, F = window.SizerFit, KEY = 'inference-sizer:fit:v1';
const $ = s => document.querySelector(s);
const esc = v => String(v == null ? '' : v).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const f1 = n => (!isFinite(n) ? '–' : Math.abs(n) >= 100 ? Math.round(n).toLocaleString('en-US') : n.toFixed(n >= 10 ? 1 : 2));
const fInt = n => (isFinite(n) ? Math.round(n).toLocaleString('en-US') : '–');
const load = () => { try { return JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { return null; } };
const save = v => { try { localStorage.setItem(KEY, JSON.stringify(v)); } catch (e) {} };

const st = Object.assign({ gpu: 'H100', nodes: 2, isl: 2000, osl: 400, rate: '', ttft: 2, tpotMs: 50, rank: 'largest', pick: null }, load() || {});
let result = null, timer = null;

function inputsHTML() {
  const opt = (v, l, cur) => `<option value="${esc(v)}"${String(v) === String(cur) ? ' selected' : ''}>${esc(l)}</option>`;
  const num = (k, label, step, min, hint) => `<div class="field"><label for="fit-${k}">${label}</label><input type="number" id="fit-${k}" data-k="${k}" step="${step}" min="${min}" value="${esc(st[k])}"${k === 'rate' ? ' placeholder="any"' : ''}>${hint ? `<span class="hint">${hint}</span>` : ''}</div>`;
  return `<fieldset><legend>Hardware</legend><div class="grid2">
      <div class="field wide"><label for="fit-gpu">GPU</label><select id="fit-gpu" data-k="gpu">${C.GPUS.map(g => opt(g.id, `${g.label} (${g.domain} per node)`, st.gpu)).join('')}</select></div>
      ${num('nodes', 'Nodes', 1, 1)}
      <div class="field"><label>GPUs</label><div class="mono" style="padding:6px 0" id="fit-gpus"></div></div>
    </div></fieldset>
    <fieldset><legend>Traffic</legend><div class="grid2">
      ${num('isl', 'Prompt tokens (median)', 100, 1)}${num('osl', 'Output tokens (median)', 50, 1)}
      <div class="field wide"><label for="fit-rate">Requests per second to carry</label><input type="number" id="fit-rate" data-k="rate" step="1" min="0" placeholder="any: rank by size or throughput" value="${esc(st.rate)}"><span class="hint">Leave empty to see what each model carries at most.</span></div>
    </div></fieldset>
    <fieldset><legend>Latency targets</legend><div class="grid2">${num('ttft', 'Time to first token (s)', 0.1, 0.05)}${num('tpotMs', 'Time per output token (ms)', 5, 1)}</div></fieldset>
    <fieldset><legend>Rank</legend><div class="chips" role="radiogroup" aria-label="Rank models by">
      <button type="button" class="chip${st.rank === 'largest' ? ' on' : ''}" data-rank="largest" role="radio" aria-checked="${st.rank === 'largest'}">Largest that fits</button>
      <button type="button" class="chip${st.rank === 'throughput' ? ' on' : ''}" data-rank="throughput" role="radio" aria-checked="${st.rank === 'throughput'}">Most throughput</button>
    </div><p class="hint" style="font-size:11.5px;color:var(--muted);margin:8px 0 0">Size is a stand-in for capability, not a quality score: compare the top few on your own evals.</p></fieldset>`;
}

function run() {
  const g = C.GPUS.find(x => x.id === st.gpu) || C.GPUS[0];
  $('#fit-gpus').textContent = `${st.nodes} × ${g.domain} = ${st.nodes * g.domain}`;
  const rate = st.rate === '' || st.rate == null ? undefined : +st.rate;
  result = F.fitModels({ gpu: g.id, nodes: +st.nodes }, { isl: +st.isl, osl: +st.osl, rate }, { ttftS: +st.ttft, tpotS: +st.tpotMs / 1000 }, { rank: st.rank });
  result.g = g;
  render();
}

function lay(L) { return !L ? '' : L.mode === 'agg' ? `${L.instances} × ${esc(L.label)}` : `P ${L.prefill.instances}×${esc(L.prefill.label)} · D ${L.decode.instances}×${esc(L.decode.label)}`; }

function render() {
  const r = result, max = Math.max(1e-9, ...r.rows.map(x => x.edge.rate || 0));
  const rows = r.rows.map(x => {
    const p = x.production, fits = p.rate > 0, picked = st.pick === x.model;
    const bar = `<div class="fitbar" aria-hidden="true"><span class="p" style="width:${(100 * (p.rate || 0) / max).toFixed(1)}%"></span><span class="e" style="width:${(100 * Math.max(0, (x.edge.rate || 0) - (p.rate || 0)) / max).toFixed(1)}%"></span></div>`;
    return `<tr class="${fits ? '' : 'nofit'}${picked ? ' picked' : ''}" data-model="${esc(x.model)}" tabindex="0" aria-selected="${picked}">
      <td>${r.need ? (x.meetsRate ? '<span class="ok" title="carries the rate">✓</span> ' : '<span class="no" title="does not carry the rate">·</span> ') : ''}${esc(x.name || x.model)}</td>
      <td class="n">${f1(x.params)}B</td>
      <td class="n">${fits ? f1(p.rate) : '–'}</td><td class="barcell">${fits ? bar : `<span class="why">${esc(p.why || 'does not fit')}</span>`}</td>
      <td class="n">${fits ? fInt(p.outTokensPerS) : '–'}</td><td class="n">${p.dollarsPerMOut ? '$' + p.dollarsPerMOut.toFixed(2) : '–'}</td><td class="mono">${fits ? lay(p.layout) : ''}</td></tr>`;
  }).join('');
  const meets = r.need ? r.rows.filter(x => x.meetsRate).length : null;
  $('#fit-results').innerHTML = `
    <section class="card verdict${r.need && !meets ? ' fail' : ''}">
      <h2>${r.need ? (meets ? `${meets} model${meets > 1 ? 's' : ''} carry ${f1(r.need)} req/s on ${st.nodes} × ${esc(r.g.label)} nodes` : `Nothing in the catalog carries ${f1(r.need)} req/s on ${st.nodes} node${st.nodes > 1 ? 's' : ''}`) : `What fits on ${st.nodes} × ${esc(r.g.label)} node${st.nodes > 1 ? 's' : ''}`}</h2>
      <p class="sub">Requests per second within TTFT ${f1(+st.ttft)} s and TPOT ${fInt(+st.tpotMs)} ms at ${fInt(+st.isl)} prompt / ${fInt(+st.osl)} output tokens. <b>Production</b> keeps 15% headroom, an N+1 spare node and 10% inside the targets; the lighter bar is the flat-out figure with none of that. Spec-sheet efficiencies, built-in catalog.</p>
      <div class="tablewrap"><table class="fittable"><thead><tr><th>Model</th><th class="n">Params</th><th class="n">Req/s</th><th><span class="lg p"></span>production <span class="lg e"></span>flat out</th><th class="n">Output tok/s</th><th class="n">$ / 1M out</th><th>Layout</th></tr></thead><tbody>${rows}</tbody></table></div>
    </section>
    <section class="card" id="fit-detail">${detailHTML()}</section>`;
}

function detailHTML() {
  if (!st.pick) return `<h2>Capacity of one model</h2><p class="sub">Click a model for the most it carries, its concurrency and the longest prompt that still meets the target.</p>`;
  const c = F.capacity(st.pick, { gpu: st.gpu, nodes: +st.nodes }, { isl: +st.isl, osl: +st.osl }, { ttftS: +st.ttft, tpotS: +st.tpotMs / 1000 }, {});
  const p = c.production, L = p.layout;
  if (!p.rate) return `<h2>${esc(c.name)}</h2><p class="sub">Doesn't fit: ${esc(p.why)}${c.edge.rate ? ` (flat out, with no headroom or spare, it would carry ${f1(c.edge.rate)} req/s)` : ''}.</p>`;
  const cmd = `fleetops serving deploy --model ${c.model} --gpu ${st.gpu} --nodes ${st.nodes} --isl ${st.isl} --osl ${st.osl} --ttft ${st.ttft} --tpot ${(+st.tpotMs / 1000)}${L.mode === 'disagg' ? ' --mode disagg' : ''}`;
  const kv = (k, v) => `<div><div class="k">${k}</div><div class="v">${v}</div></div>`;
  return `<h2>${esc(c.name)} on ${c.gpus} × ${esc(st.gpu)}</h2>
    <div class="kvgrid">
      ${kv('Max load (production)', `${f1(p.rate)} req/s`)}${kv('Flat out', `${f1(c.edge.rate)} req/s`)}${kv('Output tokens/s', fInt(p.outTokensPerS))}
      ${kv('Concurrency', `${fInt(L.concurrency)} sequences`)}${kv('Layout', lay(L) + (L.mode === 'agg' ? ` (${L.gpusPerInstance} GPU${L.gpusPerInstance > 1 ? 's' : ''} each)` : ''))}${kv('Nodes with the spare', p.nodes)}
      ${kv('Longest prompt', c.maxPrompt ? `${fInt(c.maxPrompt)} tokens` : 'none fits')}${kv('Model maximum', `${fInt(c.modelMaxCtx)} tokens`)}${kv('$ per 1M output tokens', p.dollarsPerMOut ? '$' + p.dollarsPerMOut.toFixed(2) : '–')}
    </div>
    <p class="sub" style="margin-top:12px">${esc(p.reason || '')}</p>
    <div class="cmdrow"><code id="fit-cmd">${esc(cmd)}</code><button type="button" id="fit-copy">Copy</button></div>
    <p class="sub">Deploy it on Kubernetes with fleetops (a dry run until <code>--apply</code>), then load-test the endpoint before production traffic: these are estimates.</p>`;
}

function schedule() { clearTimeout(timer); timer = setTimeout(() => { save(st); run(); }, 120); }
function onInput(e) { const k = e.target.dataset.k; if (!k) return; st[k] = e.target.type === 'number' ? (e.target.value === '' ? '' : +e.target.value) : e.target.value; if (k === 'gpu' || k === 'nodes') st.pick = st.pick; schedule(); }
function pick(m) { st.pick = st.pick === m ? null : m; save(st); render(); const d = document.getElementById('fit-detail'); if (st.pick && d) d.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }

function show(view) {
  const fit = view === 'fit';
  $('.layout').hidden = fit; $('#fitview').hidden = !fit; $('#spec').hidden = fit;
  for (const b of document.querySelectorAll('[data-view]')) { const on = b.dataset.view === view; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); }
  try { localStorage.setItem(KEY + ':view', view); } catch (e) {}
  if (fit && !result) run();
}

function init() {
  const host = document.getElementById('fitview'); if (!host || !F) return;
  $('#fit-inputs').innerHTML = inputsHTML();
  $('#fit-inputs').addEventListener('input', onInput);
  $('#fit-inputs').addEventListener('click', e => { const b = e.target.closest('[data-rank]'); if (!b) return; st.rank = b.dataset.rank; for (const x of document.querySelectorAll('[data-rank]')) { x.classList.toggle('on', x === b); x.setAttribute('aria-checked', x === b); } schedule(); });
  $('#fit-results').addEventListener('click', e => {
    if (e.target.id === 'fit-copy') { navigator.clipboard && navigator.clipboard.writeText($('#fit-cmd').textContent); e.target.textContent = 'Copied'; return; }
    const tr = e.target.closest('tr[data-model]'); if (tr) pick(tr.dataset.model);
  });
  $('#fit-results').addEventListener('keydown', e => { const tr = e.target.closest('tr[data-model]'); if (tr && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); pick(tr.dataset.model); } });
  for (const b of document.querySelectorAll('[data-view]')) b.addEventListener('click', () => show(b.dataset.view));
  let v = 'size'; try { v = localStorage.getItem(KEY + ':view') || 'size'; } catch (e) {}
  if (location.hash === '#fit') v = 'fit';
  show(v);
}
init();
})();

</script>
</body>
</html>
